
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f5">
    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .construction-image {
            display: block;
            width: 100%;
            max-width: 640px;
            height: auto;
            margin: 0 auto 30px;
        }

        .message {
            font-size: 16px;
            line-height: 1.7;
            color: #777;
            margin-bottom: 18px;
        }

        .contact {
            font-size: 15px;
            color: #777;
        }

        .contact a {
            color: #222;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid #d5a52b;
            padding-bottom: 2px;
            transition: color 0.2s ease;
        }

        .contact a:hover {
            color: #b58b22;
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="construction-image"
            src="https://cdn.pixabay.com/photo/2017/10/26/17/51/under-construction-2891888_640.jpg"
            alt="Construction illustration"
        >

        <p class="message">
            We're currently working behind the scenes to bring
            you something new. Please check back soon.
        </p>

        <p class="contact">
            Questions?
            <a
                href="https://docs.google.com/forms/d/e/1FAIpQLSdoNvF4_XXef197FJ05ZgomdBOumgj9B0xTz54KuWUXaHXx9A/viewform?usp=header"
                target="_blank"
                rel="noopener noreferrer"
            >Use this form to get in touch.</a>
        </p>

    </main>

</body>
</html>
