
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FINTECH — Personal. Finance. Reimagined.</title>

  <meta name="description" content="A private, manual-entry personal finance dashboard — no bank linking, real-time sync, fully isolated per account.">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" type="image/svg+xml" href="https://www.jstafki.com/assets/fintech/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jstafki.com/fintech/">
  <meta property="og:title" content="FINTECH — Personal. Finance. Reimagined.">
  <meta property="og:description" content="Track spending, monitor cash flow, and manage your finances with clarity — no bank linking required.">
  <meta property="og:image" content="https://www.jstafki.com/assets/fintech/FINTECH.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FINTECH — Personal. Finance. Reimagined.">
  <meta name="twitter:description" content="Track spending, monitor cash flow, and manage your finances with clarity — no bank linking required.">
  <meta name="twitter:image" content="https://www.jstafki.com/assets/fintech/FINTECH.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    /* =========================================
       ROOT VARIABLES
    ========================================= */

    :root {
      color-scheme: light dark;

      --bg: #f5f7fb;
      --ink: #17232d;
      --muted: #5b6778;
      --hover: rgba(23, 35, 45, .07);

      --wordmark-solid: #000000;

      --brand-gradient: linear-gradient(
        135deg,
        #00f2fe 0%,
        #3a7bd5 60%,
        #4facfe 85%,
        #80ffdb 98%
      );

      --btn-gradient: linear-gradient(
        135deg,
        #00f2fe 0%,
        #4facfe 100%
      );

      --sans: "Manrope", "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
      --ui: "Product Sans", "Google Sans", "Open Sans", sans-serif;
    }


    /* =========================================
       DARK MODE
    ========================================= */

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1c;
        --ink: #f1f5f9;
        --muted: #94a3b8;
        --hover: rgba(241, 245, 249, .09);

        --wordmark-solid: #ffffff;
      }
    }


    /* =========================================
       GLOBAL
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
    }

    a:focus-visible {
      outline: 2px solid #4facfe;
      outline-offset: 3px;
    }


    /* =========================================
       NAVIGATION
    ========================================= */

    .top-nav {
      position: fixed;
      top: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: .25rem;

      width: max-content;
      max-width: calc(100% - 2rem);
    }

    .nav-link {
      font-size: .92rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;

      padding: .5rem .85rem;
      border-radius: 9999px;

      white-space: nowrap;

      transition: background .2s, color .2s;
    }

    .nav-link:hover {
      color: var(--ink);
      background: var(--hover);
    }


    /* =========================================
       MAIN STAGE
    ========================================= */

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 1.5rem;

      width: 100%;
      min-height: 100svh;
      padding: 7vw;
    }


    /* =========================================
       FINTECH WORDMARK
    ========================================= */

    h1 {
      --track: .1em;
      --cap-gap: .117em;
      --arrow-h: .82em;

      display: inline-flex;
      margin: 0;

      font: 600 clamp(2.4rem, 13vw, 10.25rem)/1 var(--sans);

      letter-spacing: var(--track);

      padding: 0 calc(var(--arrow-h) * 1.167) 0 var(--track);

      white-space: nowrap;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;

      filter: drop-shadow(0 10px 18px rgba(23, 35, 45, .12));
    }

    .word {
      display: flex;
    }


    /* FINTE: SOLID COLOR */

    .char {
      display: block;

      color: var(--wordmark-solid);
      -webkit-text-fill-color: var(--wordmark-solid);

      opacity: 0;
      transform: translateY(.14em);

      animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;

      animation-delay: calc(.15s + var(--char-index) * .07s);
    }


    /* C AND H: GRADIENT */

    .char:nth-child(6),
    .h-anchor .char {
      background: var(--brand-gradient);

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }


    /* WORDMARK ANIMATION */

    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }


    /* =========================================
       RISING STOCK ARROW
    ========================================= */

    .h-anchor {
      position: relative;
      display: block;
    }

    .jagged-arrow {
      position: absolute;

      left: calc(100% - .02em);
      bottom: calc(var(--cap-gap) - var(--arrow-h) * .0625);

      height: var(--arrow-h);
      width: calc(var(--arrow-h) * 1.167);

      overflow: visible;
      pointer-events: none;
    }

    .jagged-arrow path {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1;

      animation: draw 1.1s cubic-bezier(.4, 0, .2, 1) 1.3s forwards;
    }

    .jagged-arrow .head {
      animation-duration: .25s;
      animation-delay: 2.3s;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }


    /* =========================================
       TAGLINE — WORD-BY-WORD FADE
    ========================================= */

    .tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: .35em;

      margin: 0;

      font-size: clamp(1rem, 1.5vw, 1.2rem);
      font-weight: 500;

      color: var(--muted);
    }

    .tagline span {
      opacity: 0;

      animation: word-fade .8s ease forwards;

      animation-delay: calc(2.75s + var(--word-index) * .65s);
    }

    @keyframes word-fade {
      to {
        opacity: 1;
      }
    }


    /* =========================================
       NEXT BUTTON
    ========================================= */

    .next-btn {
      position: fixed;

      right: 2.5rem;
      bottom: 2.5rem;

      z-index: 10;

      display: grid;
      place-items: center;

      width: 60px;
      height: 60px;

      border-radius: 50%;

      background: var(--btn-gradient);
      color: #17232d;

      box-shadow: 0 12px 30px rgba(0, 242, 254, .35);

      transition: transform .25s ease, box-shadow .25s ease;
    }

    .next-btn:hover {
      transform: translateX(3px);

      box-shadow: 0 16px 36px rgba(0, 242, 254, .5);
    }

    .next-btn svg {
      width: 24px;
      height: 24px;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .top-nav {
        top: 1rem;
        gap: 0;
      }

      .nav-link {
        font-size: .8rem;
        padding: .45rem .55rem;
      }

      .stage {
        padding: 5vw;
      }

      .next-btn {
        right: 1.5rem;
        bottom: 1.5rem;

        width: 52px;
        height: 52px;
      }
    }


    /* =========================================
       REDUCED MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      .char,
      .tagline span {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .jagged-arrow path {
        animation: none;
        stroke-dashoffset: 0;
      }

      .next-btn:hover {
        transform: none;
      }
    }

  </style>
</head>


<body>

  <!-- NAVIGATION -->

  <nav class="top-nav" aria-label="Main Navigation">

    <a href="https://www.jstafki.com/fintech/version/" class="nav-link">
      Version
    </a>

    <a href="https://www.jstafki.com/fintech/features/" class="nav-link">
      Features
    </a>

    <a href="https://www.jstafki.com/fintech/pricing/" class="nav-link">
      Pricing
    </a>

    <a href="https://www.jstafki.com/fintech/demo/" class="nav-link">
      Demo
    </a>

    <a href="https://www.jstafki.com/fintech/privacy/" class="nav-link">
      Privacy
    </a>

    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSdoNvF4_XXef197FJ05ZgomdBOumgj9B0xTz54KuWUXaHXx9A/viewform?usp=header"
      class="nav-link"
      target="_blank"
      rel="noopener noreferrer"
    >
      Contact
    </a>

  </nav>


  <!-- MAIN CONTENT -->

  <main class="stage" aria-label="FINTECH brand concept">


    <!-- WORDMARK -->

    <h1 aria-label="FINTECH">

      <span class="word" aria-hidden="true">

        <span class="char" style="--char-index: 0;">F</span>
        <span class="char" style="--char-index: 1;">I</span>
        <span class="char" style="--char-index: 2;">N</span>
        <span class="char" style="--char-index: 3;">T</span>
        <span class="char" style="--char-index: 4;">E</span>
        <span class="char" style="--char-index: 5;">C</span>

        <span class="h-anchor">

          <span class="char" style="--char-index: 6;">H</span>

          <!-- RISING ARROW -->

          <svg
            class="jagged-arrow"
            viewBox="0 0 70 60"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >

            <defs>
              <linearGradient
                id="arrow-gradient"
                gradientUnits="userSpaceOnUse"
                x1="4"
                y1="54"
                x2="64"
                y2="6"
              >
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="60%" stop-color="#3a7bd5" />
                <stop offset="85%" stop-color="#4facfe" />
                <stop offset="98%" stop-color="#80ffdb" />
              </linearGradient>
            </defs>

            <g
              stroke="url(#arrow-gradient)"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <path
                class="line"
                pathLength="1"
                d="M 4 54 L 16 38 L 23 45 L 36 24 L 43 31 L 64 6"
              />

              <path
                class="head"
                pathLength="1"
                d="M 49.33 9.12 L 64 6 L 63.48 20.99"
              />

            </g>

          </svg>

        </span>

      </span>

    </h1>


    <!-- WORD-BY-WORD TAGLINE -->

    <p class="tagline" aria-label="Personal. Finance. Reimagined.">

      <span style="--word-index: 0;">Personal.</span>
      <span style="--word-index: 1;">Finance.</span>
      <span style="--word-index: 2;">Reimagined.</span>

    </p>


    <!-- NEXT BUTTON -->

    <a
      href="https://www.jstafki.com/fintech/tech"
      class="next-btn"
      aria-label="Next"
    >

      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">

        <path
          d="M4 12h14.5M13 5.5l6.5 6.5-6.5 6.5"
          stroke="currentColor"
          stroke-width="2.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

      </svg>

    </a>

  </main>

</body>
</html>
