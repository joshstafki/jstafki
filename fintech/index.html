<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINTECH — Personal. Finance. Reimagined.</title>
  <meta name="description" content="A private, manual-entry personal finance dashboard — no bank linking, real-time sync, fully isolated per account.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="https://www.jstafki.com/assets/fintech/favicon.svg">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jstafki.com/projects/fintech/">
  <meta property="og:title" content="FINTECH — Personal. Finance. Reimagined.">
  <meta property="og:description" content="Track spending, monitor cash flow, and manage your finances with clarity — no bank linking required.">
  <meta property="og:image" content="https://www.jstafki.com/assets/fintech/FINTECH.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="FINTECH — a private personal finance dashboard">
  <meta property="og:site_name" content="FINTECH">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://www.jstafki.com/projects/fintech/">
  <meta name="twitter:title" content="FINTECH — Personal. Finance. Reimagined.">
  <meta name="twitter:description" content="Track spending, monitor cash flow, and manage your finances with clarity — no bank linking required.">
  <meta name="twitter:image" content="https://www.jstafki.com/assets/fintech/FINTECH.png">
  <meta name="twitter:image:alt" content="FINTECH — a private personal finance dashboard">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17232d;
      --charcoal: #2d3748;
      /* Heading accent gradient */
      --brand-gradient: linear-gradient(135deg, #00f2fe 0%, #3a7bd5 60%, #4facfe 85%, #80ffdb 98%);
      /* Single shade lighter blue gradient for the pill button */
      --btn-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
    }

    /* Top Navigation Styling */
    .top-nav {
      position: fixed;
      top: 2rem;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 9999px;
    }

    .nav-link {
      font-family: "Product Sans", "Google Sans", "Open Sans", sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--charcoal);
      text-decoration: none;
      padding: 0.6rem 1.25rem;
      border-radius: 9999px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      background: transparent;
    }

    /* Clear Glassmorphic Bubble Selector for Hover and Active States */
    .nav-link:hover,
    .nav-link.active {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.06),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.8),
                  inset 0 -1px 1px 0 rgba(0, 0, 0, 0.05);
      color: #0f172a;
    }

    .stage {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100svh;
      padding: 7vw;
    }

    h1 {
      position: relative;
      margin: 0;
      font-family: "Manrope", "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(4rem, 11vw, 10.25rem);
      line-height: 1;
      font-weight: 600;
      letter-spacing: .115em;
      padding-left: .115em;
      text-align: center;
      white-space: nowrap;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      filter: drop-shadow(0 10px 18px rgba(23, 35, 45, 0.12));
      display: inline-flex;
      align-items: center;
    }

    /* Individual Letter Entry Animation */
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateX(120vw);
      animation: slideInLetter 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--char-index) * 0.09s);
    }

    @keyframes slideInLetter {
      0% {
        opacity: 0;
        transform: translateX(120vw);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .brand-base {
      color: var(--ink);
    }

    .brand-accent {
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Container attached to the right base of 'H' */
    .h-wrapper {
      position: relative;
      display: inline-block;
    }

    /* Jagged Dynamic Pulse Arrow */
    .jagged-arrow {
      position: absolute;
      left: calc(100% - 0.15em);
      bottom: 0.08em;
      width: 0.45em;
      height: 0.65em;
      pointer-events: none;
      opacity: 0;
      transform-origin: bottom left;
      transform: scale(0) translateY(10px);
      animation: pulseJagged 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      /* Waits for all 7 letters to complete assembly (~1.1s total) */
      animation-delay: 1.15s;
    }

    .jagged-arrow path {
      stroke: url(#arrow-gradient);
    }

    @keyframes pulseJagged {
      0% {
        opacity: 0;
        transform: scale(0.4) translateY(12px);
      }
      25% {
        opacity: 1;
        transform: scale(1.1) translateY(-4px);
      }
      45% {
        opacity: 0.9;
        transform: scale(1) translateY(0);
      }
      70% {
        opacity: 1;
        transform: scale(1.15) translateY(-8px);
      }
      100% {
        opacity: 0;
        transform: scale(0.5) translateY(-16px);
      }
    }

    /* Floating Pill Button - Extended Lengthwise */
    .pill-btn {
      position: fixed;
      bottom: 2.75rem;
      right: 2.75rem;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 160px;
      height: 64px;
      padding-right: 8px;
      border-radius: 9999px;
      background: var(--btn-gradient);
      border: none;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 242, 254, 0.4);
      overflow: visible;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      text-decoration: none;
    }

    .pill-btn:hover {
      box-shadow: 0 16px 36px rgba(0, 242, 254, 0.55);
    }

    /* Outlined Circle Wrapper */
    .arrow-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: transparent;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .arrow-icon {
      width: 26px;
      height: 26px;
      color: var(--ink);
    }

    /* Hover effect: The entire circle and arrow move up together */
    .pill-btn:hover .arrow-circle {
      transform: translateY(-6px);
    }

    @media (max-width: 600px) {
      .top-nav {
        top: 1rem;
        gap: 0.1rem;
      }
      .nav-link {
        padding: 0.4rem 0.75rem;
        font-size: 0.85rem;
      }
      .stage { padding: 5vw; }
      h1 {
        font-size: clamp(3rem, 14vw, 5.4rem);
        letter-spacing: .075em;
        padding-left: .075em;
      }
      .pill-btn {
        bottom: 1.75rem;
        right: 1.75rem;
        width: 130px;
        height: 52px;
        padding-right: 6px;
      }
      .arrow-circle {
        width: 40px;
        height: 40px;
      }
      .arrow-icon {
        width: 20px;
        height: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .char {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .jagged-arrow {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .pill-btn:hover .arrow-circle {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <!-- SVG Gradient Definitions -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="arrow-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f2fe" />
        <stop offset="60%" stop-color="#3a7bd5" />
        <stop offset="85%" stop-color="#4facfe" />
        <stop offset="98%" stop-color="#80ffdb" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Top Glassmorphic Navigation -->
  <nav class="top-nav" aria-label="Main Navigation">
    <a href="#version" class="nav-link active">Version</a>
    <a href="#features" class="nav-link">Features</a>
    <a href="#pricing" class="nav-link">Pricing</a>
    <a href="#privacy" class="nav-link">Privacy</a>
    <a href="#contact" class="nav-link">Contact</a>
  </nav>

  <main class="stage" aria-label="FINTECH brand concept">
    <h1>
      <span class="brand-base">
        <span class="char" style="--char-index: 0;">F</span>
        <span class="char" style="--char-index: 1;">I</span>
        <span class="char" style="--char-index: 2;">N</span>
        <span class="char" style="--char-index: 3;">T</span>
        <span class="char" style="--char-index: 4;">E</span>
      </span>
      <span class="brand-accent">
        <span class="char" style="--char-index: 5;">C</span>
        <span class="h-wrapper char" style="--char-index: 6;">
          H
          <svg class="jagged-arrow" viewBox="0 0 40 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 6 54 L 14 36 L 24 44 L 34 8 M 34 8 L 22 12 M 34 8 L 32 20" 
                  stroke-width="5.5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
          </svg>
        </span>
      </span>
    </h1>
    
    <a href="https://www.jstafki.com/fintech/tech" class="pill-btn" aria-label="Next">
      <div class="arrow-circle">
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12h14.5M13 5.5l6.5 6.5-6.5 6.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </a>
  </main>
</body>
</html>
