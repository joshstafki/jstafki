<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Release history · FINTECH</title>
<meta name="description" content="Every FINTECH version and what changed.">
<link rel="icon" type="image/svg+xml" href="https://www.jstafki.com/assets/fintech/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root {
  --bg: #fff;
  --text: #172235;
  --muted: #6b7789;
  --line: #e6eaf0;
  --soft: #f6f8fb;
  --accent: #244b80;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { width: min(880px, 100%); margin: 0 auto; padding: 0 24px; }

header { border-bottom: 1px solid var(--line); }
header .wrap {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
  letter-spacing: -.3px;
}
.brand img { width: 28px; height: 28px; display: block; }
.back { color: var(--muted); font-size: 13px; text-decoration: none; }
.back:hover, .brand:focus-visible, .back:focus-visible { color: var(--accent); }

main { padding: 56px 0 72px; }
h1 { margin: 0; font-size: clamp(32px, 6vw, 44px); letter-spacing: -1.5px; line-height: 1.1; }
.lede { margin: 12px 0 40px; color: var(--muted); }

.current {
  padding: 24px 28px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  background: var(--soft);
}
.current .label { color: var(--muted); font-size: 13px; }
.current .version {
  margin: 2px 0 10px;
  color: var(--accent);
  font-size: clamp(28px, 5vw, 36px);
  font-weight: 700;
  letter-spacing: -1px;
  overflow-wrap: anywhere;
}
.current .desc { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.current .desc.empty { color: var(--muted); }

.history { margin-top: 56px; }
.history-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
h2 { margin: 0; font-size: 20px; letter-spacing: -.5px; }
.count { color: var(--muted); font-size: 13px; }

.search {
  width: 100%;
  height: 42px;
  margin-bottom: 16px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 14px;
}
.search:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.table-frame { overflow-x: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
th { padding: 12px 16px 12px 0; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
th button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
th button:hover { color: var(--accent); }
td {
  padding: 14px 16px 14px 0;
  border-top: 1px solid var(--line);
  vertical-align: top;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
td:first-child { color: var(--accent); font-weight: 600; white-space: nowrap; }
.empty-state { padding: 32px 0; color: var(--muted); text-align: center; }

.error {
  display: none;
  margin-bottom: 24px;
  padding: 12px 16px;
  border-radius: 8px;
  background: #fff0f0;
  color: #a63838;
  font-size: 14px;
}

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-top: 20px; padding-bottom: 20px; }

@media (max-width: 600px) {
  .wrap { padding: 0 18px; }
  main { padding-top: 36px; }
  .current { padding: 20px; }
}
</style>
</head>

<body>
<header>
  <div class="wrap">
    <a class="brand" href="https://www.jstafki.com/fintech/" aria-label="FINTECH home">
      <img src="https://www.jstafki.com/assets/fintech/favicon.svg" alt="">
      <span>FINTECH</span>
    </a>
    <a class="back" href="https://www.jstafki.com/fintech/">Back to FINTECH</a>
  </div>
</header>

<main class="wrap">
  <h1>Release history</h1>
  <p class="lede">Every FINTECH version and what changed.</p>

  <div class="error" id="errorBox" role="alert"></div>

  <section class="current" aria-label="Current release">
    <div class="label">Current version</div>
    <div class="version" id="currentVersion">—</div>
    <p class="desc empty" id="currentDescription">Loading…</p>
  </section>

  <section class="history">
    <div class="history-head">
      <h2>All releases</h2>
      <span class="count" id="recordCount"></span>
    </div>
    <input class="search" id="searchInput" type="search" placeholder="Search releases" aria-label="Search releases">
    <div class="table-frame">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">FINTECH</div>
</footer>

<script>
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/" +
  "2PACX-1vSg3xBLpEFJwGqCLDx8dmfTQ0Q2F3eQz5Nz3axaUDb75-hdpTjJ-EKtDO8jX5bniXvnQmZB_oPI_B8l/" +
  "pub?output=csv";

const HEADER_ROW = 3;      // Spreadsheet row 4
const FIRST_DATA_ROW = 4;  // Spreadsheet row 5
const REFRESH_MS = 60000;

let headers = [];
let records = [];
let sortColumn = 0;
let sortDirection = -1;
let loading = false;
let hasLoaded = false;

const $ = id => document.getElementById(id);
const clean = value => String(value ?? "").trim();
const cell = (rows, row, col) => clean(rows[row]?.[col]);

function findLastValue(rows, column) {
  for (let i = rows.length - 1; i >= FIRST_DATA_ROW; i--) {
    const value = cell(rows, i, column);
    if (value) return value;
  }
  return "";
}

function updateCurrent(rows) {
  // B1 (version) and D1 (description); fall back to the history columns
  // because merged cells don't always serialize as expected.
  const version = cell(rows, 0, 1) || findLastValue(rows, 0);
  const description = cell(rows, 0, 3) || findLastValue(rows, 1);

  $("currentVersion").textContent = version || "—";
  const node = $("currentDescription");
  node.textContent = description || "No release description available.";
  node.classList.toggle("empty", !description);
}

function renderHeaders() {
  const tr = document.createElement("tr");
  headers.forEach((header, index) => {
    const th = document.createElement("th");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = header + (sortColumn === index ? (sortDirection === 1 ? " ↑" : " ↓") : "");
    button.addEventListener("click", () => {
      if (sortColumn === index) {
        sortDirection *= -1;
      } else {
        sortColumn = index;
        sortDirection = 1;
      }
      renderHeaders();
      renderRecords();
    });
    th.appendChild(button);
    tr.appendChild(th);
  });
  $("tableHead").replaceChildren(tr);
}

function renderRecords() {
  const tbody = $("tableBody");
  tbody.replaceChildren();

  const query = clean($("searchInput").value).toLowerCase();
  const filtered = records
    .filter(row => row.some(value => value.toLowerCase().includes(query)))
    .sort((a, b) =>
      clean(a[sortColumn]).localeCompare(clean(b[sortColumn]), undefined, {
        numeric: true,
        sensitivity: "base"
      }) * sortDirection
    );

  $("recordCount").textContent = query
    ? `${filtered.length} of ${records.length}`
    : `${records.length} releases`;

  if (!filtered.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = Math.max(headers.length, 1);
    td.className = "empty-state";
    td.textContent = records.length ? "No releases match your search." : "No releases yet.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  filtered.forEach(row => {
    const tr = document.createElement("tr");
    row.forEach(value => {
      const td = document.createElement("td");
      td.textContent = value || "—";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function processCSV(csv) {
  const rows = Papa.parse(csv, { skipEmptyLines: false }).data;

  if (!rows || rows.length <= HEADER_ROW) {
    throw new Error("Spreadsheet row 4 could not be found.");
  }

  updateCurrent(rows);

  const rawHeaders = (rows[HEADER_ROW] || []).map(clean);
  while (rawHeaders.length && !rawHeaders[rawHeaders.length - 1]) rawHeaders.pop();
  if (!rawHeaders.length) throw new Error("No column headers were found on row 4.");

  headers = rawHeaders.map((value, index) => value || `Column ${index + 1}`);
  records = rows.slice(FIRST_DATA_ROW)
    .filter(row => row.some(value => clean(value) !== ""))
    .map(row => headers.map((_, index) => clean(row[index])));

  renderHeaders();
  renderRecords();
}

async function loadSheet() {
  if (loading) return;
  loading = true;

  try {
    const url = new URL(SHEET_URL);
    url.searchParams.set("_", String(Date.now()));

    const response = await fetch(url.toString());
    if (!response.ok) throw new Error(`Request failed (HTTP ${response.status}).`);

    const csv = await response.text();
    if (!csv.trim() || /<html[\s>]/i.test(csv.slice(0, 500))) {
      throw new Error("Google Sheets did not return CSV data.");
    }

    processCSV(csv);
    hasLoaded = true;
    $("errorBox").style.display = "none";
  } catch (error) {
    console.error("FINTECH release history:", error);
    // Keep showing the last good data; only surface an error if nothing has loaded.
    if (!hasLoaded) {
      $("errorBox").textContent = "Release data couldn't be loaded. " + error.message + " Try again shortly.";
      $("errorBox").style.display = "block";
      $("currentDescription").textContent = "Unavailable right now.";
    }
  } finally {
    loading = false;
  }
}

$("searchInput").addEventListener("input", renderRecords);
loadSheet();
setInterval(loadSheet, REFRESH_MS);
</script>
</body>
</html>
