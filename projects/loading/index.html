<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=JetBrains+Mono:wght@300;400&display=swap');

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; }

:root {
  --magenta:#ff2bd6;
  --cyan:#00e5ff;
  --amber:#ffb300;
  --violet:#8b5cf6;
  --lime:#a3ff2b;
}

/* ── Spins ── */
@keyframes spinF { to { transform:rotate(360deg); } }
@keyframes spinB { to { transform:rotate(-360deg); } }

/* ── Full-spectrum hue cycling ── */
@keyframes hueSpin { to { filter:hue-rotate(360deg); } }

/* ── Liquid blob swirls ── */
@keyframes swirl1 {
  0%,100% { transform:translate(-18%,-14%) scale(1); }
  33%     { transform:translate(22%,10%)   scale(1.28); }
  66%     { transform:translate(-10%,26%)  scale(0.82); }
}
@keyframes swirl2 {
  0%,100% { transform:translate(20%,16%)  scale(1); }
  30%     { transform:translate(-24%,-6%) scale(0.85); }
  62%     { transform:translate(8%,-24%)  scale(1.32); }
}
@keyframes swirl3 {
  0%,100% { transform:translate(-6%,24%)  scale(1.1); }
  40%     { transform:translate(18%,-18%) scale(0.8); }
  75%     { transform:translate(-26%,2%)  scale(1.25); }
}
@keyframes swirl4 {
  0%,100% { transform:translate(14%,-22%) scale(0.9); }
  45%     { transform:translate(-16%,14%) scale(1.3); }
  80%     { transform:translate(24%,22%)  scale(0.85); }
}
@keyframes swirl5 {
  0%,100% { transform:translate(0,0)       scale(1.2); }
  50%     { transform:translate(-20%,-20%) scale(0.78); }
}

/* ── Membrane morph ── */
@keyframes morph {
  0%,100% { border-radius:42% 58% 55% 45% / 48% 42% 58% 52%; transform:rotate(0deg)   scale(1); }
  33%     { border-radius:58% 42% 40% 60% / 55% 60% 40% 45%; transform:rotate(120deg) scale(1.07); }
  66%     { border-radius:45% 55% 62% 38% / 40% 52% 48% 60%; transform:rotate(240deg) scale(0.96); }
}

/* ── Halo / core ── */
@keyframes haloBreath {
  0%,100% { opacity:0.5; }
  50%     { opacity:0.75; }
}
@keyframes nucleusPulse {
  0%,100% { transform:translate(-50%,-50%) scale(1);    opacity:0.92; }
  50%     { transform:translate(-50%,-50%) scale(1.35); opacity:1; }
}
@keyframes orbBreath {
  0%,100% { transform:scale(1); }
  50%     { transform:scale(1.035); }
}

/* ── Sparkles ── */
@keyframes twinkle {
  0%,100% { transform:scale(0.35) rotate(0deg);  opacity:0; }
  50%     { transform:scale(1.15) rotate(90deg); opacity:1; }
}

/* ── Ripples ── */
@keyframes rippleOut {
  from { transform:scale(0.35); opacity:0.8; }
  to   { transform:scale(4.6);  opacity:0; }
}

/* ── Aurora ── */
@keyframes auroraA {
  0%,100% { transform:translate(0,0)      scale(1)    rotate(0deg); }
  33%     { transform:translate(9%,-11%)  scale(1.2)  rotate(40deg); }
  66%     { transform:translate(-8%,7%)   scale(0.88) rotate(-30deg); }
}
@keyframes auroraB {
  0%,100% { transform:translate(0,0)      scale(1); }
  40%     { transform:translate(-12%,9%)  scale(1.15); }
  75%     { transform:translate(10%,-7%)  scale(0.9); }
}
@keyframes auroraC {
  0%,100% { transform:translate(0,0)     scale(1); }
  55%     { transform:translate(7%,13%)  scale(1.25); }
}

/* ── Progress bar ── */
@keyframes bgSlide { to { background-position:200% 0; } }

/* ── Message ── */
@keyframes msgFade {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ═══ Layout ═══ */
.root {
  width:100vw;
  height:100vh;
  height:100dvh;
  background:#0b0b14;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  user-select:none;
}

/* Aurora field */
.aurora { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.aurora div { position:absolute; }
.aur-a {
  width:58vw; height:58vw; top:-6%; left:-8%;
  background:radial-gradient(circle, rgba(255,43,214,0.27) 0%, transparent 68%);
  filter:blur(90px);
  animation:auroraA 26s ease-in-out infinite;
}
.aur-b {
  width:52vw; height:52vw; bottom:-4%; right:-6%;
  background:radial-gradient(circle, rgba(0,229,255,0.24) 0%, transparent 68%);
  filter:blur(100px);
  animation:auroraB 21s ease-in-out infinite 3s;
}
.aur-c {
  width:40vw; height:40vw; top:52%; left:26%;
  background:radial-gradient(circle, rgba(139,92,246,0.22) 0%, transparent 68%);
  filter:blur(105px);
  animation:auroraC 30s ease-in-out infinite 7s;
}

.vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 74% 74% at 50% 50%, transparent 0%, rgba(11,11,20,0.6) 100%);
  pointer-events:none;
  z-index:2;
}

/* Title */
.loader-title {
  font-family:'Unbounded',sans-serif;
  font-weight:500;
  letter-spacing:0.01em;
  text-align:center;
  color:rgba(250,250,255,0.95);
  text-shadow:
    -1.5px 0 rgba(255,43,214,0.45),
     1.5px 0 rgba(0,229,255,0.45),
     0 0 24px rgba(255,255,255,0.18);
  background:transparent;
  border:none;
  outline:none;
  caret-color:var(--magenta);
  width:100%;
  max-width:640px;
  padding:0 1rem;
  font-size:clamp(1.25rem,3vw,2rem);
  margin-bottom:2.5rem;
  z-index:10;
}
.loader-title::selection { background:rgba(255,43,214,0.3); }
.loader-title::placeholder { color:rgba(250,250,255,0.22); text-shadow:none; }

/* Stage */
.stage {
  position:relative;
  width:400px; height:400px;
  z-index:10;
  overflow:visible;
  perspective:900px;
}

/* Halo */
.halo {
  position:absolute; top:50%; left:50%;
  width:300px; height:300px;
  margin:-150px 0 0 -150px;
  border-radius:50%;
  background:conic-gradient(var(--magenta),var(--amber),var(--lime),var(--cyan),var(--violet),var(--magenta));
  filter:blur(46px);
  animation:spinF 9s linear infinite, haloBreath 5s ease-in-out infinite;
}

/* Membrane */
.membrane {
  position:absolute; top:50%; left:50%;
  width:286px; height:286px;
  margin:-143px 0 0 -143px;
  background:linear-gradient(135deg, rgba(255,43,214,0.33), rgba(139,92,246,0.27), rgba(0,229,255,0.33));
  filter:blur(7px);
  animation:morph 13s ease-in-out infinite;
  opacity:0.6;
}

/* Liquid core */
.orb-shell {
  position:absolute; top:50%; left:50%;
  width:230px; height:230px;
  margin:-115px 0 0 -115px;
  animation:orbBreath 4.5s ease-in-out infinite;
  z-index:5;
}
.orb {
  position:absolute; inset:0;
  border-radius:50%;
  overflow:hidden;
  background:#12101f;
  border:1px solid rgba(255,255,255,0.16);
  box-shadow:
    0 0 60px rgba(255,43,214,0.2),
    0 0 120px rgba(0,229,255,0.13),
    inset 0 2px 0 rgba(255,255,255,0.2),
    inset 0 -14px 40px rgba(0,0,0,0.35);
}
.hue-chamber {
  position:absolute; inset:0;
  animation:hueSpin 16s linear infinite;
}
.blob { position:absolute; border-radius:50%; }
.b1 { width:72%; height:72%; top:2%;   left:-4%;  background:var(--magenta); filter:blur(34px); animation:swirl1 7s   ease-in-out infinite; }
.b2 { width:66%; height:66%; top:30%;  left:38%;  background:var(--cyan);    filter:blur(32px); animation:swirl2 8.5s ease-in-out infinite 0.6s; }
.b3 { width:58%; height:58%; top:-8%;  left:42%;  background:var(--amber);   filter:blur(30px); animation:swirl3 6.2s ease-in-out infinite 1.4s; }
.b4 { width:62%; height:62%; top:44%;  left:-6%;  background:var(--violet);  filter:blur(32px); animation:swirl4 9.2s ease-in-out infinite 2.2s; }
.b5 { width:48%; height:48%; top:24%;  left:22%;  background:var(--lime);    filter:blur(30px); animation:swirl5 5.4s ease-in-out infinite 0.9s; }

.specular {
  position:absolute; top:7%; left:13%;
  width:46%; height:34%;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,0.34) 0%, transparent 65%);
  filter:blur(4px);
}

/* Nucleus */
.nucleus {
  position:absolute; top:50%; left:50%;
  width:26px; height:26px;
  border-radius:50%;
  background:radial-gradient(circle, #fff 0%, rgba(255,255,255,0.55) 45%, transparent 75%);
  animation:nucleusPulse 2.4s ease-in-out infinite;
  z-index:7;
}

/* SVG arcs */
.arcs { position:absolute; inset:0; overflow:visible; z-index:6; }
.arc-outer {
  transform-origin:200px 200px;
  animation:spinF 1.6s linear infinite;
  filter:drop-shadow(0 0 7px rgba(255,43,214,0.67));
}
.arc-inner {
  transform-origin:200px 200px;
  animation:spinB 2.5s linear infinite;
  filter:drop-shadow(0 0 6px rgba(255,179,0,0.6));
}

/* Orbits (JS-built) */
.orbit-tilt {
  position:absolute; top:50%; left:50%;
  width:0; height:0;
  transform-style:preserve-3d;
  z-index:8;
}
.orbit-carrier { position:absolute; }
.orbit-dot { position:absolute; border-radius:50%; }

/* Ripples (JS-built) */
.ripple {
  position:absolute; top:50%; left:50%;
  width:90px; height:90px;
  margin:-45px 0 0 -45px;
  border-radius:50%;
  border:2px solid;
  filter:blur(0.5px);
  animation:rippleOut 3.3s ease-out forwards;
  pointer-events:none;
  z-index:3;
}

/* Sparkles (JS-built) */
.sparkle {
  position:absolute;
  line-height:1;
  pointer-events:none;
  z-index:9;
}

/* Message */
.msg-wrap {
  margin-top:2.4rem;
  height:1.8rem;
  display:flex; align-items:center; justify-content:center;
  z-index:10;
  min-width:280px;
}
.msg-text {
  color:rgba(210,215,235,0.9);
  font-family:'JetBrains Mono',monospace;
  font-weight:400;
  font-size:clamp(0.7rem,1.2vw,0.84rem);
  letter-spacing:0.05em;
  text-align:center;
  transition:opacity 0.35s ease;
}
.msg-in { animation:msgFade 0.4s ease; }

/* Progress bar */
.bar {
  margin-top:1.4rem;
  width:180px; height:4px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(255,255,255,0.07);
  z-index:10;
}
.bar-fill {
  width:100%; height:100%;
  border-radius:99px;
  background:linear-gradient(90deg, var(--magenta), var(--amber), var(--lime), var(--cyan), var(--violet), var(--magenta));
  background-size:200% 100%;
  animation:bgSlide 2.2s linear infinite;
}

/* Hint */
.hint {
  position:absolute; bottom:1.5rem;
  color:rgba(255,255,255,0.1);
  font-family:'JetBrains Mono',monospace;
  font-size:0.55rem;
  letter-spacing:0.14em;
  z-index:10;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; }
}
</style>
</head>
<body>

<div class="root">

  <!-- Aurora field -->
  <div class="aurora">
    <div class="aur-a"></div>
    <div class="aur-b"></div>
    <div class="aur-c"></div>
  </div>

  <div class="vignette"></div>

  <!-- Editable title -->
  <input class="loader-title" id="title" value="Loading" placeholder="what are you loading?" maxlength="40" aria-label="Loading task title">

  <!-- Stage -->
  <div class="stage" id="stage">

    <div class="halo"></div>
    <div class="membrane"></div>

    <!-- Liquid core -->
    <div class="orb-shell">
      <div class="orb">
        <div class="hue-chamber">
          <div class="blob b1"></div>
          <div class="blob b2"></div>
          <div class="blob b3"></div>
          <div class="blob b4"></div>
          <div class="blob b5"></div>
        </div>
        <div class="specular"></div>
      </div>
    </div>

    <div class="nucleus"></div>

    <!-- Round-cap gradient spinner arcs -->
    <svg class="arcs" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#ff2bd6"/>
          <stop offset="50%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#00e5ff"/>
        </linearGradient>
        <linearGradient id="rg2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="#ffb300"/>
          <stop offset="100%" stop-color="#ff2bd6"/>
        </linearGradient>
      </defs>
      <g class="arc-outer">
        <circle cx="200" cy="200" r="152" fill="none"
          stroke="url(#rg1)" stroke-width="5.5" stroke-linecap="round"
          stroke-dasharray="250 705"/>
      </g>
      <g class="arc-inner">
        <circle cx="200" cy="200" r="133" fill="none"
          stroke="url(#rg2)" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="170 666"/>
      </g>
    </svg>

    <!-- Orbits, sparkles, and ripples are built by JS -->
  </div>

  <!-- Status message -->
  <div class="msg-wrap">
    <p class="msg-text msg-in" id="msg">Prepping the hyperdrive...</p>
  </div>

  <!-- Sliding rainbow bar -->
  <div class="bar"><div class="bar-fill"></div></div>

  <p class="hint">click title to rename</p>

</div>

<script>
const MESSAGES = [
  "Prepping the hyperdrive...",
  "Reticulating splines...",
  "Convincing the electrons...",
  "Herding quantum hamsters...",
  "Polishing the photons...",
  "Untangling the wormholes...",
  "Downloading more RAM...",
  "Bribing the pixels...",
  "Consulting the oracle...",
  "Feeding the code gremlins...",
  "Spinning up a parallel universe...",
  "Teaching robots to dream...",
  "Charging the flux capacitor...",
  "Negotiating with gravity...",
  "Summoning the loading spirits...",
];

const stage = document.getElementById("stage");

/* ── 3D orbiting satellites ── */
const ORBITS = [
  { r: 168, tz:   0, dur: 2.3, rev: false, c: "#00e5ff", s: 9 },
  { r: 185, tz:  60, dur: 3.4, rev: true,  c: "#ff2bd6", s: 8 },
  { r: 152, tz: 120, dur: 4.6, rev: false, c: "#ffb300", s: 7 },
];

ORBITS.forEach(o => {
  const tilt = document.createElement("div");
  tilt.className = "orbit-tilt";
  tilt.style.transform = "rotateZ(" + o.tz + "deg) rotateX(72deg)";

  const carrier = document.createElement("div");
  carrier.className = "orbit-carrier";
  carrier.style.animation = (o.rev ? "spinB" : "spinF") + " " + o.dur + "s linear infinite";

  const dot = document.createElement("div");
  dot.className = "orbit-dot";
  dot.style.left = (o.r - o.s / 2) + "px";
  dot.style.top = (-o.s / 2) + "px";
  dot.style.width = o.s + "px";
  dot.style.height = o.s + "px";
  dot.style.background = o.c;
  dot.style.boxShadow = "0 0 " + (o.s * 1.6) + "px " + o.c + ", 0 0 " + (o.s * 4) + "px " + o.c + "88";

  carrier.appendChild(dot);
  tilt.appendChild(carrier);
  stage.appendChild(tilt);
});

/* ── Twinkling sparkles ── */
const SPARKLES = [
  { t:  6, l: 78, s: 15, c: "#00e5ff", dur: 2.6, del: 0.0 },
  { t: 14, l: 12, s: 11, c: "#ff2bd6", dur: 3.1, del: 0.7 },
  { t: 30, l: 92, s: 13, c: "#ffb300", dur: 2.2, del: 1.4 },
  { t: 55, l:  3, s: 16, c: "#8b5cf6", dur: 3.4, del: 0.3 },
  { t: 72, l: 90, s: 10, c: "#a3ff2b", dur: 2.8, del: 2.0 },
  { t: 88, l: 20, s: 14, c: "#00e5ff", dur: 2.4, del: 1.1 },
  { t: 92, l: 66, s: 11, c: "#ff2bd6", dur: 3.0, del: 0.5 },
  { t: 40, l:  0, s: 12, c: "#ffb300", dur: 2.9, del: 2.6 },
  { t:  2, l: 42, s: 10, c: "#a3ff2b", dur: 3.3, del: 1.8 },
  { t: 66, l: 97, s: 12, c: "#8b5cf6", dur: 2.5, del: 0.9 },
];

SPARKLES.forEach(sp => {
  const el = document.createElement("span");
  el.className = "sparkle";
  el.textContent = "\u2726";
  el.style.top = sp.t + "%";
  el.style.left = sp.l + "%";
  el.style.fontSize = sp.s + "px";
  el.style.color = sp.c;
  el.style.textShadow = "0 0 8px " + sp.c + ", 0 0 18px " + sp.c + "88";
  el.style.animation = "twinkle " + sp.dur + "s ease-in-out infinite " + sp.del + "s";
  stage.appendChild(el);
});

/* ── Expanding ripples ── */
const RIPPLE_HUES = [316, 187, 45, 262, 84];
setInterval(() => {
  const rip = document.createElement("div");
  rip.className = "ripple";
  const hue = RIPPLE_HUES[Math.floor(Math.random() * RIPPLE_HUES.length)];
  rip.style.borderColor = "hsl(" + hue + ", 95%, 64%)";
  rip.style.boxShadow = "0 0 12px hsla(" + hue + ", 95%, 64%, 0.4)";
  stage.appendChild(rip);
  setTimeout(() => rip.remove(), 3400);
}, 1400);

/* ── Cycling status messages ── */
const msgEl = document.getElementById("msg");
let msgIdx = 0;
setInterval(() => {
  msgEl.classList.remove("msg-in");
  msgEl.style.opacity = "0";
  setTimeout(() => {
    msgIdx = (msgIdx + 1) % MESSAGES.length;
    msgEl.textContent = MESSAGES[msgIdx];
    void msgEl.offsetWidth; /* reflow to restart the fade animation */
    msgEl.style.opacity = "1";
    msgEl.classList.add("msg-in");
  }, 380);
}, 2900);
</script>

</body>
</html>
