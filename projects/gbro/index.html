<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBRO — Find your spotter</title>
<link rel="icon" type="image/png" href="https://www.jstafki.com/assets/main/monolith.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@400..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --charcoal:#15171A;
  --charcoal-deep:#0B0C0D;
  --steel:#26292D;
  --steel-light:#3D4147;
  --brushed:#9BA1A7;
  --brushed-dim:#6E7378;
  --chalk:#F3F4F1;
  --signal:#FF5A1F;
  --line:rgba(243,244,241,0.09);
  --font-display:'Big Shoulders', sans-serif;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--charcoal);
  color:var(--chalk);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none;}

/* ===== HEADER ===== */
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 48px;border-bottom:1px solid var(--line);
  position:relative;z-index:5;flex:none;
}
.logo{
  font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:0.02em;
  display:flex;align-items:center;gap:8px;
}
.logo svg{width:20px;height:20px;}
.header-links{display:flex;gap:32px;align-items:center;}
.header-links a{font-size:14px;color:var(--brushed);transition:color .2s ease;}
.header-links a:hover{color:var(--chalk);}
.btn{
  font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  background:var(--signal);color:var(--charcoal-deep);
  padding:11px 20px;border:none;border-radius:3px;cursor:pointer;
  transition:background .2s ease, transform .15s ease;
}
.btn:hover{background:#ff7440;}
.btn:active{transform:scale(0.97);}

/* ===== HERO — full-bleed, image-led ===== */
.hero{
  display:flex;
  flex:1;min-height:0;
}
.hero-copy{
  flex:0 0 42%;max-width:560px;
  display:flex;flex-direction:column;justify-content:center;
  padding:48px 56px;
}
.eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--signal);display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--signal);display:inline-block;}
.hero h1{
  font-family:var(--font-display);font-weight:900;text-transform:uppercase;
  font-size:clamp(42px,5vw,64px);line-height:0.96;letter-spacing:-0.01em;
}
.hero h1 .accent{color:var(--signal);}
.hero-sub{color:var(--brushed);font-size:16.5px;line-height:1.6;max-width:420px;margin:22px 0 30px;}
.hero-form{display:flex;gap:10px;max-width:420px;}
.hero-form input{
  flex:1;min-width:0;background:var(--steel);border:1px solid var(--steel-light);
  color:var(--chalk);padding:14px 16px;border-radius:3px;font-size:14px;outline:none;
}
.hero-form input::placeholder{color:var(--brushed-dim);}
.hero-form input:focus{border-color:var(--signal);}
.form-disclaimer{font-family:var(--font-mono);font-size:11.5px;color:var(--brushed-dim);margin-top:12px;}

.hero-image{
  position:relative;overflow:hidden;background:var(--steel);
  flex:1;
}
.hero-image img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block;}
.hero-image::after{
  /* subtle fade into the page on the inner edge, so the full-bleed photo
     doesn't fight with the copy column for attention */
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg, rgba(21,23,26,0.55) 0%, rgba(21,23,26,0) 18%);
}
.hero-image .accent-corner{
  position:absolute;top:0;left:0;width:38px;height:38px;background:var(--signal);
  clip-path:polygon(0 0, 100% 0, 0 100%);z-index:1;
}
.img-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;color:var(--brushed-dim);text-align:center;padding:20px;
}

@media (max-width:900px){
  html,body{overflow:auto;height:auto;min-height:100%;}
  .hero{flex-direction:column;}
  .hero-copy{flex:none;max-width:none;}
  .hero-image{order:-1;min-height:42vh;flex:none;}
  .hero-image::after{background:linear-gradient(0deg, rgba(21,23,26,0.6) 0%, rgba(21,23,26,0) 22%);}
  .hero-copy{padding:36px 24px;}
  .site-header{padding:18px 24px;}
}
@media (max-width:560px){
  .hero-form{flex-direction:column;}
  .header-links{display:none;}
}
</style>
</head>
<body>

<header class="site-header">
  <a href="#" class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="4" height="6"/><rect x="18" y="9" width="4" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
    GBRO
  </a>
  <div class="header-links">
    <a href="login/">Log in</a>
  </div>
  <a class="btn" href="onboarding/">Get started</a>
</header>

<section class="hero">
  <div class="hero-copy">
    <p class="eyebrow">Gym partner matching</p>
    <h1>FIND YOUR<br>GYM <span class="accent">PARTNER.</span></h1>
    <p class="hero-sub">GBRO matches you with a training partner at your own gym — same sex, same goals — so you've always got someone watching your back.</p>
    <form class="hero-form" onsubmit="goToOnboarding(event,this)">
      <input type="email" placeholder="you@email.com" required>
      <button class="btn" type="submit">Get started</button>
    </form>
    <p class="form-disclaimer">Free to join. No credit card required.</p>
  </div>

  <div class="hero-image">
    <div class="accent-corner"></div>
    <img src="https://www.jstafki.com/assets/gym.JPG" alt="GBRO training partner"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="img-fallback" style="display:none;">Image didn't load — check the URL in the &lt;img src&gt; tag.</div>
  </div>
</section>

<script>
function goToOnboarding(e, form){
  e.preventDefault();
  const input = form.querySelector('input[type=email]');
  const email = input ? input.value.trim() : '';
  window.location.href = email ? `onboarding/?email=${encodeURIComponent(email)}` : 'onboarding/';
}
</script>

</body>
</html>
