<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chroma — where light and pigment disagree</title>
<meta name="description" content="Light mixes toward white. Pigment mixes toward mud. Chroma shows you why.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070a;
    --mist:#f5f3ee;
    --mist-dim:rgba(245,243,238,0.68);
    --mist-faint:rgba(245,243,238,0.34);
    --display:'Fraunces', serif;
    --body:'Hanken Grotesk', sans-serif;
    --mono:'Martian Mono', ui-monospace, monospace;
    --px:0px; --py:0px;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; overflow:hidden;
    background:var(--void); color:var(--mist);
    font-family:var(--body);
  }

  /* ---------- the wheel: one bold, fully-saturated signature ---------- */
  .wheel{
    position:fixed; z-index:0; left:50%; top:50%;
    width:min(105vmin,1200px); height:min(105vmin,1200px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:conic-gradient(from 0deg,
      hsl(0,86%,55%), hsl(30,88%,56%), hsl(55,85%,50%), hsl(90,80%,46%),
      hsl(130,72%,42%), hsl(170,70%,44%), hsl(200,80%,50%), hsl(230,82%,58%),
      hsl(265,78%,58%), hsl(300,78%,54%), hsl(330,82%,54%), hsl(360,86%,55%));
    -webkit-mask-image:radial-gradient(circle, black 52%, transparent 82%);
    mask-image:radial-gradient(circle, black 52%, transparent 82%);
    filter:saturate(1.2);
    scale:0.86; opacity:0; rotate:0deg;
    animation:wheelSpin 110s linear infinite, wheelIn 1.5s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  @keyframes wheelSpin{ from{ rotate:0deg; } to{ rotate:360deg; } }
  @keyframes wheelIn{ to{ scale:1; opacity:1; } }
  @media (prefers-reduced-motion:reduce){
    .wheel{ animation:wheelIn 1.5s cubic-bezier(.22,1,.36,1) .1s forwards; }
  }

  /* ---------- hero ---------- */
  main.hero{
    position:relative; z-index:10; height:100%; width:100%;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .glass-panel{
    position:relative; text-align:center; max-width:740px;
    padding:56px 64px;
    background:rgba(7,7,10,0.44);
    backdrop-filter:blur(30px) saturate(160%);
    -webkit-backdrop-filter:blur(30px) saturate(160%);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:32px;
    transform:translate(var(--px),var(--py));
    transition:transform .18s ease-out;
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--mist-dim); margin:0 0 20px;
    opacity:0; animation:reveal .8s ease-out .1s both;
  }
  .wordmark{
    margin:0; user-select:none; color:var(--mist);
    font-family:var(--display); font-weight:600; letter-spacing:-0.02em; line-height:0.95;
    font-size:clamp(56px,9vw,140px);
    opacity:0; animation:reveal 1s ease-out .28s both;
  }
  .tagline{
    font-size:clamp(15px,1.6vw,18px); color:var(--mist-dim); font-weight:400;
    max-width:46ch; margin:24px auto 0; line-height:1.55;
    opacity:0; animation:reveal .9s ease-out .5s both;
  }
  .cta{
    display:inline-flex; align-items:center; gap:9px; margin-top:32px;
    font-family:var(--mono); font-size:13px; letter-spacing:0.04em; color:var(--void);
    background:var(--mist); border:none; border-radius:999px; padding:14px 26px;
    text-decoration:none; cursor:pointer;
    opacity:0; animation:reveal .9s ease-out .7s both;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 10px 30px rgba(255,255,255,0.16); }
  .cta:focus-visible{ outline:2px solid var(--mist); outline-offset:3px; }
  .cta .arrow{ transition:transform .18s ease; }
  .cta:hover .arrow{ transform:translateX(3px); }

  @keyframes reveal{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

  .corner-mark{
    position:fixed; left:26px; bottom:22px; z-index:10;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--mist-faint); opacity:0; animation:reveal .8s ease-out .9s both;
  }
</style>
</head>
<body>

<div class="wheel" aria-hidden="true"></div>

<main class="hero">
  <div class="glass-panel">
    <p class="eyebrow">An interactive color study</p>
    <h1 class="wordmark">Chroma</h1>
    <p class="tagline">Light mixes toward white. Pigment mixes toward mud. Chroma shows you why.</p>
    <a class="cta" href="https://www.jstafki.com/projects/chroma/hue/">Start mixing <span class="arrow" aria-hidden="true">→</span></a>
  </div>
</main>

<p class="corner-mark">Part of the J-Suite</p>

<script>
(function(){
  'use strict';
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var root = document.documentElement;
  var ticking = false;
  window.addEventListener('mousemove', function(e){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var dx = (e.clientX / window.innerWidth - 0.5) * 2;
      var dy = (e.clientY / window.innerHeight - 0.5) * 2;
      root.style.setProperty('--px', (dx * -8) + 'px');
      root.style.setProperty('--py', (dy * -6) + 'px');
      ticking = false;
    });
  });
})();
</script>
</body>
</html>
