<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>HEARTH — shared duties, illuminated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080f;
    --ink:#f2f1f7;
    --muted:#9a98ad;
    --faint:#5c5a70;
    --pa:#e879f9;   /* partner one — bloom */
    --pb:#2dd4bf;   /* partner two — lagoon */
    --sh:#fbbf24;   /* shared — hearthlight */
    --glass:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.45;
  }
  ::selection{background:rgba(232,121,249,.35)}

  /* ---------- ambient orbs ---------- */
  .orb{position:fixed;border-radius:50%;filter:blur(95px);opacity:.22;pointer-events:none;z-index:0}
  .orb-a{width:44vmax;height:44vmax;background:var(--pa);top:-18vmax;left:-14vmax;animation:drift-a 46s ease-in-out infinite alternate}
  .orb-b{width:40vmax;height:40vmax;background:var(--pb);bottom:-16vmax;right:-12vmax;animation:drift-b 54s ease-in-out infinite alternate}
  .orb-c{width:26vmax;height:26vmax;background:var(--sh);top:42%;left:58%;opacity:.10;animation:drift-c 60s ease-in-out infinite alternate}
  @keyframes drift-a{to{transform:translate(9vmax,7vmax) scale(1.08)}}
  @keyframes drift-b{to{transform:translate(-8vmax,-6vmax) scale(1.1)}}
  @keyframes drift-c{to{transform:translate(-10vmax,5vmax)}}

  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:34px 22px 60px}

  /* ---------- header ---------- */
  header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
  .logo{
    font-size:clamp(30px,5.5vw,40px);
    font-weight:700;
    letter-spacing:.14em;
    background:linear-gradient(100deg,var(--ink) 15%,var(--pa) 45%,var(--pb) 72%,var(--sh) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .tagline{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
  .datebox{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);text-align:right;letter-spacing:.08em;line-height:1.7}
  .datebox b{color:var(--ink);font-weight:600}

  /* ---------- partner pills ---------- */
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  .pill{
    display:flex;align-items:center;gap:9px;
    background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:8px 15px 8px 12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);flex:none}
  .pname{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    background:none;border:none;cursor:pointer;padding:2px 3px;border-radius:6px;
  }
  .pname:hover{background:rgba(255,255,255,.07)}
  .pname:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  .pill input{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--c);border-radius:6px;
    padding:2px 6px;width:130px;
  }
  .pill input:focus{outline:none}
  .lit{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.06em}
  .lit b{color:var(--c);font-weight:600}
  .hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin:2px 0 0 4px}

  /* ---------- tabs ---------- */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 22px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    background:none;border:none;cursor:pointer;
    padding:9px 13px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--muted);outline-offset:-2px;border-radius:6px}
  .tab.active{color:var(--c,var(--ink));border-bottom-color:var(--c,var(--ink));text-shadow:0 0 14px var(--c,transparent)}

  /* ---------- grid + cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}
  .card{
    --c:var(--pa);
    position:relative;
    background:var(--glass);
    border:1px solid color-mix(in srgb,var(--c) 32%,transparent);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 0 14px rgba(255,255,255,.05);
    box-shadow:0 0 var(--glow,12px) color-mix(in srgb,var(--c) var(--gp,20%),transparent);
    display:flex;flex-direction:column;gap:13px;
    transition:transform .18s ease,box-shadow .3s ease;
  }
  .card:hover{transform:translateY(-2px)}
  .card.done{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
  .card.done .well{background:color-mix(in srgb,var(--c) 22%,transparent)}
  .card.pulse::after{
    content:'';position:absolute;inset:-2px;border-radius:inherit;
    border:2px solid var(--c);pointer-events:none;
    animation:ring .7s ease-out forwards;
  }
  @keyframes ring{from{opacity:.9;transform:scale(.965)}to{opacity:0;transform:scale(1.1)}}

  .card-top{display:flex;gap:13px;align-items:flex-start}
  .well{
    flex:none;width:52px;height:52px;border-radius:16px;
    display:grid;place-items:center;font-size:27px;
    background:color-mix(in srgb,var(--c) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
    box-shadow:inset 0 0 16px color-mix(in srgb,var(--c) 16%,transparent);
  }
  .task-name{font-size:16.5px;font-weight:600;line-height:1.25;padding-top:2px;overflow-wrap:anywhere}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;
  }
  .chip.owner{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}

  .path{display:flex;align-items:center;gap:10px}
  .path-track{flex:1;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .path-track i{display:block;height:100%;border-radius:999px;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .4s ease}
  .path-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
  .card.forged .path-label{color:var(--sh);text-shadow:0 0 10px var(--sh)}

  .done-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:.04em;
    border:none;border-radius:999px;padding:11px 14px;cursor:pointer;
    background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#ffffff 12%));
    color:#0a0a12;
    box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent);
    transition:transform .12s ease,box-shadow .2s ease,background .2s ease;
  }
  .done-btn:hover{box-shadow:0 0 24px color-mix(in srgb,var(--c) 65%,transparent)}
  .done-btn:active{transform:scale(.965)}
  .done-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .card.done .done-btn{
    background:transparent;color:var(--c);
    border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
    box-shadow:none;
  }

  .del{
    position:absolute;top:10px;right:10px;
    font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;
    color:var(--faint);background:none;border:none;cursor:pointer;
    padding:6px 8px;border-radius:8px;transition:color .15s,background .15s;
  }
  .del:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  .del:focus-visible{outline:2px solid var(--muted)}
  .del.armed{color:#ff8fa3;font-size:10px;letter-spacing:.08em}

  /* ghost forge tile */
  .ghost{
    border:1.5px dashed var(--line);background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:170px;color:var(--faint);border-radius:var(--radius);
    font-family:inherit;transition:border-color .2s,color .2s,box-shadow .3s;
  }
  .ghost:hover{border-color:var(--muted);color:var(--muted);box-shadow:0 0 22px rgba(255,255,255,.06)}
  .ghost:focus-visible{outline:2px solid var(--muted);outline-offset:3px}
  .ghost .plus{font-size:30px;font-weight:400;line-height:1}
  .ghost span{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

  .empty{grid-column:1/-1;text-align:center;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;padding:34px 0 8px}

  footer{
    margin-top:44px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.14em;color:var(--faint);text-transform:uppercase;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:10;
    background:rgba(5,5,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:none;align-items:flex-end;justify-content:center;padding:18px;
  }
  .overlay.open{display:flex}
  .sheet{
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    background:#10101c;border:1px solid var(--line);border-radius:24px;
    padding:24px 22px 22px;box-shadow:0 0 60px rgba(232,121,249,.12);
  }
  .sheet h2{font-size:19px;font-weight:700;letter-spacing:.05em;margin-bottom:18px}
  .field{margin-bottom:17px}
  .flabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
  .tinput{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;transition:border-color .15s,box-shadow .15s;
  }
  .tinput:focus{outline:none;border-color:var(--pa);box-shadow:0 0 14px rgba(232,121,249,.25)}
  .tinput.err{border-color:#ff8fa3;box-shadow:0 0 14px rgba(255,143,163,.3)}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .eopt{
    font-size:21px;background:rgba(255,255,255,.04);border:1px solid transparent;
    border-radius:10px;padding:7px 0;cursor:pointer;transition:background .12s,border-color .12s;
  }
  .eopt:hover{background:rgba(255,255,255,.09)}
  .eopt.sel{border-color:var(--pa);background:rgba(232,121,249,.14);box-shadow:0 0 10px rgba(232,121,249,.3)}
  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .sopt{
    flex:1;min-width:90px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;
    padding:10px 8px;cursor:pointer;transition:all .15s;
  }
  .sopt.sel{color:#0a0a12;background:var(--c,var(--ink));border-color:transparent;box-shadow:0 0 14px var(--c,transparent)}
  .sheet-actions{display:flex;gap:10px;margin-top:22px}
  .btn-forge{
    flex:1;font-family:inherit;font-size:14.5px;font-weight:700;letter-spacing:.04em;
    background:linear-gradient(115deg,var(--pa),var(--pb));color:#0a0a12;
    border:none;border-radius:999px;padding:13px;cursor:pointer;
    box-shadow:0 0 22px rgba(232,121,249,.35);transition:transform .12s,box-shadow .2s;
  }
  .btn-forge:hover{box-shadow:0 0 30px rgba(45,212,191,.4)}
  .btn-forge:active{transform:scale(.97)}
  .btn-cancel{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
    background:none;border:1px solid var(--line);border-radius:999px;padding:13px 20px;cursor:pointer;
  }
  .btn-cancel:hover{color:var(--ink)}

  @media (min-width:560px){.overlay{align-items:center}}
  @media (max-width:520px){
    .wrap{padding:26px 16px 50px}
    .datebox{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){
    .orb,.card.pulse::after{animation:none}
    .card,.done-btn,.path-track i{transition:none}
  }
</style>
</head>
<body>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>

<div class="wrap">
  <header>
    <div>
      <div class="logo">HEARTH</div>
      <div class="tagline">shared duties, illuminated</div>
    </div>
    <div class="datebox" id="datebox"></div>
  </header>

  <div class="pills" id="pills"></div>
  <div class="hint" id="hint" hidden>tip: tap a name to make it yours</div>

  <nav class="tabs" id="tabs" aria-label="Filter cards"></nav>

  <main class="grid" id="grid"></main>

  <footer>neurons that fire together wire together</footer>
</div>

<!-- forge modal -->
<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">Forge a card</h2>

    <div class="field">
      <label class="flabel" for="f-name">The duty</label>
      <input class="tinput" id="f-name" type="text" maxlength="60" placeholder="Take out the trash" autocomplete="off">
    </div>

    <div class="field">
      <span class="flabel">Sigil</span>
      <div class="emoji-grid" id="f-emoji"></div>
    </div>

    <div class="field">
      <span class="flabel">Whose pathway</span>
      <div class="seg" id="f-owner"></div>
    </div>

    <div class="field">
      <span class="flabel">Rhythm</span>
      <div class="seg" id="f-freq">
        <button type="button" class="sopt" data-v="daily">Daily</button>
        <button type="button" class="sopt sel" data-v="weekly">Weekly</button>
        <button type="button" class="sopt" data-v="monthly">Monthly</button>
      </div>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn-cancel" id="f-cancel">Cancel</button>
      <button type="button" class="btn-forge" id="f-submit">Forge card</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'hearth-v2';
  var FORGE_AT = 21; // reps to forge a pathway
  var COLORS = { a:'var(--pa)', b:'var(--pb)', shared:'var(--sh)' };
  var EMOJIS = ['🗑️','🌿','🧹','🌀','🍽️','🧺','🛁','🚽','🧽','🪣','🛒','🍳','🐕','🐈','🌸','🚗','📬','💡','🪟','🛏️','♻️','🧊','🔧','🌻'];

  var state = null;
  var filter = 'all';
  var pulseId = null;

  /* ---------- persistence: artifact storage -> localStorage -> memory ---------- */
  async function persist(){
    var json = JSON.stringify(state);
    try { if (window.storage) { await window.storage.set(KEY, json); return; } } catch(e){}
    try { localStorage.setItem(KEY, json); } catch(e){}
  }
  async function restore(){
    try {
      if (window.storage) {
        var r = await window.storage.get(KEY);
        if (r && r.value) return JSON.parse(r.value);
      }
    } catch(e){}
    try {
      var v = localStorage.getItem(KEY);
      if (v) return JSON.parse(v);
    } catch(e){}
    return null;
  }

  function seed(){
    return {
      partners: { a:'Partner One', b:'Partner Two' },
      tasks: []
    };
  }
  function mk(name, emoji, owner, freq){
    return { id: uid(), name:name, emoji:emoji, owner:owner, freq:freq, reps:0, lastDone:null };
  }
  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- time windows ---------- */
  function windowStart(freq){
    var x = new Date(); x.setHours(0,0,0,0);
    if (freq === 'daily') return x.getTime();
    if (freq === 'weekly'){ var day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.getTime(); }
    return new Date(x.getFullYear(), x.getMonth(), 1).getTime();
  }
  function isDone(t){ return !!t.lastDone && t.lastDone >= windowStart(t.freq); }
  function doneLabel(freq){
    return freq==='daily' ? 'Done today' : freq==='weekly' ? 'Done this week' : 'Done this month';
  }

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function ownerName(o){ return o==='shared' ? 'Shared' : state.partners[o]; }
  function $(id){ return document.getElementById(id); }

  /* ---------- render ---------- */
  function renderDate(){
    var now = new Date();
    var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    var mons=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var mon = new Date(now); mon.setHours(0,0,0,0);
    mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
    $('datebox').innerHTML =
      '<b>' + days[now.getDay()] + ' · ' + mons[now.getMonth()] + ' ' + now.getDate() + ' ' + now.getFullYear() + '</b><br>' +
      'WEEK OF ' + mons[mon.getMonth()] + ' ' + mon.getDate();
  }

  function counts(owner){
    var mine = state.tasks.filter(function(t){ return t.owner===owner; });
    var lit = mine.filter(isDone).length;
    return { lit:lit, total:mine.length };
  }

  function renderPills(){
    var html = '';
    ['a','b','shared'].forEach(function(o){
      var c = counts(o);
      var nm = o==='shared' ? 'Shared' : esc(state.partners[o]);
      var nameEl = o==='shared'
        ? '<span class="pname" style="cursor:default">Shared</span>'
        : '<button type="button" class="pname" data-rename="'+o+'" aria-label="Rename partner">'+nm+'</button>';
      html += '<div class="pill" style="--c:'+COLORS[o]+'">' +
                '<span class="dot"></span>' + nameEl +
                '<span class="lit"><b>'+c.lit+'/'+c.total+'</b> lit</span>' +
              '</div>';
    });
    $('pills').innerHTML = html;
    $('hint').hidden = !(state.partners.a.indexOf('Partner')===0 || state.partners.b.indexOf('Partner')===0);
  }

  function renderTabs(){
    var defs = [
      ['all','All', null],
      ['a', state.partners.a, COLORS.a],
      ['b', state.partners.b, COLORS.b],
      ['shared','Shared', COLORS.shared]
    ];
    $('tabs').innerHTML = defs.map(function(d){
      var style = d[2] ? ' style="--c:'+d[2]+'"' : '';
      var act = filter===d[0] ? ' active' : '';
      return '<button type="button" class="tab'+act+'" data-filter="'+d[0]+'"'+style+'>'+esc(d[1])+'</button>';
    }).join('');
  }

  function cardHTML(t){
    var done = isDone(t);
    var s = Math.min(t.reps, FORGE_AT) / FORGE_AT;
    var forged = t.reps >= FORGE_AT;
    var glow = Math.round(10 + 30*s) + 'px';
    var gp = Math.round(18 + 52*s) + '%';
    var cls = 'card' + (done?' done':'') + (forged?' forged':'') + (t.id===pulseId?' pulse':'');
    return '<article class="'+cls+'" style="--c:'+COLORS[t.owner]+';--glow:'+glow+';--gp:'+gp+'">' +
      '<button type="button" class="del" data-del="'+t.id+'" aria-label="Delete card">×</button>' +
      '<div class="card-top">' +
        '<div class="well">'+t.emoji+'</div>' +
        '<div>' +
          '<h3 class="task-name">'+esc(t.name)+'</h3>' +
          '<div class="chips">' +
            '<span class="chip owner">'+esc(ownerName(t.owner))+'</span>' +
            '<span class="chip">'+t.freq+'</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="path">' +
        '<div class="path-track"><i style="width:'+Math.round(s*100)+'%"></i></div>' +
        '<span class="path-label">'+(forged?'FORGED':'PATHWAY')+' ×'+t.reps+'</span>' +
      '</div>' +
      '<button type="button" class="done-btn" data-toggle="'+t.id+'" aria-pressed="'+done+'">' +
        (done ? '✓ ' + doneLabel(t.freq) : 'Mark done') +
      '</button>' +
    '</article>';
  }

  function renderGrid(){
    var list = state.tasks.filter(function(t){ return filter==='all' || t.owner===filter; });
    var html = list.map(cardHTML).join('');
    if (!list.length){
      html += '<div class="empty">no cards here yet — forge the first one</div>';
    }
    html += '<button type="button" class="ghost" id="ghost"><span class="plus">＋</span><span>Forge a card</span></button>';
    $('grid').innerHTML = html;
  }

  function render(){
    renderPills();
    renderTabs();
    renderGrid();
    if (pulseId){
      var id = pulseId; pulseId = null;
      setTimeout(function(){
        var el = document.querySelector('.card.pulse');
        if (el) el.classList.remove('pulse');
      }, 750);
    }
  }

  /* ---------- actions ---------- */
  function toggle(id){
    var t = state.tasks.find(function(x){ return x.id===id; });
    if (!t) return;
    if (isDone(t)){ t.reps = Math.max(0, t.reps-1); t.lastDone = null; }
    else { t.reps++; t.lastDone = Date.now(); pulseId = id; }
    persist(); render();
  }
  function removeTask(id){
    state.tasks = state.tasks.filter(function(x){ return x.id!==id; });
    persist(); render();
  }
  function startRename(btn){
    var o = btn.getAttribute('data-rename');
    var input = document.createElement('input');
    input.type = 'text'; input.maxLength = 24;
    input.value = state.partners[o];
    btn.replaceWith(input);
    input.focus(); input.select();
    var commit = function(){
      var v = input.value.trim();
      if (v) state.partners[o] = v;
      persist(); render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if (e.key==='Enter') input.blur();
      if (e.key==='Escape'){ input.value = state.partners[o]; input.blur(); }
    });
  }

  /* ---------- modal ---------- */
  var sel = { emoji: EMOJIS[0], owner:'a', freq:'weekly' };

  function buildModal(){
    $('f-emoji').innerHTML = EMOJIS.map(function(e){
      return '<button type="button" class="eopt'+(e===sel.emoji?' sel':'')+'" data-e="'+e+'">'+e+'</button>';
    }).join('');
    var owners = [['a',state.partners.a],['b',state.partners.b],['shared','Shared']];
    $('f-owner').innerHTML = owners.map(function(o){
      var s = o[0]===sel.owner ? ' sel' : '';
      return '<button type="button" class="sopt'+s+'" data-v="'+o[0]+'" style="--c:'+COLORS[o[0]]+'">'+esc(o[1])+'</button>';
    }).join('');
    var fb = $('f-freq').querySelectorAll('.sopt');
    fb.forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-v')===sel.freq); });
  }

  function openModal(){
    sel = { emoji: EMOJIS[0], owner: (filter==='b'||filter==='shared') ? filter : 'a', freq:'weekly' };
    $('f-name').value = '';
    $('f-name').classList.remove('err');
    buildModal();
    $('overlay').classList.add('open');
    setTimeout(function(){ $('f-name').focus(); }, 60);
  }
  function closeModal(){ $('overlay').classList.remove('open'); }

  function submit(){
    var name = $('f-name').value.trim();
    if (!name){
      $('f-name').classList.add('err');
      $('f-name').focus();
      return;
    }
    state.tasks.push(mk(name, sel.emoji, sel.owner, sel.freq));
    pulseId = state.tasks[state.tasks.length-1].id;
    if (filter!=='all' && filter!==sel.owner) filter = sel.owner;
    persist(); closeModal(); render();
  }

  /* ---------- events (delegated) ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('button');
    if (!el) {
      if (e.target === $('overlay')) closeModal();
      return;
    }
    if (el.id==='ghost'){ openModal(); return; }
    if (el.id==='f-cancel'){ closeModal(); return; }
    if (el.id==='f-submit'){ submit(); return; }

    if (el.hasAttribute('data-toggle')){ toggle(el.getAttribute('data-toggle')); return; }
    if (el.hasAttribute('data-rename')){ startRename(el); return; }
    if (el.hasAttribute('data-filter')){ filter = el.getAttribute('data-filter'); render(); return; }

    if (el.hasAttribute('data-del')){
      if (el.classList.contains('armed')){ removeTask(el.getAttribute('data-del')); }
      else {
        el.classList.add('armed'); el.textContent = 'sure?';
        setTimeout(function(){
          if (document.body.contains(el)){ el.classList.remove('armed'); el.textContent = '×'; }
        }, 2600);
      }
      return;
    }
    if (el.classList.contains('eopt')){
      sel.emoji = el.getAttribute('data-e'); buildModal(); return;
    }
    if (el.parentElement && el.parentElement.id==='f-owner'){
      sel.owner = el.getAttribute('data-v'); buildModal(); return;
    }
    if (el.parentElement && el.parentElement.id==='f-freq'){
      sel.freq = el.getAttribute('data-v'); buildModal(); return;
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key==='Escape' && $('overlay').classList.contains('open')) closeModal();
    if (e.key==='Enter' && e.target && e.target.id==='f-name') submit();
  });
  $('f-name').addEventListener('input', function(){ this.classList.remove('err'); });

  /* ---------- init ---------- */
  (async function init(){
    var saved = await restore();
    state = saved || seed();
    if (!state.partners) state.partners = { a:'Partner One', b:'Partner Two' };
    if (!Array.isArray(state.tasks)) state.tasks = [];
    renderDate();
    render();
    if (!saved) persist();
  })();
})();
</script>
</body>
</html>
