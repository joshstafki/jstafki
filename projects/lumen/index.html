<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<title>LUMEN — Light a Candle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0806;
  --ink:#efe6d4;
  --gold:#c9a769;
  --gold-bright:#e8c87e;
  --muted:#8a7d68;
  --faint:#6d6250;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --rack-shift:0vh;
  --rack-scale:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}

/* ---------- stage & the single church ---------- */
#stage{position:fixed;inset:0;background:var(--bg)}
#scene{position:absolute;inset:0}
.photo{position:absolute;inset:0;background:#0a0806}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center var(--img-y,100%);display:block}
.photo.imgfail img{display:none}
.photo.imgfail::after{content:"The church image couldn’t be loaded — check the link.";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;color:var(--faint);font:italic 16px var(--serif)}
.photo-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,4,.5) 0%,rgba(6,5,4,.08) 22%,rgba(6,5,4,0) 44%,rgba(6,5,4,.3) 64%,rgba(6,5,4,.88) 100%)}
.photo-vig{position:absolute;inset:0;background:radial-gradient(122% 94% at 50% 40%,transparent 50%,rgba(4,3,2,.66) 100%)}
.attrib{position:absolute;left:12px;bottom:calc(2.6% + 84px);z-index:2;font-size:9px;letter-spacing:.05em;color:rgba(200,186,160,.5);max-width:44%;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

/* the votive rack — a unit the calibrator can move & scale */
.cands{position:absolute;inset:0;transform:translateY(var(--rack-shift)) scale(var(--rack-scale));transform-origin:50% 100%}
.shelf{
  position:absolute;height:9px;border-radius:4px;
  background:linear-gradient(180deg,#382b22,#170f0b 55%,#090604);
  box-shadow:0 12px 26px rgba(0,0,0,.7), inset 0 1px 0 rgba(224,176,116,.22);
}
.shelf.back{bottom:20%;left:13%;right:13%}
.shelf.front{bottom:7.5%;left:3%;right:3%}

/* ---------- candle ---------- */
.candle{
  position:absolute;width:34px;height:112px;
  transform:translateX(-50%) scale(var(--s,1));
  transform-origin:50% 100%;
  pointer-events:auto;cursor:pointer;
  opacity:0;transition:opacity .7s ease;
}
.candle.show{opacity:1}
.glass{
  position:absolute;left:50%;bottom:0;width:30px;height:42px;margin-left:-15px;
  border-radius:5px 5px 10px 10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(214,64,42,.36),rgba(152,26,16,.6) 45%,rgba(86,12,8,.84) 78%,rgba(48,7,5,.92));
  box-shadow:inset 0 1px 4px rgba(255,152,102,.4), inset 0 -6px 10px rgba(0,0,0,.55), 0 5px 12px rgba(0,0,0,.55);
}
.glass::before{
  content:"";position:absolute;top:2px;bottom:5px;left:4px;width:5px;border-radius:4px;
  background:linear-gradient(180deg,rgba(255,224,196,.5),rgba(255,224,196,.05));
}
.wax{
  position:absolute;left:3px;right:3px;bottom:3px;
  height:calc(var(--wax,90)*.36px);
  border-radius:3px 3px 6px 6px;
  background:linear-gradient(180deg,#ffdf9e 0%,#f6e8ca 24%,#e9d8b0 100%);
  box-shadow:0 -2px 7px rgba(255,172,72,.6);
  transition:height 1s linear;
}
/* a candle shared with everyone wears a faint golden rim */
.candle.global .glass{
  box-shadow:inset 0 1px 4px rgba(255,152,102,.4), inset 0 -6px 10px rgba(0,0,0,.55), 0 5px 12px rgba(0,0,0,.55),
             0 0 0 1.4px rgba(232,200,126,.55), 0 0 11px rgba(232,200,126,.4);
}
.flm{
  position:absolute;left:50%;bottom:calc(3px + var(--wax,90)*.36px);
  width:10px;height:17px;margin-left:-5px;z-index:2;
  transform:scale(0);transform-origin:50% 100%;
}
.candle.lit .flm{transform:scale(1);transition:transform .55s cubic-bezier(.2,1.7,.4,1)}
.flm .f{
  position:absolute;inset:0;transform-origin:50% 100%;
  background:linear-gradient(180deg,#fff9e3 0%,#ffe9a3 30%,#ffb43d 62%,#ff7a1f 84%,rgba(255,90,30,.35) 100%);
  border-radius:50% 50% 44% 44% / 66% 66% 34% 34%;
  filter:drop-shadow(0 0 5px rgba(255,190,90,.95)) drop-shadow(0 -2px 14px rgba(255,150,50,.5));
  animation:flick var(--fd,1.15s) ease-in-out var(--fdel,0s) infinite alternate;
}
.flm .f::after{
  content:"";position:absolute;left:50%;bottom:1px;width:4px;height:7px;margin-left:-2px;
  border-radius:50% 50% 40% 40% / 60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff,rgba(255,255,240,.55) 70%,transparent);
}
.flm .f::before{
  content:"";position:absolute;left:50%;bottom:-1px;width:6px;height:5px;margin-left:-3px;border-radius:50%;
  background:radial-gradient(circle,rgba(122,162,255,.85),rgba(92,122,255,.12) 70%,transparent);
}
@keyframes flick{
  0%{transform:scaleX(1) scaleY(.97) skewX(-2deg) rotate(-1deg)}
  55%{transform:scaleX(.92) scaleY(1.06) skewX(2.4deg) rotate(1.2deg)}
  100%{transform:scaleX(1.02) scaleY(.99) skewX(-1deg) rotate(0deg)}
}
.glo{
  position:absolute;left:50%;bottom:calc(var(--wax,90)*.36px - 34px);
  width:120px;height:120px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,178,84,.4) 0%,rgba(255,150,60,.14) 42%,transparent 68%);
  mix-blend-mode:screen;pointer-events:none;opacity:0;
  animation:glowp var(--fd,1.15s) ease-in-out var(--fdel,0s) infinite alternate;
}
.candle.lit .glo{opacity:1;transition:opacity .8s ease}
@keyframes glowp{from{transform:scale(.95)}to{transform:scale(1.06)}}
.smoke{
  position:absolute;left:50%;bottom:30px;width:9px;height:28px;margin-left:-4px;border-radius:50%;
  background:radial-gradient(circle,rgba(205,205,215,.55),transparent 70%);
  filter:blur(3px);pointer-events:none;
  animation:rise 1.8s ease-out forwards;
}
@keyframes rise{to{transform:translateY(-52px) translateX(6px) scale(2.3);opacity:0}}

/* ---------- chrome ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:6;
  padding:calc(16px + env(safe-area-inset-top)) 22px 0;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
}
.wm{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.42em;color:var(--gold-bright)}
.wm .wm-cross{color:var(--gold);margin-left:-.3em}
.hbtns{display:flex;gap:14px;align-items:center;pointer-events:auto}
.count{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.who{font-size:9px;letter-spacing:.08em;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:4px}
.hbtn{background:none;border:0;color:var(--muted);font:600 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:4px 0;transition:.2s}
.hbtn:hover{color:var(--gold-bright)}
.gear{color:var(--muted);cursor:pointer;transition:.25s;background:none;border:0;padding:0;line-height:0}
.gear:hover{color:var(--gold-bright);transform:rotate(35deg)}

#label{
  position:fixed;top:calc(46px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:6;text-align:center;pointer-events:none;width:min(560px,86vw);
}
#label .n{font-family:var(--serif);font-style:italic;font-weight:500;font-size:19px;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.8)}

#hint{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(2.6% + 62px);z-index:5;pointer-events:none;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);
  text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;
}
#hint.on{opacity:1}

#lightBtn{
  position:fixed;left:50%;bottom:calc(2.6% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;
  font:600 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold-bright);
  background:linear-gradient(180deg,rgba(28,20,12,.92),rgba(13,9,6,.96));
  border:1px solid rgba(200,167,105,.55);border-radius:3px;
  padding:14px 26px 13px 30px;cursor:pointer;
  box-shadow:0 10px 34px rgba(0,0,0,.65);transition:.25s;
}
#lightBtn:hover{border-color:var(--gold-bright);box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 26px rgba(232,200,126,.2)}

/* ---------- modal (shared shell) ---------- */
#veil,#settings{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(4,3,2,.68);backdrop-filter:blur(3px);padding:20px;
}
#veil.on,#settings.on{display:flex}
.panel{
  width:min(440px,100%);border-radius:6px;padding:30px 30px 24px;
  background:linear-gradient(180deg,#181108,#0e0a06);
  border:1px solid rgba(200,167,105,.4);
  box-shadow:0 34px 90px rgba(0,0,0,.75);
  animation:panelin .35s cubic-bezier(.2,1.2,.4,1);
}
@keyframes panelin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel h2{font-family:var(--serif);font-weight:500;font-size:28px;color:#f0e2c4;text-align:center}
.panel .sub{font-family:var(--serif);font-style:italic;font-size:15.5px;color:#b6a685;text-align:center;margin-top:5px}
#intent{
  width:100%;margin-top:18px;min-height:96px;resize:vertical;outline:none;
  background:#0a0705;border:1px solid rgba(200,167,105,.28);border-radius:4px;
  color:var(--ink);font:400 16px/1.55 var(--serif);padding:12px 14px;
  user-select:text;-webkit-user-select:text;
}
#intent:focus{border-color:rgba(232,200,126,.6)}
#intent::placeholder{color:#5d5344;font-style:italic}
.share{display:flex;align-items:flex-start;gap:9px;margin-top:14px;cursor:pointer}
.share input{accent-color:#a97f2c;width:15px;height:15px;margin-top:2px;flex:none}
.share .st{font-size:12.5px;font-family:var(--serif);color:#b6a685;line-height:1.4}
.share .st b{color:var(--gold-bright);font-weight:500;font-style:italic}
.note{margin-top:13px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7d7059;text-align:center;line-height:1.9}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{
  flex:1;padding:12px 0;border-radius:3px;cursor:pointer;
  font:600 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;transition:.2s;
}
.ghost{background:none;border:1px solid rgba(180,160,130,.25);color:#9c8f77}
.ghost:hover{border-color:rgba(180,160,130,.5);color:#bdb096}
.solid{background:linear-gradient(180deg,#3c2c12,#251a0b);border:1px solid rgba(232,200,126,.6);color:#f0dfae}
.solid:hover{border-color:var(--gold-bright);box-shadow:0 0 20px rgba(232,200,126,.18)}

/* ---------- calibrator ---------- */
.sw{width:min(420px,100%)}
.sw h2{text-align:left}.sw .sub{text-align:left;margin-bottom:6px}
.cal-row{margin:20px 0 0}
.cal-row label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.cal-row label span{color:var(--gold-bright)}
.cal-row input[type=range]{width:100%;accent-color:#a97f2c;height:3px}
.calhint{font-size:10.5px;line-height:1.75;color:var(--faint);margin-top:20px}

/* ---------- candle popover ---------- */
#pop{
  position:fixed;z-index:15;width:min(300px,86vw);display:none;text-align:center;
  background:linear-gradient(180deg,#181108,#0e0a06);
  border:1px solid rgba(200,167,105,.4);border-radius:6px;
  padding:16px 20px 15px;box-shadow:0 24px 60px rgba(0,0,0,.7);
}
#pop.on{display:block}
#pop .cross{color:var(--gold);font-size:13px}
#pop .txt{font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.5;color:var(--ink);margin:7px 0 9px;max-height:150px;overflow:auto}
#pop .meta{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.9}
#pop .status{font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:7px}
#pop .status.priv{color:var(--muted)}
#pop .status.glob{color:var(--gold-bright)}
#pop .act{
  margin-top:12px;width:100%;padding:9px 0;border-radius:3px;cursor:pointer;
  font:600 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;transition:.2s;
  background:linear-gradient(180deg,#3c2c12,#251a0b);border:1px solid rgba(232,200,126,.55);color:#f0dfae;
}
#pop .act:hover{border-color:var(--gold-bright);box-shadow:0 0 18px rgba(232,200,126,.16)}
#pop .act.plain{background:none;border-color:rgba(180,160,130,.25);color:#9c8f77}
#pop .act.plain:hover{border-color:rgba(180,160,130,.5);color:#bdb096;box-shadow:none}

/* ---------- toast & flying flame ---------- */
#toast{position:fixed;left:50%;top:37%;transform:translate(-50%,-50%);z-index:30;text-align:center;opacity:0;pointer-events:none;transition:opacity .7s ease}
#toast.on{opacity:1}
#toast .l1{font-family:var(--serif);font-style:italic;font-size:36px;color:#f0dfae;text-shadow:0 0 34px rgba(232,200,126,.4)}
#toast .l2{margin-top:5px;font-family:var(--serif);font-style:italic;font-size:17px;color:#b6a685}
#fly{
  position:fixed;left:0;top:0;z-index:25;width:11px;height:19px;display:none;pointer-events:none;
  background:linear-gradient(180deg,#fff9e3 0%,#ffe9a3 30%,#ffb43d 62%,#ff7a1f 88%,rgba(255,90,30,.3) 100%);
  border-radius:50% 50% 44% 44% / 66% 66% 34% 34%;
  filter:drop-shadow(0 0 7px rgba(255,190,90,1)) drop-shadow(0 0 20px rgba(255,150,50,.6));
}

/* ---------- responsive & motion ---------- */
@media (max-width:560px){
  .candle{transform:translateX(-50%) scale(calc(var(--s,1)*.74))}
  #label .n{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .flm .f,.glo{animation:none}
}
</style>
</head>
<body>

<header>
  <div class="wm">LVMEN<span class="wm-cross"> ✠</span></div>
  <div class="hbtns">
    <div class="count" id="count"></div>
    <span class="who" id="who"></span>
    <button class="hbtn" id="authBtn" style="display:none"></button>
    <button class="gear" id="gearBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5.05 5.05l2.26 2.26M16.69 16.69l2.26 2.26M18.95 5.05l-2.26 2.26M7.31 16.69l-2.26 2.26"/></svg>
    </button>
  </div>
</header>

<div id="label"><div class="n" id="labelText"></div></div>

<div id="stage"><div id="scene"></div></div>

<div id="hint"></div>
<button id="lightBtn">Light a Candle</button>

<div id="veil" role="dialog" aria-modal="true" aria-labelledby="veilH">
  <div class="panel">
    <h2 id="veilH">An Intention</h2>
    <p class="sub">For whom, or for what, shall this candle burn?</p>
    <textarea id="intent" maxlength="400" placeholder="For…" aria-label="Your intention"></textarea>
    <label class="share" id="shareRow"><input type="checkbox" id="shareChk"><span class="st">Let everyone see this candle. <b>Otherwise it stays private to you.</b></span></label>
    <div class="note" id="note"></div>
    <div class="actions">
      <button class="ghost" id="cancelBtn">Never mind</button>
      <button class="solid" id="igniteBtn">Light the Candle</button>
    </div>
  </div>
</div>

<div id="pop"></div>

<div id="settings" role="dialog" aria-modal="true" aria-labelledby="setH">
  <div class="panel sw">
    <h2 id="setH">Place the candles</h2>
    <p class="sub">Seat the votive rack on the floor of your church</p>
    <div class="cal-row">
      <label>Height <span id="calBVal"></span></label>
      <input type="range" id="calB" min="-14" max="14" step="0.5" value="0">
    </div>
    <div class="cal-row">
      <label>Size <span id="calSVal"></span></label>
      <input type="range" id="calS" min="0.6" max="1.5" step="0.02" value="1">
    </div>
    <p class="calhint" id="calHint"></p>
    <div class="actions">
      <button class="ghost" id="calReset">Reset</button>
      <button class="solid" id="setClose">Done</button>
    </div>
  </div>
</div>

<div id="toast">
  <div class="l1">Lumen Christi.</div>
  <div class="l2">℟. Deo grátias.</div>
</div>

<div id="fly"></div>

<script>
/* ================= LVMEN — a digital votive =================
   One church. Candles are private to whoever lit them, unless
   made global — then they burn for everyone. Single file, no build.
   ============================================================ */

/* ---------- the church ---------- */
const CHURCH_IMAGE = "https://www.jstafki.com/assets/lumen/c54ceee7-a68b-4ef2-83bb-7ecad65e5b91.png";
const CHURCH_LABEL = "";        /* optional caption under the wordmark; "" hides it */
const CHURCH_ATTRIB = "";       /* optional small credit line, e.g. a photographer */
const CHURCH_FOCAL_Y = 10;      /* 0 = show the top of the image, 100 = show the bottom. Lower this to reveal more of the top. */

const BURN_HOURS = 10;                        /* a votive burns about ten hours */
const BURN_MS = BURN_HOURS * 3600 * 1000;

/* ------------------------------------------------------------------
   CROSS-DEVICE SYNC + PRIVATE / GLOBAL CANDLES  (optional)
   Paste your Firebase web config below and host this file. Sign in
   with Google and your candles follow you across devices, kept
   private to your account — until you make one global, when it
   appears for everyone. Leave it empty and everything stays on this
   device (no accounts, no sharing).
------------------------------------------------------------------ */
const FIREBASE_CONFIG = {
  // apiKey:            "…",
  // authDomain:        "your-app.firebaseapp.com",
  // projectId:         "your-app",
  // storageBucket:     "your-app.appspot.com",
  // messagingSenderId: "…",
  // appId:             "…",
};

/* votive rack: back row of 9, front row of 8 parted around the button */
const SLOTS = [
  ...[18,26,34,42,50,58,66,74,82].map(x => ({x, b:20.6, s:.78})),
  ...[10,18,26,34].map(x => ({x, b:8.0, s:1})),
  ...[66,74,82,90].map(x => ({x, b:8.0, s:1})),
];

/* ---------- state ---------- */
let backend = null;
let all = [];            /* current merged, alive candles on display */
let pendingId = null;    /* a candle awaiting its flame — excluded from repaints */
let cal = { bottom:0, scale:1 };
let holder = null;       /* the .cands element */

const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.random()*(b-a);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const alive  = c => Date.now() - c.lit < BURN_MS;
const frac   = c => Math.max(0, 1 - (Date.now() - c.lit) / BURN_MS);
const waxPct = c => 6 + 86 * frac(c);
/* a candle is "mine" (editable) if local, or private, or a global one I own */
const mineC  = c => !backend.cloud || !c.global || c.owner === backend.user?.uid;

/* ================= storage backends ================= */
/* Local: window.storage (artifact) -> localStorage. Everything on this device. */
function makeLocalBackend(){
  const KEY = 'lumen.state.v3';
  const hasWS = typeof window.storage === 'object' && window.storage && window.storage.get;
  const read = async () => {
    if (hasWS){ try{ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
    try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return null; }
  };
  const write = async v => {
    const s = JSON.stringify(v);
    if (hasWS){ try{ await window.storage.set(KEY, s); }catch(e){} return; }
    try{ localStorage.setItem(KEY, s); }catch(e){}
  };
  const migrate = async () => {                          /* pull a v2 candle set if present */
    if (hasWS){ try{ const r = await window.storage.get('lumen.state.v2'); if(r){ const o=JSON.parse(r.value); if(o&&o.candles) return o.candles; } }catch(e){} }
    return null;
  };
  let state = { candles:[] }, cb = null;
  const emit = () => { if (cb) cb(state.candles.filter(alive)); };
  const persist = () => write(state);
  return {
    cloud:false, get user(){ return null; },
    async init(){
      state = (await read()) || {};
      if (!Array.isArray(state.candles)){ const m = await migrate(); state.candles = m || []; }
      emit();
    },
    onData(f){ cb = f; },
    onAuth(){}, async signIn(){}, async signOut(){},
    async addPrivate(c){ state.candles.push({ id:c.id, text:c.text||'', lit:c.lit, slot:c.slot, global:false }); await persist(); emit(); },
    async makeGlobal(c){ const x = state.candles.find(k=>k.id===c.id); if(x){ x.global = true; await persist(); emit(); } },
    async makePrivate(c){ const x = state.candles.find(k=>k.id===c.id); if(x){ x.global = false; await persist(); emit(); } },
    async removeExpired(){ const n = state.candles.length; state.candles = state.candles.filter(alive); if(state.candles.length !== n){ await persist(); } emit(); },
  };
}

/* Cloud: private candles in lumenPrivate/{uid}; global candles in the shared
   lumenGlobal collection. Both stream live via onSnapshot. Sign-in required. */
let fbLoaded = false;
function loadFirebase(){
  if (fbLoaded || window.firebase){ fbLoaded = true; return Promise.resolve(); }
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const files = ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'];
  return files.reduce((p,f) => p.then(() => new Promise((res,rej) => {
    const s = document.createElement('script');
    s.src = base + f; s.onload = res; s.onerror = () => rej(new Error('Could not load '+f));
    document.head.appendChild(s);
  })), Promise.resolve()).then(() => { fbLoaded = true; });
}

async function makeCloudBackend(cfg){
  await loadFirebase();
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const db   = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();

  let cb = null, authCb = null;
  let priv = [], glob = [], unsubP = null, unsubG = null;

  const privRef = () => auth.currentUser ? db.collection('lumenPrivate').doc(auth.currentUser.uid) : null;
  const globCol = () => db.collection('lumenGlobal');
  const P = c => ({ id:c.id, text:c.text||'', lit:c.lit, slot:c.slot });   /* stored shape */

  const emit = () => { if (cb) cb(auth.currentUser ? [...priv, ...glob].filter(alive) : []); };

  const bind = () => {
    if (unsubP){ unsubP(); unsubP = null; }
    if (unsubG){ unsubG(); unsubG = null; }
    priv = []; glob = [];
    if (auth.currentUser){
      unsubP = privRef().onSnapshot(
        s => { priv = (((s.data()||{}).candles)||[]).map(c => ({ ...c, global:false })); emit(); },
        e => console.warn('private sync:', e.message));
      unsubG = globCol().onSnapshot(
        s => { glob = s.docs.map(d => ({ ...d.data(), global:true })); emit(); },
        e => console.warn('global sync:', e.message));
    } else emit();
  };
  auth.onAuthStateChanged(u => { bind(); if (authCb) authCb(u); });

  return {
    cloud:true, get user(){ return auth.currentUser; },
    async init(){ /* snapshots drive the data once signed in */ },
    onData(f){ cb = f; emit(); },
    onAuth(f){ authCb = f; },
    async signIn(){ try{ await auth.signInWithPopup(provider); }catch(e){ console.warn(e.message); } },
    async signOut(){ try{ await auth.signOut(); }catch(e){} },
    async addPrivate(c){
      const ref = privRef(); if (!ref) return;
      await ref.set({ candles: [...priv.map(P), P(c)] });
    },
    async makeGlobal(c){
      const ref = privRef(); if (!ref) return;
      await ref.set({ candles: priv.filter(k => k.id !== c.id).map(P) });
      await globCol().doc(c.id).set({ ...P(c), owner: auth.currentUser.uid });
    },
    async makePrivate(c){
      const ref = privRef(); if (!ref) return;
      await globCol().doc(c.id).delete();
      await ref.set({ candles: [...priv.map(P), P(c)] });
    },
    async removeExpired(){
      const ref = privRef();
      if (ref){ const a = priv.filter(alive).map(P); if (a.length !== priv.length) await ref.set({ candles:a }); }
      const me = auth.currentUser?.uid;
      for (const c of glob.filter(c => c.owner === me && !alive(c))){ try{ await globCol().doc(c.id).delete(); }catch(e){} }
    },
  };
}
/* ================= rendering ================= */
function buildScene(){
  const scene = $('#scene');
  scene.innerHTML =
    '<div class="photo"><img src="'+esc(CHURCH_IMAGE)+'" alt="" referrerpolicy="no-referrer" ' +
    'onerror="this.closest(\'.photo\').classList.add(\'imgfail\')">' +
    '<div class="photo-grad"></div><div class="photo-vig"></div></div>' +
    (CHURCH_ATTRIB ? '<div class="attrib">'+esc(CHURCH_ATTRIB)+'</div>' : '') +
    '<div class="cands"><div class="shelf back"></div><div class="shelf front"></div></div>';
  holder = scene.querySelector('.cands');
}

function candleEl(c){
  const slot = SLOTS[c.slot] || SLOTS[0];
  const el = document.createElement('div');
  el.className = 'candle' + (c.global ? ' global' : '');
  el.style.left = slot.x + '%';
  el.style.bottom = slot.b + '%';
  el.style.setProperty('--s', slot.s);
  el.style.setProperty('--fd', R(0.92,1.65).toFixed(2)+'s');
  el.style.setProperty('--fdel', (-R(0,1.5)).toFixed(2)+'s');
  el.style.setProperty('--wax', waxPct(c).toFixed(1));
  el.style.zIndex = slot.b < 15 ? 4 : 3;
  el.dataset.id = c.id;
  el.dataset.slot = c.slot;
  el.setAttribute('role','button');
  el.setAttribute('aria-label', c.global ? 'A candle, shared with everyone' : 'A candle');
  el.innerHTML = '<div class="glo"></div><div class="flm"><div class="f"></div></div><div class="glass"><div class="wax"></div></div>';
  el.addEventListener('click', ev => { ev.stopPropagation(); showPop(c.id, el); });
  return el;
}

function extinguish(el){
  if (el.classList.contains('gone')) return;
  el.classList.add('gone');
  el.classList.remove('lit');
  const s = document.createElement('div'); s.className = 'smoke';
  el.appendChild(s);
  setTimeout(() => el.remove(), 1800);
}

/* reconcile the rack against the current candle list */
function syncCandles(list){
  if (!holder) return;
  const want = list.filter(alive);
  const wantIds = new Set(want.map(c => c.id));
  holder.querySelectorAll('.candle').forEach(el => {
    if (!wantIds.has(el.dataset.id) && el.dataset.id !== pendingId) extinguish(el);
  });
  const have = new Set([...holder.querySelectorAll('.candle')].map(e => e.dataset.id));
  want.forEach(c => {
    if (c.id === pendingId) return;
    let el = holder.querySelector('[data-id="'+c.id+'"]');
    if (!el){
      el = candleEl(c);
      holder.appendChild(el);
      requestAnimationFrame(() => { el.classList.add('lit','show'); });
    } else {
      el.style.setProperty('--wax', waxPct(c).toFixed(1));
      el.classList.toggle('global', !!c.global);
    }
  });
}

function updateChrome(list){
  const arr = (list || all).filter(alive);
  const n = arr.length;
  const signedOutCloud = backend && backend.cloud && !backend.user;
  const count = $('#count'), hint = $('#hint');
  count.textContent = n === 0 ? 'no candles burning' : n === 1 ? '1 candle burning' : n + ' candles burning';
  count.style.visibility = signedOutCloud ? 'hidden' : 'visible';
  hint.textContent = signedOutCloud ? 'Sign in to light a candle' : 'No candles are burning right now.';
  hint.classList.toggle('on', signedOutCloud || n === 0);
}

/* ---------- popover ---------- */
let popFor = null, popEl = null;
function showPop(id, el){
  const c = all.find(k => k.id === id);
  if (!c){ hidePop(); return; }
  popFor = id; popEl = el;
  const p = $('#pop');
  const status = c.global
    ? '<div class="status glob">✦ Shared with everyone</div>'
    : '<div class="status priv">Private to you</div>';
  let action = '';
  if (mineC(c)){
    action = c.global
      ? '<button class="act plain" id="popPrivate">Make private again</button>'
      : '<button class="act" id="popGlobal">Make global</button>';
  }
  const localNote = (!backend.cloud && c.global)
    ? '<div class="meta" style="margin-top:9px">Sign in to share beyond this device</div>' : '';
  p.innerHTML = '<div class="cross">✠</div>'
    + '<div class="txt">' + (c.text ? esc(c.text) : '<span style="color:#9c8f77">A silent intention.</span>') + '</div>'
    + '<div class="meta">' + metaLine(c) + '</div>'
    + status + localNote + action;
  p.classList.add('on');

  const g = $('#popGlobal'); if (g) g.onclick = () => actOn(id, 'global');
  const v = $('#popPrivate'); if (v) v.onclick = () => actOn(id, 'private');

  const r = el.getBoundingClientRect();
  const w = p.offsetWidth, vw = innerWidth, vh = innerHeight;
  p.style.left = Math.min(Math.max(r.left + r.width/2 - w/2, 10), vw - w - 10) + 'px';
  p.style.bottom = Math.min(vh - r.top + 12, vh - 90) + 'px';
  p.style.top = 'auto';
}
function hidePop(){ $('#pop').classList.remove('on'); popFor = null; popEl = null; }

async function actOn(id, to){
  const c = all.find(k => k.id === id); if (!c) return;
  c.global = (to === 'global');                 /* optimistic */
  const el = holder && holder.querySelector('[data-id="'+id+'"]');
  if (el) el.classList.toggle('global', c.global);
  if (popFor === id && popEl) showPop(id, popEl);
  try {
    if (to === 'global') await backend.makeGlobal(c);
    else await backend.makePrivate(c);
  } catch(e){ console.warn(e.message); }
}

const metaLine = c => 'Lit ' + fmtWhen(c.lit) + '<br>' + fmtRemain(c) + ' remaining';
function fmtWhen(ts){
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return d.toDateString() === now.toDateString() ? 'today at ' + t
    : d.toLocaleDateString([], {weekday:'long'}) + ' at ' + t;
}
function fmtRemain(c){
  const ms = BURN_MS - (Date.now() - c.lit);
  if (ms < 60000) return 'only moments';
  const h = Math.floor(ms/3600000), m = Math.round(ms%3600000/60000);
  return h > 0 ? 'about ' + h + 'h ' + m + 'm' : 'about ' + m + 'm';
}

/* ---------- lighting a candle ---------- */
function freeSlot(){
  const used = new Set(all.filter(alive).map(c => c.slot));
  const free = SLOTS.map((_,i) => i).filter(i => !used.has(i));
  return free.length ? free[Math.floor(Math.random()*free.length)]
                     : Math.floor(Math.random()*SLOTS.length);   /* overflow: gentle overlap */
}

async function lightCandle(){
  const text = els_intent().value.trim();
  const wantGlobal = $('#shareChk').checked;
  const b = $('#igniteBtn').getBoundingClientRect();
  const sx = b.left + b.width/2, sy = b.top + b.height/2;
  closeVeil();

  const c = { id: uid(), text, lit: Date.now(), slot: freeSlot(), global:false,
              owner: backend.user?.uid };
  pendingId = c.id;

  await backend.addPrivate(c);
  if (wantGlobal){ try{ await backend.makeGlobal(c); c.global = true; }catch(e){ console.warn(e.message); } }

  const stale = holder.querySelector('[data-slot="'+c.slot+'"]');
  if (stale && stale.dataset.id !== pendingId) stale.remove();
  const el = candleEl(c);
  holder.appendChild(el);
  el.classList.add('show');

  setTimeout(() => flyTo(el, sx, sy, () => {
    el.classList.add('lit');
    pendingId = null;
    updateChrome();
    const t = $('#toast'); t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 2400);
  }), 120);
}

function flyTo(el, sx, sy, done){
  const flm = el.querySelector('.flm');
  const r = flm.getBoundingClientRect();
  const tx = r.left + r.width/2 - 5.5, ty = r.top + r.height/2 - 9.5;
  const startX = sx - 5.5, startY = sy - 9.5;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ done(); return; }
  const fly = $('#fly');
  fly.style.display = 'block';
  const anim = fly.animate([
    { transform: `translate(${startX}px, ${startY}px) scale(.85)`, opacity: .95 },
    { transform: `translate(${(startX+tx)/2}px, ${Math.min(startY,ty)-110}px) scale(1.25)`, opacity: 1, offset: .55 },
    { transform: `translate(${tx}px, ${ty}px) scale(1)`, opacity: 1 }
  ], { duration: 1250, easing: 'cubic-bezier(.45,.08,.32,1)' });
  anim.onfinish = () => { fly.style.display = 'none'; done(); };
}

/* ---------- calibrator ---------- */
function loadCal(){
  try{ const c = JSON.parse(localStorage.getItem('lumen.cal') || 'null'); if (c) cal = c; }catch(e){}
}
function applyCal(){
  document.documentElement.style.setProperty('--rack-shift', cal.bottom + 'vh');
  document.documentElement.style.setProperty('--rack-scale', cal.scale);
  const b = $('#calB'), s = $('#calS');
  if (b){ b.value = cal.bottom; $('#calBVal').textContent = (cal.bottom>0?'+':'') + cal.bottom; }
  if (s){ s.value = cal.scale; $('#calSVal').textContent = '×' + Number(cal.scale).toFixed(2); }
}
function saveCal(){ try{ localStorage.setItem('lumen.cal', JSON.stringify(cal)); }catch(e){} }

/* ---------- modals ---------- */
const els_intent = () => $('#intent');
function openVeil(){
  hidePop();
  $('#shareChk').checked = false;
  $('#veil').classList.add('on');
  els_intent().value = '';
  setTimeout(() => els_intent().focus(), 60);
}
const closeVeil = () => $('#veil').classList.remove('on');
const openSettings = () => $('#settings').classList.add('on');
const closeSettings = () => $('#settings').classList.remove('on');

/* ---------- auth UI ---------- */
function refreshAuthUI(){
  const btn = $('#authBtn'), who = $('#who');
  if (!backend.cloud){ btn.style.display = 'none'; who.textContent = ''; return; }
  const u = backend.user;
  btn.style.display = '';
  btn.textContent = u ? 'Sign out' : 'Sign in';
  who.textContent = u ? (u.displayName || u.email || '') : '';
}

/* ---------- wiring ---------- */
$('#lightBtn').addEventListener('click', () => {
  if (backend.cloud && !backend.user){ backend.signIn(); return; }
  openVeil();
});
$('#cancelBtn').addEventListener('click', closeVeil);
$('#igniteBtn').addEventListener('click', lightCandle);
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeVeil(); });
els_intent().addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter') lightCandle(); });

$('#gearBtn').addEventListener('click', openSettings);
$('#setClose').addEventListener('click', closeSettings);
$('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
$('#calReset').addEventListener('click', () => { cal = { bottom:0, scale:1 }; applyCal(); saveCal(); });
$('#calB').addEventListener('input', e => { cal.bottom = parseFloat(e.target.value); applyCal(); saveCal(); });
$('#calS').addEventListener('input', e => { cal.scale = parseFloat(e.target.value); applyCal(); saveCal(); });

$('#authBtn').addEventListener('click', () => { backend.user ? backend.signOut() : backend.signIn(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeVeil(); hidePop(); closeSettings(); }
});
document.body.addEventListener('click', e => {
  if (!$('#pop').contains(e.target) && !e.target.closest('.candle')) hidePop();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncCandles(all); });

/* ---------- init ---------- */
(async () => {
  loadCal(); applyCal();
  document.documentElement.style.setProperty('--img-y', CHURCH_FOCAL_Y + '%');
  buildScene();
  if (CHURCH_LABEL){ $('#labelText').textContent = CHURCH_LABEL; } else { $('#label').style.display = 'none'; }
  $('#note').innerHTML = '✠ &nbsp;Each candle burns about ' + BURN_HOURS + ' hours, as a votive does';
  $('#calHint').innerHTML = 'Drag until the little candles rest on the floor of the church. Saved on this device.';

  const useCloud = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey;
  try { backend = useCloud ? await makeCloudBackend(FIREBASE_CONFIG) : makeLocalBackend(); }
  catch(e){ console.warn('Cloud unavailable, staying local:', e.message); backend = makeLocalBackend(); }

  /* in local mode there is no one to share with — the share toggle is hidden */
  if (!backend.cloud) $('#shareRow').style.display = 'none';

  backend.onData(list => { all = list; syncCandles(all); updateChrome(list); });
  if (backend.cloud){
    backend.onAuth(() => { refreshAuthUI(); updateChrome(); $('#shareRow').style.display = backend.user ? '' : 'none'; });
  }
  await backend.init();
  refreshAuthUI(); updateChrome();

  let n = 0;
  setInterval(async () => {
    syncCandles(all); updateChrome();
    if (popFor){ const c = all.find(k => k.id === popFor); const m = $('#pop').querySelector('.meta'); if (c && m) m.innerHTML = metaLine(c); }
    if (++n % 3 === 0 && backend.removeExpired) await backend.removeExpired();
  }, 12000);
})();
</script>
