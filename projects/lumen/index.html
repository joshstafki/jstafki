<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<title>LUMEN — Light a Candle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0806;
  --ink:#efe6d4;
  --gold:#c9a769;
  --gold-bright:#e8c87e;
  --muted:#8a7d68;
  --faint:#6d6250;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}

/* ---------- stage & scenes ---------- */
#stage{position:fixed;inset:0;background:var(--bg)}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;pointer-events:none}
.scene.on{opacity:1}
.scene svg{width:100%;height:100%;display:block}
.cands{position:absolute;inset:0}

/* ---------- votive rack ---------- */
.shelf{
  position:absolute;height:9px;border-radius:4px;
  background:linear-gradient(180deg,#382b22,#170f0b 55%,#090604);
  box-shadow:0 12px 26px rgba(0,0,0,.7), inset 0 1px 0 rgba(224,176,116,.22);
}
.shelf.back{bottom:20%;left:13%;right:13%}
.shelf.front{bottom:7.5%;left:3%;right:3%}

/* ---------- candle ---------- */
.candle{
  position:absolute;width:34px;height:112px;
  transform:translateX(-50%) scale(var(--s,1));
  transform-origin:50% 100%;
  pointer-events:auto;cursor:pointer;
  opacity:0;transition:opacity .7s ease;
}
.candle.show{opacity:1}
.glass{
  position:absolute;left:50%;bottom:0;width:30px;height:42px;margin-left:-15px;
  border-radius:5px 5px 10px 10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(214,64,42,.36),rgba(152,26,16,.6) 45%,rgba(86,12,8,.84) 78%,rgba(48,7,5,.92));
  box-shadow:inset 0 1px 4px rgba(255,152,102,.4), inset 0 -6px 10px rgba(0,0,0,.55), 0 5px 12px rgba(0,0,0,.55);
}
.glass::before{
  content:"";position:absolute;top:2px;bottom:5px;left:4px;width:5px;border-radius:4px;
  background:linear-gradient(180deg,rgba(255,224,196,.5),rgba(255,224,196,.05));
}
.wax{
  position:absolute;left:3px;right:3px;bottom:3px;
  height:calc(var(--wax,90)*.36px);
  border-radius:3px 3px 6px 6px;
  background:linear-gradient(180deg,#ffdf9e 0%,#f6e8ca 24%,#e9d8b0 100%);
  box-shadow:0 -2px 7px rgba(255,172,72,.6);
  transition:height 1s linear;
}
.flm{
  position:absolute;left:50%;bottom:calc(3px + var(--wax,90)*.36px);
  width:10px;height:17px;margin-left:-5px;z-index:2;
  transform:scale(0);transform-origin:50% 100%;
}
.candle.lit .flm{transform:scale(1);transition:transform .55s cubic-bezier(.2,1.7,.4,1)}
.flm .f{
  position:absolute;inset:0;transform-origin:50% 100%;
  background:linear-gradient(180deg,#fff9e3 0%,#ffe9a3 30%,#ffb43d 62%,#ff7a1f 84%,rgba(255,90,30,.35) 100%);
  border-radius:50% 50% 44% 44% / 66% 66% 34% 34%;
  filter:drop-shadow(0 0 5px rgba(255,190,90,.95)) drop-shadow(0 -2px 14px rgba(255,150,50,.5));
  animation:flick var(--fd,1.15s) ease-in-out var(--fdel,0s) infinite alternate;
}
.flm .f::after{
  content:"";position:absolute;left:50%;bottom:1px;width:4px;height:7px;margin-left:-2px;
  border-radius:50% 50% 40% 40% / 60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff,rgba(255,255,240,.55) 70%,transparent);
}
.flm .f::before{
  content:"";position:absolute;left:50%;bottom:-1px;width:6px;height:5px;margin-left:-3px;border-radius:50%;
  background:radial-gradient(circle,rgba(122,162,255,.85),rgba(92,122,255,.12) 70%,transparent);
}
@keyframes flick{
  0%{transform:scaleX(1) scaleY(.97) skewX(-2deg) rotate(-1deg)}
  55%{transform:scaleX(.92) scaleY(1.06) skewX(2.4deg) rotate(1.2deg)}
  100%{transform:scaleX(1.02) scaleY(.99) skewX(-1deg) rotate(0deg)}
}
.glo{
  position:absolute;left:50%;bottom:calc(var(--wax,90)*.36px - 34px);
  width:120px;height:120px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,178,84,.4) 0%,rgba(255,150,60,.14) 42%,transparent 68%);
  mix-blend-mode:screen;pointer-events:none;opacity:0;
  animation:glowp var(--fd,1.15s) ease-in-out var(--fdel,0s) infinite alternate;
}
.candle.lit .glo{opacity:1;transition:opacity .8s ease}
@keyframes glowp{from{transform:scale(.95)}to{transform:scale(1.06)}}
.smoke{
  position:absolute;left:50%;bottom:30px;width:9px;height:28px;margin-left:-4px;border-radius:50%;
  background:radial-gradient(circle,rgba(205,205,215,.55),transparent 70%);
  filter:blur(3px);pointer-events:none;
  animation:rise 1.8s ease-out forwards;
}
@keyframes rise{to{transform:translateY(-52px) translateX(6px) scale(2.3);opacity:0}}

/* ---------- chrome ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:6;
  padding:calc(16px + env(safe-area-inset-top)) 22px 0;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
}
.wm{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.42em;color:var(--gold-bright)}
.wm .wm-cross{color:var(--gold);margin-left:-.3em}
.count{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);padding-top:4px;text-align:right}

#title{
  position:fixed;top:calc(46px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:6;text-align:center;pointer-events:none;width:min(560px,86vw);
}
#title .n{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.8)}
#title .d{margin-top:4px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px;pointer-events:auto}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(200,167,105,.26);border:0;cursor:pointer;padding:0;transition:.25s}
.dot.on{background:var(--gold-bright);box-shadow:0 0 9px rgba(232,200,126,.85)}

.nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:6;
  width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(200,167,105,.32);background:rgba(10,8,6,.32);
  color:var(--gold);font-size:22px;line-height:36px;text-align:center;
  cursor:pointer;backdrop-filter:blur(2px);transition:.22s;font-family:var(--serif);
}
.nav:hover{border-color:var(--gold);color:var(--gold-bright)}
#prev{left:14px}#next{right:14px}

#hint{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(2.6% + 62px);z-index:5;pointer-events:none;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);
  text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;
}
#hint.on{opacity:1}

#lightBtn{
  position:fixed;left:50%;bottom:calc(2.6% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;
  font:600 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold-bright);
  background:linear-gradient(180deg,rgba(28,20,12,.92),rgba(13,9,6,.96));
  border:1px solid rgba(200,167,105,.55);border-radius:3px;
  padding:14px 26px 13px 30px;cursor:pointer;
  box-shadow:0 10px 34px rgba(0,0,0,.65);transition:.25s;
}
#lightBtn:hover{border-color:var(--gold-bright);box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 26px rgba(232,200,126,.2)}

/* ---------- modal ---------- */
#veil{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(4,3,2,.68);backdrop-filter:blur(3px);padding:20px;
}
#veil.on{display:flex}
.panel{
  width:min(440px,100%);border-radius:6px;padding:30px 30px 24px;
  background:linear-gradient(180deg,#181108,#0e0a06);
  border:1px solid rgba(200,167,105,.4);
  box-shadow:0 34px 90px rgba(0,0,0,.75);
  animation:panelin .35s cubic-bezier(.2,1.2,.4,1);
}
@keyframes panelin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel h2{font-family:var(--serif);font-weight:500;font-size:28px;color:#f0e2c4;text-align:center}
.panel .sub{font-family:var(--serif);font-style:italic;font-size:15.5px;color:#b6a685;text-align:center;margin-top:5px}
#intent{
  width:100%;margin-top:18px;min-height:96px;resize:vertical;outline:none;
  background:#0a0705;border:1px solid rgba(200,167,105,.28);border-radius:4px;
  color:var(--ink);font:400 16px/1.55 var(--serif);padding:12px 14px;
  user-select:text;-webkit-user-select:text;
}
#intent:focus{border-color:rgba(232,200,126,.6)}
#intent::placeholder{color:#5d5344;font-style:italic}
.note{margin-top:13px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7d7059;text-align:center;line-height:1.9}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{
  flex:1;padding:12px 0;border-radius:3px;cursor:pointer;
  font:600 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;transition:.2s;
}
.ghost{background:none;border:1px solid rgba(180,160,130,.25);color:#9c8f77}
.ghost:hover{border-color:rgba(180,160,130,.5);color:#bdb096}
.solid{background:linear-gradient(180deg,#3c2c12,#251a0b);border:1px solid rgba(232,200,126,.6);color:#f0dfae}
.solid:hover{border-color:var(--gold-bright);box-shadow:0 0 20px rgba(232,200,126,.18)}

/* ---------- candle popover ---------- */
#pop{
  position:fixed;z-index:15;width:min(300px,86vw);display:none;text-align:center;
  background:linear-gradient(180deg,#181108,#0e0a06);
  border:1px solid rgba(200,167,105,.4);border-radius:6px;
  padding:16px 20px 14px;box-shadow:0 24px 60px rgba(0,0,0,.7);
}
#pop.on{display:block}
#pop .cross{color:var(--gold);font-size:13px}
#pop .txt{font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.5;color:var(--ink);margin:7px 0 10px;max-height:150px;overflow:auto}
#pop .meta{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.9}

/* ---------- toast & flying flame ---------- */
#toast{
  position:fixed;left:50%;top:37%;transform:translate(-50%,-50%);z-index:30;
  text-align:center;opacity:0;pointer-events:none;transition:opacity .7s ease;
}
#toast.on{opacity:1}
#toast .l1{font-family:var(--serif);font-style:italic;font-size:36px;color:#f0dfae;text-shadow:0 0 34px rgba(232,200,126,.4)}
#toast .l2{margin-top:5px;font-family:var(--serif);font-style:italic;font-size:17px;color:#b6a685}
#fly{
  position:fixed;left:0;top:0;z-index:25;width:11px;height:19px;display:none;pointer-events:none;
  background:linear-gradient(180deg,#fff9e3 0%,#ffe9a3 30%,#ffb43d 62%,#ff7a1f 88%,rgba(255,90,30,.3) 100%);
  border-radius:50% 50% 44% 44% / 66% 66% 34% 34%;
  filter:drop-shadow(0 0 7px rgba(255,190,90,1)) drop-shadow(0 0 20px rgba(255,150,50,.6));
}

/* ---------- responsive & motion ---------- */
@media (max-width:560px){
  .candle{transform:translateX(-50%) scale(calc(var(--s,1)*.74))}
  .count{display:none}
  #title .n{font-size:17px}
  .nav{width:34px;height:34px;line-height:30px;font-size:19px}
  #prev{left:8px}#next{right:8px}
}
@media (prefers-reduced-motion:reduce){
  .flm .f,.glo{animation:none}
  .scene{transition:none}
}

/* ---------- photo scene ---------- */
.photo{position:absolute;inset:0;background:#0a0806}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.imgfail img{display:none}
.photo.imgfail::after{content:"This image couldn’t be loaded — check the link, or the site may block hotlinking.";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;color:var(--faint);font:italic 16px var(--serif)}
.photo-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,4,.6) 0%,rgba(6,5,4,.1) 24%,rgba(6,5,4,0) 46%,rgba(6,5,4,.34) 66%,rgba(6,5,4,.88) 100%)}
.photo-vig{position:absolute;inset:0;background:radial-gradient(122% 92% at 50% 42%,transparent 52%,rgba(4,3,2,.68) 100%)}
.attrib{position:absolute;left:12px;bottom:calc(2.6% + 82px);z-index:2;font-size:9px;letter-spacing:.05em;color:rgba(200,186,160,.5);max-width:44%;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

/* ---------- header buttons ---------- */
.hbtns{display:flex;gap:14px;align-items:center;pointer-events:auto}
.hbtn{background:none;border:0;color:var(--muted);font:600 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:4px 0;transition:.2s}
.hbtn:hover{color:var(--gold-bright)}
.who{font-size:9px;letter-spacing:.08em;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{color:var(--muted);cursor:pointer;transition:.25s;background:none;border:0;padding:0;line-height:0}
.gear:hover{color:var(--gold-bright);transform:rotate(35deg)}

/* ---------- settings panel ---------- */
#settings{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(4,3,2,.68);backdrop-filter:blur(3px);padding:20px}
#settings.on{display:flex}
.pw{width:min(500px,100%);max-height:88vh;overflow:auto}
.pw h2{text-align:left}.pw .sub{text-align:left;margin-bottom:14px}
.churchrow{display:flex;align-items:center;gap:13px;padding:9px 0;border-bottom:1px solid rgba(200,167,105,.13)}
.churchrow .th{width:54px;height:37px;border-radius:3px;object-fit:cover;background:#1a130c;flex:none}
.churchrow .thi{width:54px;height:37px;border-radius:3px;background:linear-gradient(180deg,#241a10,#0e0a06);flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:13px}
.churchrow .cn{flex:1;min-width:0}
.churchrow .cn b{font-family:var(--serif);font-weight:500;font-size:16.5px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.churchrow .cn span{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.churchrow .rm{background:none;border:0;color:var(--faint);font-size:19px;cursor:pointer;flex:none;padding:0 4px;line-height:1}
.churchrow .rm:hover{color:#c0564a}
.addform h3{font-family:var(--serif);font-weight:500;font-size:21px;color:#f0e2c4;margin-top:22px}
.addform label{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.addform input[type=text]{width:100%;background:#0a0705;border:1px solid rgba(200,167,105,.24);border-radius:4px;color:var(--ink);font:400 14px var(--sans);padding:9px 11px;outline:none;user-select:text;-webkit-user-select:text}
.addform input[type=text]:focus{border-color:rgba(232,200,126,.55)}
.addform input::placeholder{color:#5d5344}
.chk{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12.5px;font-family:var(--serif);color:#b6a685;cursor:pointer}
.chk input{accent-color:#a97f2c;width:15px;height:15px}
.hintline{font-size:10.5px;line-height:1.75;color:var(--faint);margin-top:12px}
.hintline b{color:var(--muted);font-weight:500;font-family:var(--sans)}
</style>
</head>
<body>

<header>
  <div class="wm">LVMEN<span class="wm-cross"> ✠</span></div>
  <div class="hbtns">
    <div class="count" id="count"></div>
    <span class="who" id="who"></span>
    <button class="hbtn" id="authBtn" style="display:none"></button>
    <button class="gear" id="gearBtn" aria-label="Churches" title="Churches">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5.05 5.05l2.26 2.26M16.69 16.69l2.26 2.26M18.95 5.05l-2.26 2.26M7.31 16.69l-2.26 2.26"/></svg>
    </button>
  </div>
</header>

<div id="title">
  <div class="n" id="chName"></div>
  <div class="d" id="chDesc"></div>
  <div class="dots" id="dots"></div>
</div>

<div id="stage">
  <div class="scene" id="sceneA"></div>
  <div class="scene" id="sceneB"></div>
</div>

<button class="nav" id="prev" aria-label="Previous church">‹</button>
<button class="nav" id="next" aria-label="Next church">›</button>

<div id="hint">No candles are burning tonight.</div>
<button id="lightBtn">Light a Candle</button>

<div id="veil" role="dialog" aria-modal="true" aria-labelledby="veilH">
  <div class="panel">
    <h2 id="veilH">An Intention</h2>
    <p class="sub">For whom, or for what, shall this candle burn?</p>
    <textarea id="intent" maxlength="400" placeholder="For…" aria-label="Your intention"></textarea>
    <div class="note" id="note"></div>
    <div class="actions">
      <button class="ghost" id="cancelBtn">Never mind</button>
      <button class="solid" id="igniteBtn">Light the Candle</button>
    </div>
  </div>
</div>

<div id="pop"></div>

<div id="settings" role="dialog" aria-modal="true" aria-labelledby="setH">
  <div class="panel pw">
    <h2 id="setH">Churches</h2>
    <p class="sub">The chapels a candle may find</p>
    <div id="churchList"></div>
    <div class="addform">
      <h3>Add a church</h3>
      <label>Image link</label>
      <input type="text" id="cImg" placeholder="https://…/church-interior.jpg" autocomplete="off" spellcheck="false">
      <label>Name — optional</label>
      <input type="text" id="cName" placeholder="e.g. St Mary’s" autocomplete="off">
      <label>A word on its style — optional</label>
      <input type="text" id="cDesc" placeholder="e.g. Gothic" autocomplete="off">
      <label class="chk"><input type="checkbox" id="cMon"> The Blessed Sacrament is exposed</label>
      <p class="hintline" id="addHint"></p>
      <div class="actions">
        <button class="ghost" id="setClose">Done</button>
        <button class="solid" id="cAdd">Add church</button>
      </div>
    </div>
  </div>
</div>

<div id="toast">
  <div class="l1">Lumen Christi.</div>
  <div class="l2">℟. Deo grátias.</div>
</div>

<div id="fly"></div>

<script>
/* ================= LVMEN — a digital votive =================
   Single-file, no build step. Storage: window.storage (Claude
   artifacts) -> localStorage (self-hosted) -> memory fallback.
   ============================================================ */

/* ---------- scene helpers ---------- */
const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.random()*(b-a);

function rays(cx, cy, n, r0, r1, fill){
  let s = '';
  for(let i=0;i<n;i++){
    const long = i%2===0, RR = long ? r1 : r1*0.68;
    const a = i/n*Math.PI*2 - Math.PI/2, w = Math.PI/n*0.42;
    s += `<polygon points="${(cx+Math.cos(a-w)*r0).toFixed(1)},${(cy+Math.sin(a-w)*r0).toFixed(1)} ${(cx+Math.cos(a)*RR).toFixed(1)},${(cy+Math.sin(a)*RR).toFixed(1)} ${(cx+Math.cos(a+w)*r0).toFixed(1)},${(cy+Math.sin(a+w)*r0).toFixed(1)}" fill="${fill}"/>`;
  }
  return s;
}

/* tiny altar flame (glow halo + body + core) */
function fl(x, y, rx, ry, p){
  return `<ellipse cx="${x}" cy="${y}" rx="${rx*3}" ry="${ry*2.4}" fill="url(#${p}_fglow)"/>
  <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#ffd98d"/>
  <ellipse cx="${x}" cy="${y+ry*0.22}" rx="${rx*0.45}" ry="${ry*0.5}" fill="#fff6dc"/>`;
}

/* gold candlestick with white candle + flame */
function stick(x, y, h, p, s=1){
  return `<rect x="${x-1.4*s}" y="${y-h}" width="${2.8*s}" height="${h}" fill="url(#${p}_gold)"/>
  <rect x="${x-4.5*s}" y="${y-2.5*s}" width="${9*s}" height="${2.5*s}" rx="1" fill="url(#${p}_gold)"/>

function floorLines(hy, by, cx, step, color){
  let s = '';
  for(let x=step/2; x<1200; x+=step){
    s += `<line x1="${x}" y1="${by}" x2="${(cx+(x-cx)*0.18).toFixed(1)}" y2="${hy}" stroke="${color}" stroke-width="2"/>`;
  }
  return s;
}
function courses(hy, by, halfH, halfB, cx, ys, color){
  return ys.map(y=>{
    const t=(y-hy)/(by-hy), h=halfH+(halfB-halfH)*t;
    return `<line x1="${(cx-h).toFixed(1)}" y1="${y}" x2="${(cx+h).toFixed(1)}" y2="${y}" stroke="${color}" stroke-width="1.6"/>`;
  }).join('');
}

/* Local: window.storage (artifact) -> localStorage -> memory. State is {candles, churches}. */
function makeLocalBackend(){
  const KEY = 'lumen.state.v2';
  const hasWS = typeof window.storage === 'object' && window.storage && window.storage.get;
  let mem = null;
  const rawGet = async () => {
    if (hasWS){ try{ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
    try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return mem; }
  };
  const rawSet = async v => {
    const s = JSON.stringify(v);
    if (hasWS){ try{ await window.storage.set(KEY, s); }catch(e){} return; }
    try{ localStorage.setItem(KEY, s); }catch(e){ mem = v; }
  };
  const migrate = async () => {                       /* pull v1 candle array if present */
    if (hasWS){ try{ const r = await window.storage.get('lumen.candles.v1'); if(r){ const a=JSON.parse(r.value); if(Array.isArray(a)) return {candles:a, churches:[]}; } }catch(e){} }
    try{ const a = JSON.parse(localStorage.getItem('lumen.candles.v1')||'null'); if(Array.isArray(a)) return {candles:a, churches:[]}; }catch(e){}
    return null;
  };
  return {
    cloud:false, get user(){ return null; },
    async load(){
      let s = await rawGet();
      if (Array.isArray(s)) s = {candles:s, churches:[]};
      if (!s) s = await migrate();
      return s || {candles:[], churches:[]};
    },
    async save(state){ await rawSet(state); },
    onChange(){}, onAuth(){}, async signIn(){}, async signOut(){},
  };
}

/* Cloud: Firestore doc lumen/{uid}, live via onSnapshot. Falls back to local while signed out. */
let fbLoaded = false;
function loadFirebase(){
  if (fbLoaded || window.firebase) { fbLoaded = true; return Promise.resolve(); }
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const files = ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'];
  return files.reduce((p,f) => p.then(() => new Promise((res,rej) => {
    const s = document.createElement('script');
    s.src = base + f; s.onload = res; s.onerror = () => rej(new Error('Could not load '+f));
    document.head.appendChild(s);
  })), Promise.resolve()).then(() => { fbLoaded = true; });
}

async function makeCloudBackend(cfg){
  await loadFirebase();
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const db   = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();
  const local = makeLocalBackend();
  let unsub = null, changeCb = null, authCb = null;

  const docRef = () => auth.currentUser ? db.collection('lumen').doc(auth.currentUser.uid) : null;
  const bind = () => {
    if (unsub){ unsub(); unsub = null; }
    const ref = docRef();
    if (ref && changeCb){
      unsub = ref.onSnapshot(
        snap => changeCb(snap.data() || {candles:[], churches:[]}),
        err  => console.warn('sync:', err.message)
      );
    }
  };
  auth.onAuthStateChanged(u => { bind(); if (authCb) authCb(u); });

  return {
    cloud:true,
    get user(){ return auth.currentUser; },
    async load(){
      const ref = docRef();
      if (!ref) return local.load();
      const snap = await ref.get();
      return snap.exists ? snap.data() : {candles:[], churches:[]};
    },
    async save(state){
      const ref = docRef();
      if (ref) { try{ await ref.set(state); }catch(e){ console.warn('save:', e.message); } }
      else await local.save(state);
    },
    onChange(cb){ changeCb = cb; bind(); },
    onAuth(cb){ authCb = cb; },
    async signIn(){ try{ await auth.signInWithPopup(provider); }catch(e){ console.warn(e.message); } },
    async signOut(){ try{ await auth.signOut(); }catch(e){} },
  };
}

const saveState = () => backend.save({ candles, churches: custom });

/* ================= rendering ================= */
function candleEl(c){
  const slot = SLOTS[c.slot] || SLOTS[0];
  const el = document.createElement('div');
  el.className = 'candle';
  el.style.left = slot.x + '%';
  el.style.bottom = slot.b + '%';
  el.style.setProperty('--s', slot.s);
  el.style.setProperty('--fd', R(0.92,1.65).toFixed(2)+'s');
  el.style.setProperty('--fdel', (-R(0,1.5)).toFixed(2)+'s');
  el.style.setProperty('--wax', waxPct(c).toFixed(1));
  el.style.zIndex = slot.b < 15 ? 4 : 3;
  el.dataset.id = c.id;
  el.dataset.slot = c.slot;
  el.setAttribute('role','button');
  el.setAttribute('aria-label','A burning candle');
  el.innerHTML = '<div class="glo"></div><div class="flm"><div class="f"></div></div><div class="glass"><div class="wax"></div></div>';
  el.addEventListener('click', ev => { ev.stopPropagation(); showPop(c, el); });
  return el;
}

const RACK = '<div class="cands"><div class="shelf back"></div><div class="shelf front"></div></div>';

function renderScene(id, instant){
  const entry = churchById(id) || BUILTINS[0];
  id = entry.id;
  const inEl  = activeLayer === 'A' ? els.B : els.A;
  const outEl = activeLayer === 'A' ? els.A : els.B;
  activeLayer = activeLayer === 'A' ? 'B' : 'A';

  if (entry.img){
    inEl.innerHTML =
      '<div class="photo"><img src="'+esc(entry.img)+'" alt="" referrerpolicy="no-referrer" ' +
      'onerror="this.closest(\'.photo\').classList.add(\'imgfail\')">' +
      '<div class="photo-grad"></div><div class="photo-vig"></div></div>' +
      (entry.attrib ? '<div class="attrib">'+esc(entry.attrib)+'</div>' : '') + RACK;
  } else {
    inEl.innerHTML = entry.scene() + RACK;
  }

  const holder = inEl.querySelector('.cands');
  const mine = candles.filter(c => c.church === id && alive(c) && c.id !== pendingId);
  mine.forEach((c,i) => {
    const el = candleEl(c);
    el.classList.add('lit');
    holder.appendChild(el);
    setTimeout(() => el.classList.add('show'), instant ? 60 + i*70 : 240 + i*70);
  });

  els.name.textContent = entry.name;
  els.desc.textContent = entry.desc || (entry.hasMonstrance ? 'the Blessed Sacrament exposed' : '');
  renderDots(id);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    inEl.classList.add('on'); outEl.classList.remove('on');
  }));
  setTimeout(() => { if(!outEl.classList.contains('on')) outEl.innerHTML = ''; }, 640);
  curId = id;
  updateCount();
}

const activeCands = () => (activeLayer === 'A' ? els.A : els.B).querySelector('.cands');

function renderDots(activeId){
  els.dots.innerHTML = '';
  churches().forEach(c => {
    const d = document.createElement('button');
    d.className = 'dot' + (c.id === activeId ? ' on' : '');
    d.setAttribute('aria-label', c.name);
    d.addEventListener('click', () => renderScene(c.id));
    els.dots.appendChild(d);
  });
}

function updateCount(){
  const n = candles.filter(alive).length;
  els.count.textContent = n === 0 ? 'no candles burning'
    : n === 1 ? '1 candle burning' : n + ' candles burning';
  els.hint.classList.toggle('on', n === 0);
}

function step(delta){
  const ids = orderIds();
  const i = Math.max(0, ids.indexOf(curId));
  renderScene(ids[(i + delta + ids.length) % ids.length]);
}

/* ---------- popover ---------- */
let popFor = null;
function showPop(c, el){
  popFor = c.id;
  els.pop.innerHTML = '<div class="cross">✠</div>'
    + '<div class="txt">' + (c.text ? esc(c.text) : '<span style="color:#9c8f77">A silent intention.</span>') + '</div>'
    + '<div class="meta">' + metaLine(c) + '</div>';
  els.pop.classList.add('on');
  const r = el.getBoundingClientRect();
  const w = els.pop.offsetWidth, vw = innerWidth, vh = innerHeight;
  els.pop.style.left = Math.min(Math.max(r.left + r.width/2 - w/2, 10), vw - w - 10) + 'px';
  els.pop.style.bottom = Math.min(vh - r.top + 12, vh - 90) + 'px';
  els.pop.style.top = 'auto';
}
const hidePop = () => { els.pop.classList.remove('on'); popFor = null; };
const metaLine = c => 'Lit ' + fmtWhen(c.lit) + '<br>' + fmtRemain(c) + ' remaining';
function fmtWhen(ts){
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return d.toDateString() === now.toDateString() ? 'today at ' + t
    : d.toLocaleDateString([], {weekday:'long'}) + ' at ' + t;
}
function fmtRemain(c){
  const ms = BURN_MS - (Date.now() - c.lit);
  if (ms < 60000) return 'only moments';
  const h = Math.floor(ms/3600000), m = Math.round(ms%3600000/60000);
  return h > 0 ? 'about ' + h + 'h ' + m + 'm' : 'about ' + m + 'm';
}

/* ---------- lighting a candle ---------- */
function pickPlacement(){
  const ids = orderIds().slice().sort(() => Math.random() - .5);
  for (const id of ids){
    const used = new Set(candles.filter(c => c.church === id && alive(c)).map(c => c.slot));
    const free = SLOTS.map((_,i) => i).filter(i => !used.has(i));
    if (free.length) return { church:id, slot:free[Math.floor(Math.random()*free.length)] };
  }
  const oldest = candles.filter(alive).sort((a,b) => a.lit - b.lit)[0];   /* every rack full */
  candles = candles.filter(c => c.id !== oldest.id);
  return { church:oldest.church, slot:oldest.slot };
}

async function lightCandle(){
  const text = els.intent.value.trim();
  const b = $('#igniteBtn').getBoundingClientRect();
  const sx = b.left + b.width/2, sy = b.top + b.height/2;
  closeVeil();

  const place = pickPlacement();
  const c = { id: uid(), church: place.church, slot: place.slot, text, lit: Date.now() };
  pendingId = c.id;
  candles.push(c);
  saveState();

  const go = () => {
    const holder = activeCands();
    const stale = holder.querySelector('[data-slot="' + place.slot + '"]');
    if (stale) stale.remove();
    const el = candleEl(c);
    holder.appendChild(el);
    el.classList.add('show');
    setTimeout(() => flyTo(el, sx, sy, () => {
      el.classList.add('lit');
      pendingId = null;
      updateCount();
      els.toast.classList.add('on');
      setTimeout(() => els.toast.classList.remove('on'), 2400);
    }), 120);
  };

  if (place.church !== curId){ renderScene(place.church); setTimeout(go, 620); }
  else { updateCount(); go(); }
}

function flyTo(el, sx, sy, done){
  const flm = el.querySelector('.flm');
  const r = flm.getBoundingClientRect();
  const tx = r.left + r.width/2 - 5.5, ty = r.top + r.height/2 - 9.5;
  const startX = sx - 5.5, startY = sy - 9.5;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ done(); return; }
  els.fly.style.display = 'block';
  const anim = els.fly.animate([
    { transform: `translate(${startX}px, ${startY}px) scale(.85)`, opacity: .95 },
    { transform: `translate(${(startX+tx)/2}px, ${Math.min(startY,ty)-110}px) scale(1.25)`, opacity: 1, offset: .55 },
    { transform: `translate(${tx}px, ${ty}px) scale(1)`, opacity: 1 }
  ], { duration: 1250, easing: 'cubic-bezier(.45,.08,.32,1)' });
  anim.onfinish = () => { els.fly.style.display = 'none'; done(); };
}

/* ---------- the burn clock ---------- */
function tick(){
  let changed = false;
  const holder = activeCands();
  for (const c of candles.slice()){
    if (!alive(c)){
      changed = true;
      candles = candles.filter(x => x.id !== c.id);
      if (popFor === c.id) hidePop();
      if (holder && c.church === curId){
        const el = holder.querySelector('[data-id="' + c.id + '"]');
        if (el){
          el.classList.remove('lit');
          const s = document.createElement('div'); s.className = 'smoke';
          el.appendChild(s);
          setTimeout(() => el.remove(), 1800);
        }
      }
    } else if (holder && c.church === curId){
      const el = holder.querySelector('[data-id="' + c.id + '"]');
      if (el) el.style.setProperty('--wax', waxPct(c).toFixed(1));
      if (popFor === c.id){ const m = els.pop.querySelector('.meta'); if (m) m.innerHTML = metaLine(c); }
    }
  }
  if (changed){ saveState(); updateCount(); }
}

/* ---------- live sync from another device ---------- */
function applyRemote(state){
  if (pendingId) return;                 /* don't fight an in-flight flame */
  candles = (state.candles || []).filter(alive);
  custom  = state.churches || [];
  if (!churchById(curId)) { renderScene(orderIds()[0]); return; }
  renderDots(curId);
  const holder = activeCands();
  if (holder){
    holder.querySelectorAll('.candle').forEach(el => el.remove());
    candles.filter(c => c.church === curId && alive(c)).forEach(c => {
      const el = candleEl(c); el.classList.add('lit','show'); holder.appendChild(el);
    });
  }
  updateCount();
}

/* ---------- churches settings ---------- */
function renderChurchList(){
  const box = $('#churchList'); box.innerHTML = '';
  churches().forEach(c => {
    const row = document.createElement('div'); row.className = 'churchrow';
    row.innerHTML = (c.img
        ? '<img class="th" src="'+esc(c.img)+'" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'">'
        : '<div class="thi">✠</div>')
      + '<div class="cn"><b>'+esc(c.name)+'</b><span>'
      + (c.custom ? 'your church' : 'built in') + (c.hasMonstrance ? ' · monstrance' : '')
      + '</span></div>';
    if (c.custom){
      const rm = document.createElement('button');
      rm.className = 'rm'; rm.textContent = '×'; rm.title = 'Remove';
      rm.onclick = () => removeChurch(c.id);
      row.appendChild(rm);
    }
    box.appendChild(row);
  });
}
async function addChurch(){
  const img = $('#cImg').value.trim();
  if (!img){ $('#cImg').focus(); return; }
  const entry = {
    id: uid(),
    name: $('#cName').value.trim() || 'A church',
    desc: $('#cDesc').value.trim() || '',
    img, hasMonstrance: $('#cMon').checked, custom: true,
  };
  custom.push(entry);
  await saveState();
  $('#cImg').value = $('#cName').value = $('#cDesc').value = '';
  $('#cMon').checked = false;
  renderChurchList();
  renderScene(entry.id);
}
async function removeChurch(id){
  custom = custom.filter(c => c.id !== id);
  candles = candles.filter(c => c.church !== id);
  await saveState();
  renderChurchList();
  if (curId === id) renderScene(orderIds()[0]);
  else { renderDots(curId); updateCount(); }
}

/* ---------- auth UI ---------- */
function refreshAuthUI(){
  const btn = $('#authBtn'), who = $('#who');
  if (!backend.cloud){ btn.style.display = 'none'; who.textContent = ''; return; }
  const u = backend.user;
  btn.style.display = '';
  btn.textContent = u ? 'Sign out' : 'Sign in';
  who.textContent = u ? (u.displayName || u.email || '') : '';
}

/* ---------- modal ---------- */
function openVeil(){ hidePop(); els.veil.classList.add('on'); els.intent.value=''; setTimeout(()=>els.intent.focus(),60); }
const closeVeil = () => els.veil.classList.remove('on');
const openSettings = () => { renderChurchList(); $('#settings').classList.add('on'); };
const closeSettings = () => $('#settings').classList.remove('on');

/* ---------- wiring ---------- */
$('#lightBtn').addEventListener('click', openVeil);
$('#cancelBtn').addEventListener('click', closeVeil);
$('#igniteBtn').addEventListener('click', lightCandle);
els.veil.addEventListener('click', e => { if (e.target === els.veil) closeVeil(); });
els.intent.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter') lightCandle(); });

$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#gearBtn').addEventListener('click', openSettings);
$('#setClose').addEventListener('click', closeSettings);
$('#cAdd').addEventListener('click', addChurch);
$('#cImg').addEventListener('keydown', e => { if (e.key==='Enter') addChurch(); });
$('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
$('#authBtn').addEventListener('click', () => { backend.user ? backend.signOut() : backend.signIn(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeVeil(); hidePop(); closeSettings(); }
  if (els.veil.classList.contains('on') || $('#settings').classList.contains('on')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.body.addEventListener('click', e => {
  if (!els.pop.contains(e.target) && !e.target.closest('.candle')) hidePop();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ---------- init ---------- */
function boot(state){
  if (booted){ applyRemote(state); return; }
  booted = true;
  custom  = state.churches || [];
  candles = (state.candles || []).filter(alive);
  saveState();
  const latest = candles.slice().sort((a,b) => b.lit - a.lit)[0];
  const start  = latest && churchById(latest.church) ? latest.church
                 : orderIds()[Math.floor(Math.random()*BUILTINS.length)];
  renderScene(start, true);
  refreshAuthUI();
  setInterval(tick, 30000);
}

(async () => {
  els.note.innerHTML = '✠ &nbsp;Kept private<br>Each burns about ' + BURN_HOURS + ' hours, as a votive does';
  $('#addHint').innerHTML = 'Any public image link works. For free, beautiful interiors, search '
    + '<b>Wikimedia Commons</b> and use a link like<br>commons.wikimedia.org/wiki/Special:FilePath/YOUR_FILE.jpg';

  const useCloud = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey;
  try { backend = useCloud ? await makeCloudBackend(FIREBASE_CONFIG) : makeLocalBackend(); }
  catch(e){ console.warn('Cloud unavailable, staying local:', e.message); backend = makeLocalBackend(); }

  if (backend.cloud){
    backend.onChange(applyRemote);
    backend.onAuth(async u => {
      refreshAuthUI();
      const s = await backend.load();
      boot(s);
    });
  }

  boot(await backend.load());
})();
</script>
