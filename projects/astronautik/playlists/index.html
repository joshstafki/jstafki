<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlists · Astrønautik</title>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100;300;400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://www.jstafki.com/assets/astro/astro.png">
<meta name="title" content="Playlists · Astrønautik">
<meta name="description" content="The full playlist archive from Astrønautik — cinematic scores, orchestral works, ambient soundscapes, and electronic music curated by Josh Stafki, all on Apple Music.">
<link rel="canonical" href="https://www.jstafki.com/projects/astro/playlists/">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000;
    --purple: #a24bff;
    --purple-dim: rgba(162,75,255,0.35);
    --card-bg: #0c0a12;
    --card-border: rgba(162,75,255,0.18);
    --text-dim: #9a95a8;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: 'Kumbh Sans', sans-serif;
  }

  body {
    background-image:
      radial-gradient(circle at 50% -10%, rgba(120,30,220,0.16) 0%, rgba(0,0,0,0) 55%);
    background-attachment: fixed;
  }

  #grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    background: linear-gradient(#000 60%, transparent);
  }

  .nav-logo {
    font-size: 0.67rem;
    font-weight: 300;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }

  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a {
    font-size: 0.64rem;
    font-weight: 300;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
    padding: 8px 0;
  }
  .nav-links a:hover,
  .nav-links a.active { color: var(--purple); }

  main {
    position: relative;
    z-index: 2;
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 48px 120px;
  }

  .page-head {
    margin-bottom: 56px;
    text-align: center;
  }

  .page-head h1 {
    font-weight: 100;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .page-head p {
    margin-top: 14px;
    font-weight: 300;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  #state-msg {
    text-align: center;
    padding: 80px 20px;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #state-msg.error { color: #ff6b6b; }
  #state-msg[hidden] { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: var(--purple-dim);
    box-shadow: 0 18px 50px rgba(120,30,220,0.25), 0 0 0 1px rgba(162,75,255,0.12);
  }

  .card-art-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #141018;
    overflow: hidden;
  }

  .card-art-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }

  .card:hover .card-art-wrap img {
    transform: scale(1.06);
  }

  .card-art-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.55) 100%);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .card:hover .card-art-wrap::after { opacity: 1; }

  .play-badge {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
  }
  .card:hover .play-badge {
    opacity: 1;
    transform: translateY(0);
    border-color: var(--purple);
  }
  .play-badge svg { width: 13px; height: 13px; fill: #fff; }

  .card-body {
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .card-title {
    font-size: 0.92rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  .card-desc {
    font-size: 0.76rem;
    font-weight: 300;
    line-height: 1.55;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  footer {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 48px 40px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .footer-tag {
    font-size: 0.58rem;
    font-weight: 300;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .social-links { display: flex; gap: 28px; list-style: none; }
  .social-links a {
    font-size: 0.58rem;
    font-weight: 300;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
  }
  .social-links a:hover { color: var(--purple); }

  @media (max-width: 640px) {
    nav { padding: 18px 22px; }
    .nav-links { gap: 18px; }
    .nav-links a { font-size: 0.6rem; letter-spacing: 0.2em; }
    main { padding: 24px 22px 90px; }
    footer { padding: 18px 22px 30px; flex-direction: column; align-items: flex-start; gap: 12px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
    .page-head { margin-bottom: 36px; }
  }
</style>
</head>
<body>

<div id="grain"></div>

<nav>
  <a class="nav-logo" href="/">Astrønautik</a>
  <ul class="nav-links">
    <li><a href="https://music.apple.com/profile/astronautik">Apple Music</a></li>
    <li><a href="#" class="active">Playlists</a></li>
    <li><a href="https://www.jstafki.com/contact/">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="page-head">
    <h1>Playlists</h1>
    <p>Cinematic · Orchestral · Ambient · Electronic</p>
  </div>

  <p id="state-msg">Loading playlists…</p>
  <div class="grid" id="grid" hidden></div>
</main>

<footer>
  <span class="footer-tag">Curated by Josh Stafki</span>
  <ul class="social-links">
    <li><a href="https://music.apple.com/profile/astronautik">Apple Music</a></li>
    <li><a href="https://www.jstafki.com/contact/">Contact</a></li>
  </ul>
</footer>

<script>
(function () {
  // ─────────────────────────────────────────────────────────────
  // EDIT THIS: paste your published-to-web CSV link from Google Sheets.
  //
  // How to get it:
  //   1. Open the sheet -> File -> Share -> Publish to web
  //   2. Under "Link", choose the specific tab (not "Entire Document")
  //   3. Under the format dropdown, choose "Comma-separated values (.csv)"
  //   4. Click Publish, copy the URL it gives you, paste it below
  //
  // The sheet needs exactly these column headers in row 1 (any order):
  //   Title | Description | Album Art | Apple Music Link
  // ─────────────────────────────────────────────────────────────
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTaSYwhZt02NwE7YBwocQhqnn33dvn8N-_xUrMhyHQmciUWWYh0xKxR9vWI1XUwe8ZJ14c86rPUK9T/pub?gid=0&single=true&output=csv';

  const grid     = document.getElementById('grid');
  const stateMsg = document.getElementById('state-msg');

  function setState(msg, isError) {
    stateMsg.textContent = msg;
    stateMsg.classList.toggle('error', !!isError);
    stateMsg.hidden = false;
    grid.hidden = true;
  }

  // Small CSV parser — handles quoted fields, commas and newlines inside quotes.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\r') { /* skip */ }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function rowsToObjects(rows) {
    const headers = rows[0].map(h => h.trim().toLowerCase());
    return rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
  }

  function playIcon() {
    return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  }

  function renderCards(playlists) {
    if (!playlists.length) {
      setState('No playlists found yet — check back soon.');
      return;
    }

    grid.innerHTML = playlists.map(p => {
      const title = p['title'] || 'Untitled';
      const desc  = p['description'] || '';
      const art   = p['album art'] || '';
      const link  = p['apple music link'] || '#';

      return `
        <a class="card" href="${escapeAttr(link)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeAttr(title)} on Apple Music">
          <div class="card-art-wrap">
            ${art ? `<img src="${escapeAttr(art)}" alt="${escapeAttr(title)} artwork" loading="lazy">` : ''}
            <div class="play-badge">${playIcon()}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHTML(title)}</div>
            ${desc ? `<div class="card-desc">${escapeHTML(desc)}</div>` : ''}
          </div>
        </a>
      `;
    }).join('');

    stateMsg.hidden = true;
    grid.hidden = false;
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHTML(str).replace(/"/g, '&quot;');
  }

  async function loadPlaylists() {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('PASTE_YOUR') === 0) {
      setState('Playlist sheet isn\u2019t connected yet — add the CSV URL in the page script.', true);
      return;
    }
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Sheet came back empty');
      const playlists = rowsToObjects(rows);
      renderCards(playlists);
    } catch (err) {
      console.error(err);
      setState('Couldn\u2019t load playlists right now — try refreshing.', true);
    }
  }

  loadPlaylists();
})();
</script>
</body>
</html>
