<style>
:root{--fg:#f4f2ff;--mut:#9a97b4;--line:rgba(255,255,255,.16);--ca:hsl(285,90%,64%);--cb:hsl(190,90%,60%);--glow:hsl(238,90%,62%);--p:0;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100dvh;background:#000;color:var(--fg);font-family:'Oxanium','Trebuchet MS',system-ui,sans-serif;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.7))}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%}
#bg{z-index:0}#fx{z-index:30;pointer-events:none}
main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:28px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:22px}
.hero{display:grid;justify-items:center;gap:10px;text-align:center}
#logo{position:relative;display:block;width:clamp(150px,44vw,230px);aspect-ratio:1;animation:float 7s ease-in-out infinite;-webkit-tap-highlight-color:transparent;border-radius:50%}
#logo::before{content:'';position:absolute;inset:-28%;background:radial-gradient(circle,var(--glow),transparent 62%);opacity:calc(.25 + var(--p)*.5);filter:blur(12px)}
#logo img{position:relative;display:block;width:100%;height:100%;transform:scale(calc(1 + var(--p)*.06));filter:drop-shadow(0 0 18px var(--glow))}
#logo:focus-visible,input:focus-visible,button:focus-visible,.plat:focus-visible,footer a:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes float{50%{transform:translateY(-7px)}}
h1{margin:6px 0 0;font-family:'Michroma','Trebuchet MS',system-ui,sans-serif;font-weight:400;font-size:clamp(22px,8vw,46px);line-height:1.15;letter-spacing:.02em;background:linear-gradient(90deg,var(--ca),#fff 50%,var(--cb));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--fg);font-size:15px}
.hint{margin:0;color:var(--mut);font-size:13px}
.mixer{width:100%;display:grid;gap:16px;padding:18px 16px;border-radius:22px;background:rgba(8,6,16,.58);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.decks{display:flex;justify-content:space-around}
.deck{display:grid;justify-items:center;gap:10px;font-size:14px;font-weight:600}
.plat{--c:var(--ca);width:clamp(112px,34vw,150px);aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:repeating-radial-gradient(circle,#050509 0 2px,#17151f 2px 4px);box-shadow:0 0 0 3px #2a2735,0 0 30px -4px var(--c)}
#pB{--c:var(--cb)}
.plat::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,rgba(255,255,255,.16) 8%,transparent 22%,transparent 50%,rgba(255,255,255,.16) 58%,transparent 72%)}
.plat i{position:absolute;inset:33%;border-radius:50%;background:var(--c)}
.plat i::after{content:'';position:absolute;left:50%;top:8%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#000}
#la{color:var(--ca)}#lb{color:var(--cb)}
.f{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px;font-size:14px;font-weight:600}
.f b{text-align:right;font-weight:400;color:var(--mut);font-variant-numeric:tabular-nums}
.f.x{grid-template-columns:auto 1fr auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:22px;margin-top:-9px;border:0;border-radius:5px;background:linear-gradient(#fff,#b9b6c8);box-shadow:0 0 14px var(--glow)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:30px;height:22px;border:0;border-radius:5px;background:#e6e4f0;box-shadow:0 0 14px var(--glow)}
#play{font:inherit;font-weight:800;font-size:15px;color:#000;background:#fff;border:0;border-radius:999px;padding:14px;cursor:pointer;touch-action:manipulation}
footer{font-size:13px}footer a{color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.fade{transition:opacity .5s,transform .5s}
.warp .fade{opacity:0;transform:translateY(10px);pointer-events:none}
.warp #logo{animation:launch 1.7s cubic-bezier(.55,0,.9,.4) forwards}
@keyframes launch{0%{transform:scale(1) rotate(0)}30%{transform:scale(.8) rotate(-50deg)}100%{transform:scale(7) rotate(900deg);opacity:0}}
.shock{position:fixed;z-index:40;width:40px;height:40px;margin:-20px;border:3px solid #fff;border-radius:50%;opacity:0;pointer-events:none;box-shadow:0 0 30px var(--glow)}
@keyframes shock{0%{transform:scale(0);opacity:.9}100%{transform:scale(60);opacity:0}}
#flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;transition:opacity .9s}
.warp #flash{transition:none}
@media (prefers-reduced-motion:reduce){#logo{animation:none}.shock{display:none}}
</style>

const B=Array.from({length:N},(_,i)=>({g:i%2,a:Math.random()*6.28,r:.1+Math.random()*.38,s:(.15+Math.random()*.45)*(Math.random()<.5?-1:1),z:.2+Math.random()*.3,h:Math.random()*70-35,e:.6+Math.random()*.8,l:0}));
const P=[$('pA'),$('pB')].map((el,g)=>({el,g,a:0,v:.8,d:false}));
const theme=()=>{const a=S.hue+285,b=S.hue+190,s=R.style;s.setProperty('--ca','hsl('+a+',90%,64%)');s.setProperty('--cb','hsl('+b+',90%,60%)');s.setProperty('--glow','hsl('+(a+(b-a)*S.xf)+',90%,62%)')};

/* scratchable platters */
P.forEach(p=>{const el=p.el,ang=e=>{const r=el.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)};
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);p.d=true;p.pa=ang(e);p.pt=performance.now()});
el.addEventListener('pointermove',e=>{if(!p.d)return;const a=ang(e),n=performance.now();let d=a-p.pa;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
p.a+=d;p.v=Math.max(-30,Math.min(30,d/Math.max(.008,(n-p.pt)/1000)));p.pa=a;p.pt=n;rot[p.g]+=d*.5});
['pointerup','pointercancel'].forEach(t=>el.addEventListener(t,()=>{p.d=false}))});

/* gradient field */
let last=performance.now();
function frame(t){
const dt=Math.min(.05,(t-last)/1000);last=t;S.pulse*=Math.pow(.015,dt);
P.forEach(p=>{const base=.8*S.bpm/120;
if(p.d)p.v*=Math.pow(.0003,dt);else{p.v+=(base-p.v)*Math.min(1,dt*1.2);p.a+=p.v*dt;rot[p.g]+=p.v*dt*.3}
S.pulse=Math.max(S.pulse,Math.min(.7,Math.abs(p.v-base)/25));p.el.style.transform='rotate('+p.a+'rad)'});
const w=bg.width,h=bg.height,m=Math.min(w,h),al=[Math.cos(S.xf*1.5708),Math.sin(S.xf*1.5708)],tg=S.boost>.02?N:S.den,k=1.1-tg/60;
cx.globalCompositeOperation='source-over';cx.fillStyle='#000';cx.fillRect(0,0,w,h);cx.globalCompositeOperation='lighter';
B.forEach((b,i)=>{b.l+=((i<tg?1:0)-b.l)*Math.min(1,dt*3);if(b.l<.01)return;
b.a+=b.s*dt*(S.bpm/120)*(1+S.boost*6);
const an=b.a+rot[b.g],x=w/2+(b.g?.1:-.1)*w+Math.cos(an)*b.r*w*1.5,y=h/2+Math.sin(an*b.e)*b.r*h*1.6,
rad=b.z*m*(1.15+S.pulse*.4)*b.l,hu=S.hue+(b.g?190:285)+b.h+S.boost*200*Math.sin(t/300+i),
a=.34*k*al[b.g]*b.l,c=cx.createRadialGradient(x,y,0,x,y,rad);
c.addColorStop(0,'hsla('+hu+',90%,58%,'+a+')');c.addColorStop(1,'hsla('+hu+',90%,50%,0)');
cx.fillStyle=c;cx.fillRect(x-rad,y-rad,rad*2,rad*2)});
$('logo').style.setProperty('--p',S.pulse.toFixed(3));
requestAnimationFrame(frame)}

/* small synth: deck A = kick and bass, deck B = hats and arp */
let ac,bA,bB,nb,playing=false,step=0;
const mix=()=>{if(ac){bA.gain.value=Math.cos(S.xf*1.5708);bB.gain.value=Math.sin(S.xf*1.5708)}};
function initAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();const m=ac.createGain();m.gain.value=.7;m.connect(ac.destination);
bA=ac.createGain();bB=ac.createGain();bA.connect(m);bB.connect(m);
nb=ac.createBuffer(1,ac.sampleRate>>1,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;mix()}
function osc(ty,f,t,d,v,bus,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.5);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.02)}
function hat(t,v){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=7000;
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(bB);s.start(t);s.stop(t+.06)}
const bass=[110,110,130.8,98],arp=[220,261.6,329.6,392,440,392,329.6,261.6];
function sound(s){const t=ac.currentTime+.01;
if(s%4==0)osc('sine',160,t,.35,1,bA,40);
if(s%4==2)osc('triangle',bass[s>>2&3],t,.24,.5,bA);
if(s%2==1)hat(t,s%4==3?.22:.1);
if(Math.random()<S.den/36+.15)osc('triangle',arp[s*3%8]*(s%16>11?2:1),t,.18,.16,bB)}
(function tick(){if(step%4==0)S.pulse=1;else if(step%2==0)S.pulse=Math.max(S.pulse,.35);
if(playing)sound(step);step=(step+1)&15;setTimeout(tick,15000/S.bpm)})();
$('play').onclick=()=>{if(!ac)initAudio();if(ac.state=='suspended')ac.resume();playing=!playing;$('play').textContent=playing?'Stop the set':'Play the set'};

/* controls */
const sl=(id,fn)=>{const e=$(id),f=()=>fn(+e.value);e.addEventListener('input',f);f()};
sl('den',v=>{S.den=v;$('denv').textContent=v});
sl('hue',v=>{S.hue=v;$('huev').textContent=v+'°';theme()});
sl('bpm',v=>{S.bpm=v;$('bpmv').textContent=v});
sl('xf',v=>{S.xf=v/100;mix();theme()});

/* logo warp, then Apple Music */
let warping=false;
const stars=Array.from({length:260},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
function warp(){
const D=matchMedia('(prefers-reduced-motion: reduce)').matches?350:1700;
warping=true;document.body.classList.add('warp');
const r=$('logo').getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
document.querySelectorAll('.shock').forEach((s,i)=>{s.style.left=ox+'px';s.style.top=oy+'px';s.style.animation='shock 1.2s '+i*.25+'s ease-out forwards'});
const t0=performance.now();
(function loop(now){
const q=Math.min(1,(now-t0)/D),sp=.004+q*q*.09;S.boost=q;fc.clearRect(0,0,W,H);fc.lineCap='round';
stars.forEach(s=>{const pz=s.z;s.z-=sp;if(s.z<=.01){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;return}
const k=W*.1;fc.strokeStyle='hsla('+(S.hue+190+s.x*60)+',90%,82%,'+(1-s.z)+')';fc.lineWidth=(1-s.z)*2.6;
fc.beginPath();fc.moveTo(ox+s.x/pz*k,oy+s.y/pz*k);fc.lineTo(ox+s.x/s.z*k,oy+s.y/s.z*k);fc.stroke()});
$('flash').style.opacity=q>.75?(q-.75)/.25:0;
if(q<1)return requestAnimationFrame(loop);
if(!window.open(U,'_blank','noopener'))location.href=U;
setTimeout(()=>{warping=false;document.body.classList.remove('warp');S.boost=0;fc.clearRect(0,0,W,H);$('flash').style.opacity=0;
document.querySelectorAll('.shock').forEach(s=>{s.style.animation=''})},1400)})(t0)}
$('logo').addEventListener('click',e=>{e.preventDefault();if(!warping)warp()});

theme();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
