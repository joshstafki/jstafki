<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Split</title>
<link rel="icon" type="image/png" href="https://www.jstafki.com/assets/pec.png">
<link rel="apple-touch-icon" href="https://www.jstafki.com/assets/pec.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#EFEDE7; --surface:#E6E2D8; --text:#211E1A; --text-muted:#5C554A; --border:#D9D3C6;
  --accent:#B8402A; --accent-small:#93321F; --accent-contrast:#FFFFFF; --accent-soft:rgba(184,64,42,.12);
  --rest:#4C6771; --rest-small:#374D55; --rest-contrast:#FFFFFF; --rest-soft:rgba(76,103,113,.12);
  --font-display:'Bebas Neue','Oswald',Impact,sans-serif;
  --font-body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181511; --surface:#221D17; --text:#F3EEE6; --text-muted:#A79E92; --border:#3A3126;
    --accent:#E37A4C; --accent-small:#E37A4C; --accent-contrast:#1B0F08; --accent-soft:rgba(227,122,76,.16);
    --rest:#86A9B6; --rest-small:#86A9B6; --rest-contrast:#12191C; --rest-soft:rgba(134,169,182,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#181511; --surface:#221D17; --text:#F3EEE6; --text-muted:#A79E92; --border:#3A3126;
  --accent:#E37A4C; --accent-small:#E37A4C; --accent-contrast:#1B0F08; --accent-soft:rgba(227,122,76,.16);
  --rest:#86A9B6; --rest-small:#86A9B6; --rest-contrast:#12191C; --rest-soft:rgba(134,169,182,.16);
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-tap-highlight-color:transparent; }
button{ font-family:inherit; touch-action:manipulation; }
button:active{ transform:scale(.97); }
.grip-strip{ height:9px; background-image:repeating-linear-gradient(135deg,var(--border) 0 2px,transparent 2px 7px); opacity:.55; }
.page{
  max-width:480px; margin-inline:auto; display:flex; flex-direction:column; gap:22px;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
}
.masthead{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.masthead-text{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.eyebrow{ margin:0; font-weight:700; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-small); }
.today-readout{ margin:0; font-family:var(--font-mono); font-weight:500; font-size:14px; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.actions{ display:flex; gap:8px; margin-left:auto; }
.auth{ appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text); font:600 12px var(--font-body); border-radius:999px; padding:11px 15px; min-height:44px; cursor:pointer; white-space:nowrap; }
.auth[hidden]{ display:none; }
.msg{ margin:-8px 0 0; font-size:14px; line-height:1.4; color:var(--accent-small); }
.msg:empty{ display:none; }

.day-tabs{ position:sticky; top:max(8px,env(safe-area-inset-top,0px)); z-index:5; display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; box-shadow:inset 0 1px 2px rgba(0,0,0,.12),0 6px 16px -10px rgba(0,0,0,.45); }
.tab{ flex:1 1 0; position:relative; appearance:none; border:0; border-radius:8px; background:transparent; color:var(--text-muted); font-weight:600; font-size:clamp(10.5px,2.8vw,12.5px); letter-spacing:.02em; text-transform:uppercase; padding:12px 0 11px; min-height:44px; cursor:pointer; text-align:center; }
@media (prefers-reduced-motion:no-preference){
  .tab,button{ transition:background-color .15s ease,color .15s ease,transform .1s ease; }
  .panel:not([hidden]){ animation:in .22s ease-out; }
  .sheet{ animation:up .25s ease-out; }
  @keyframes in{ from{ opacity:0; transform:translateY(6px); } }
  @keyframes up{ from{ opacity:.4; transform:translateY(24px); } }
}
@media (hover:hover){ .tab:not(.is-selected):hover{ background:var(--accent-soft); color:var(--text); } .auth:hover{ border-color:var(--text-muted); } }
.tab.is-selected{ background:var(--accent); color:var(--accent-contrast); }
.tab.is-selected[data-kind="rest"]{ background:var(--rest); color:var(--rest-contrast); }
.tab.is-today:not(.is-selected)::after{ content:""; position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); }
.tab.is-today[data-kind="rest"]:not(.is-selected)::after{ background:var(--rest); }
:is(.tab,.auth,.add,.del,.gate-btn,.f,.chip,.opt:has(:focus-visible)){ outline-offset:2px; }
:is(.tab,.auth,.add,.del,.gate-btn,.f,.chip):focus-visible,.opt:has(:focus-visible){ outline:2px solid var(--accent); }

.panel[hidden]{ display:none; }
.session-tag{ margin:0 0 10px; font-family:var(--font-mono); font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-small); }
.panel[data-kind="rest"] .session-tag{ color:var(--rest-small); }
.headline{ margin:0; font-family:var(--font-display); font-weight:400; font-size:clamp(2.5rem,11vw,3.6rem); line-height:.94; letter-spacing:.01em; text-transform:uppercase; color:var(--accent); text-wrap:balance; overflow-wrap:anywhere; }
.panel[data-kind="rest"] .headline{ color:var(--rest); }
.bar{ width:56px; height:4px; border-radius:2px; background:var(--accent); margin:16px 0 22px; }
.panel[data-kind="rest"] .bar{ background:var(--rest); }

.log{ margin:0 0 14px; }
.log-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.log-title{ margin:0; font:700 17px var(--font-body); }
.add{ width:44px; height:44px; border:0; border-radius:50%; background:var(--accent); color:var(--accent-contrast); font:500 28px/1 var(--font-body); cursor:pointer; display:grid; place-items:center; padding:0 0 3px; }
.add[hidden]{ display:none; }
.rows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.row{ display:grid; grid-template-columns:1fr 84px 44px; gap:8px; align-items:center; }
.f{ width:100%; min-width:0; min-height:44px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font:500 16px var(--font-body); padding:0 12px; }
.f::placeholder{ color:var(--text-muted); opacity:.8; }
.f-wt{ font-family:var(--font-mono); text-align:right; }
.del{ width:44px; height:44px; border:0; border-radius:8px; background:transparent; color:var(--text-muted); font:400 26px/1 var(--font-body); cursor:pointer; }
.hint{ margin:0 0 10px; font-size:14px; line-height:1.5; color:var(--text-muted); }
.gate-btn{ appearance:none; border:0; border-radius:8px; background:var(--accent); color:var(--accent-contrast); font:600 14px var(--font-body); padding:12px 16px; min-height:44px; cursor:pointer; }
.gate-btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }

.console{ display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px; }
.console-label{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.console-eyebrow{ font-weight:600; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
.console-name{ font-weight:700; font-size:17px; overflow-wrap:anywhere; }
.console-time{ font-family:var(--font-mono); font-weight:600; font-size:clamp(1.8rem,8vw,2.4rem); color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap; }
.rest-copy{ margin:0; font-size:16.5px; line-height:1.55; max-width:34ch; }

/* onboarding sheet */
.wrap{ position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center; background:rgba(10,8,6,.6); }
.wrap[hidden]{ display:none; }
.sheet{ width:100%; max-width:520px; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border:1px solid var(--border); border-bottom:0; border-radius:18px 18px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); }
.dots{ display:flex; gap:6px; margin-bottom:16px; }
.dots i{ flex:1; height:4px; border-radius:2px; background:var(--border); }
.dots i.on{ background:var(--accent); }
.ob-h{ margin:0 0 6px; font:400 clamp(2rem,9vw,2.6rem)/1 var(--font-display); text-transform:uppercase; color:var(--accent); }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0 18px; }
.opt{ position:relative; display:flex; flex-direction:column; gap:3px; background:var(--surface); border:2px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; min-height:72px; }
.opt input{ position:absolute; opacity:0; inset:0; }
.opt b{ font-size:15px; } .opt span{ font-size:12.5px; line-height:1.35; color:var(--text-muted); }
.opt:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); }
.drow{ display:grid; grid-template-columns:38px 1fr auto; gap:8px; align-items:center; margin-bottom:8px; }
.dn{ font:600 12px var(--font-mono); text-transform:uppercase; color:var(--text-muted); }
.chip{ min-height:44px; padding:0 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font:600 13px var(--font-body); cursor:pointer; }
.chip.on{ background:var(--rest); border-color:var(--rest); color:var(--rest-contrast); }
.sub{ margin:18px 0 8px; font:700 15px var(--font-body); }
.tog{ display:flex; align-items:center; gap:10px; min-height:44px; font-weight:600; }
.tog input{ width:22px; height:22px; accent-color:var(--accent); }
.crow{ display:grid; grid-template-columns:1fr 76px auto; gap:8px; align-items:center; }
.crow span{ font-size:14px; color:var(--text-muted); }
.crow{ margin-top:4px; }
.crow[hidden]{ display:none; }
.sub small{ font:500 12px var(--font-body); color:var(--text-muted); margin-left:6px; }
.ob-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.ob-actions .gate-btn:last-child{ flex:1; max-width:220px; }
.err{ margin:10px 0 0; font-size:14px; color:var(--accent-small); }
.err:empty{ display:none; }

@media (max-width:360px){ .row{ grid-template-columns:1fr 72px 40px; gap:6px; } .opts{ grid-template-columns:1fr; } }
@media (min-width:640px){
  .page{ max-width:640px; gap:26px; padding-top:calc(36px + env(safe-area-inset-top,0px)); }
  .headline{ font-size:4.4rem; }
  .row{ grid-template-columns:1fr 110px 44px; }
  .wrap{ align-items:center; padding:24px; }
  .sheet{ border-radius:18px; border-bottom:1px solid var(--border); padding:28px; }
  .opts{ grid-template-columns:repeat(3,1fr); }
}
</style>
</head>
<body>

<div class="grip-strip" aria-hidden="true"></div>
<div class="page">
  <header class="masthead">
    <div class="masthead-text">
      <p class="eyebrow">Today's Split</p>
      <p class="today-readout" id="today-readout"></p>
    </div>
    <div class="actions">
      <button type="button" class="auth" id="edit" hidden>Edit split</button>
      <button type="button" class="auth" id="auth">Sign in</button>
    </div>
  </header>
  <p class="msg" id="msg" role="status"></p>

  <nav class="day-tabs" id="tabs" role="tablist" aria-label="Choose a day"></nav>
  <main class="panels" id="panels"></main>
</div>

<div class="wrap" id="ob" hidden>
  <div class="sheet" id="ob-sheet" role="dialog" aria-modal="true" aria-labelledby="ob-title"></div>
</div>

<script type="module">
/* ---- Firebase: paste your project's web config here ---- */
const firebaseConfig = {
    apiKey: "AIzaSyCVswV_iSPSzBOxFZARBPV2MiAX4oq6_N8",
    authDomain: "training-jstafki.firebaseapp.com",
    projectId: "training-jstafki",
    storageBucket: "training-jstafki.firebasestorage.app",
    messagingSenderId: "10738151686",
    appId: "1:10738151686:web:8a4f38a352e2d090f46e87"
  };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const setMsg = t => { $('#msg').textContent = t; };
const two = n => String(n).padStart(2, '0');

/* ---- Split model: weekday index (0 = Sun) -> focus name; empty = rest ---- */
const W = [1, 2, 3, 4, 5, 6, 0];
const ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
/* template arrays run Mon..Sun */
const TPL = {
  classic: ['6-day classic', 'Back, chest, arms and legs', ['Back & Arms', 'Chest', 'Arms & Legs', 'Chest', 'Legs & Back', 'Chest', '']],
  ppl: ['Push / Pull / Legs', '6 days, repeated twice', ['Push', 'Pull', 'Legs', 'Push', 'Pull', 'Legs', '']],
  ul: ['Upper / Lower', '4 days with rest between', ['Upper', 'Lower', '', 'Upper', 'Lower', '', '']],
  fb: ['Full body', '3 days, every other day', ['Full Body', '', 'Full Body', '', 'Full Body', '', '']],
  bro: ['Body-part split', '5 days, one muscle group each', ['Chest', 'Back', 'Shoulders', 'Arms', 'Legs', '', '']],
  custom: ['Custom', 'Start blank and build your week', ['', '', '', '', '', '', '']]
};
const mk = (a, cardio) => ({ days: Object.fromEntries(W.map((d, i) => [d, a[i]])), cardio: cardio || { on: false, name: '', min: '' } });
const clone = o => JSON.parse(JSON.stringify(o));
let plan = mk(TPL.classic[2]), onboarded = false;

const now = new Date(), todayIndex = now.getDay();
$('#today-readout').textContent = FULL[todayIndex].toUpperCase() + ' / ' +
  two(now.getMonth() + 1) + '.' + two(now.getDate()) + '.' + now.getFullYear();

/* ---- Week render (tabs + panels from the plan) ---- */
function selectDay(n) {
  $$('.tab').forEach(t => {
    const on = Number(t.dataset.day) === n;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.classList.toggle('is-selected', on);
  });
  $$('.panel').forEach(p => { p.hidden = Number(p.dataset.day) !== n; });
}

function renderWeek() {
  const cur = $('.tab.is-selected');
  const sel = cur ? Number(cur.dataset.day) : todayIndex;
  const train = W.filter(d => plan.days[d]);
  let n = 0;
  const c = plan.cardio || {};
  const cardio = c.on ? `<div class="console"><div class="console-label"><span class="console-eyebrow">Cardio Finisher</span><span class="console-name">${esc(c.name)}</span></div>${c.min ? `<span class="console-time">${two(c.min)}:00</span>` : ''}</div>` : '';
  $('#tabs').innerHTML = W.map(d => {
    const rest = !plan.days[d];
    return `<button type="button" class="tab${d === todayIndex ? ' is-today' : ''}" id="tab-${d}" data-day="${d}" data-kind="${rest ? 'rest' : 'train'}" role="tab" aria-selected="false" aria-controls="panel-${d}">${ABBR[d]}</button>`;
  }).join('');
  $('#panels').innerHTML = W.map(d => {
    const name = plan.days[d];
    return name
      ? `<section class="panel" id="panel-${d}" data-day="${d}" data-kind="train" role="tabpanel" aria-labelledby="tab-${d}" hidden><p class="session-tag">Session ${two(++n)} / ${two(train.length)}</p><h1 class="headline">${esc(name)}</h1><div class="bar" aria-hidden="true"></div><section class="log" data-day="${d}"><div class="log-head"><h2 class="log-title">Lifts</h2><button type="button" class="add" data-act="add" aria-label="Add exercise" hidden>+</button></div><ul class="rows"></ul></section>${cardio}</section>`
      : `<section class="panel" id="panel-${d}" data-day="${d}" data-kind="rest" role="tabpanel" aria-labelledby="tab-${d}" hidden><p class="session-tag">Recovery</p><h1 class="headline">Rest Day</h1><div class="bar" aria-hidden="true"></div><p class="rest-copy">No training today &mdash; recovery is part of the program. Stretch, hydrate, and get ahead on sleep.</p></section>`;
  }).join('');
  selectDay(sel);
  renderRows();
}
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) selectDay(Number(t.dataset.day));
});

/* ---- Lift log: { "1": [{id, n, w}], ... } ---- */
let user = null, ready = false, loaded = false, log = {}, timer = null, fb = null, auth = null, db = null, unsub = null;

function renderRows() {
  $$('.log').forEach(box => {
    const ul = $('.rows', box), items = log[box.dataset.day] || [];
    $('.add', box).hidden = !(user && loaded);
    if (!user || !loaded) {
      ul.innerHTML = ready && !user
        ? `<li><p class="hint">Sign in with Google to log and save your lifts.</p><button type="button" class="gate-btn" data-act="signin">Sign in with Google</button></li>`
        : `<li><p class="hint">Loading your log&hellip;</p></li>`;
      return;
    }
    ul.innerHTML = items.length
      ? items.map(x => `<li class="row" data-id="${x.id}"><input class="f f-name" data-k="n" value="${esc(x.n)}" placeholder="Exercise" aria-label="Exercise name" autocomplete="off"><input class="f f-wt" data-k="w" value="${esc(x.w)}" placeholder="lb" inputmode="decimal" aria-label="Weight in pounds" autocomplete="off"><button type="button" class="del" data-act="del" aria-label="Delete exercise">&times;</button></li>`).join('')
      : `<li><p class="hint">Nothing logged yet. Tap + to add a lift.</p></li>`;
  });
}

function save() {
  if (!user || !db || !loaded) return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    timer = null;
    try {
      await fb.setDoc(fb.doc(db, 'users', user.uid, 'split', 'log'), { days: log, plan: onboarded ? plan : null });
      setMsg('');
    } catch (e) {
      setMsg('Could not save your log. Check your connection and Firestore rules.');
    }
  }, 500);
}

async function signIn() {
  if (!fb) return setMsg('Firebase has not loaded yet.');
  try {
    await fb.signInWithPopup(auth, new fb.GoogleAuthProvider());
    setMsg('');
  } catch (e) {
    if (e.code !== 'auth/popup-closed-by-user') setMsg('Sign-in failed: ' + (e.code || e.message));
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'signin') return signIn();
  const box = b.closest('.log');
  if (!box) return;
  const d = box.dataset.day;
  log[d] = log[d] || [];
  if (b.dataset.act === 'add') {
    log[d].push({ id: uid(), n: '', w: '' });
    renderRows(); save();
    const last = $$('.f-name', box).pop();
    if (last) last.focus();
  } else if (b.dataset.act === 'del') {
    const id = b.closest('.row').dataset.id;
    log[d] = log[d].filter(x => x.id !== id);
    renderRows(); save();
  }
});

document.addEventListener('input', e => {
  const f = e.target.closest('.log .f');
  if (!f) return;
  const x = (log[f.closest('.log').dataset.day] || []).find(r => r.id === f.closest('.row').dataset.id);
  if (x) { x[f.dataset.k] = f.value; save(); }
});

/* ---- Onboarding / edit split ---- */
let ob = { step: 0, tpl: 'classic', draft: null, edit: false };
const sheet = $('#ob-sheet');

function openOb(edit) {
  ob = { step: edit ? 1 : 0, tpl: edit ? null : 'classic', draft: clone(plan), edit };
  $('#ob').hidden = false;
  document.body.style.overflow = 'hidden';
  renderOb();
}
function closeOb() { $('#ob').hidden = true; document.body.style.overflow = ''; }

function renderOb() {
  const dots = `<div class="dots" aria-hidden="true"><i class="on"></i><i class="${ob.step ? 'on' : ''}"></i></div>`;
  if (ob.step === 0) {
    sheet.innerHTML = dots + `<h2 class="ob-h" id="ob-title">What are you training?</h2><p class="hint">Pick the split you follow. You can change any day on the next step.</p>
      <div class="opts" role="radiogroup" aria-label="Training split">${Object.entries(TPL).map(([k, [n, d]]) => `<label class="opt"><input type="radio" name="tpl" value="${k}"${ob.tpl === k ? ' checked' : ''}><b>${n}</b><span>${d}</span></label>`).join('')}</div>
      <div class="ob-actions"><button type="button" class="gate-btn" data-ob="next">Continue</button></div>`;
  } else {
    const dr = ob.draft, c = dr.cardio;
    sheet.innerHTML = dots + `<h2 class="ob-h" id="ob-title">Set your week</h2><p class="hint">Name what you train each day. Leave a day empty or tap Rest to take it off.</p>
      ${W.map(d => `<div class="drow"><span class="dn">${ABBR[d]}</span><input class="f" data-d="${d}" value="${esc(dr.days[d])}" placeholder="Rest day" maxlength="30" aria-label="${FULL[d]} focus" autocomplete="off"><button type="button" class="chip${dr.days[d] ? '' : ' on'}" data-ob="rest" data-d="${d}">Rest</button></div>`).join('')}
      <h3 class="sub">Cardio finisher <small>Optional</small></h3>
      <label class="tog"><input type="checkbox" id="c-on"${c.on ? ' checked' : ''}> Finish training days with cardio</label>
      <div class="crow" id="c-fields"${c.on ? '' : ' hidden'}><input class="f" id="c-name" value="${esc(c.name)}" maxlength="30" aria-label="Cardio activity" placeholder="Your activity, e.g. Treadmill" autocomplete="off"><input class="f f-wt" id="c-min" type="number" min="1" max="180" inputmode="numeric" value="${esc(c.min)}" aria-label="Cardio minutes (optional)" placeholder="min"><span>min</span></div>
      <p class="err" id="ob-err" role="alert"></p>
      <div class="ob-actions">${ob.edit ? '<button type="button" class="gate-btn ghost" data-ob="close">Cancel</button>' : ''}<button type="button" class="gate-btn ghost" data-ob="back">Back</button><button type="button" class="gate-btn" data-ob="done">${ob.edit ? 'Save split' : 'Start training'}</button></div>`;
  }
  const first = $('input:checked, .f', sheet); if (first) first.focus({ preventScroll: true });
}

sheet.addEventListener('change', e => {
  if (e.target.id === 'c-on') {
    ob.draft.cardio.on = e.target.checked;
    $('#c-fields').hidden = !e.target.checked;
    if (e.target.checked) $('#c-name').focus();
  }
  if (e.target.name === 'tpl') {
    ob.tpl = e.target.value;
    ob.draft = mk(TPL[ob.tpl][2], ob.draft.cardio);
  }
});
sheet.addEventListener('input', e => {
  const f = e.target;
  if (f.id === 'c-name') ob.draft.cardio.name = f.value;
  if (f.id === 'c-min') ob.draft.cardio.min = f.value;
  if (f.dataset.d != null) {
    ob.draft.days[f.dataset.d] = f.value.trim();
    $(`.chip[data-d="${f.dataset.d}"]`, sheet).classList.toggle('on', !f.value.trim());
  }
});
sheet.addEventListener('click', e => {
  const b = e.target.closest('[data-ob]');
  if (!b) return;
  const a = b.dataset.ob;
  if (a === 'next') { ob.step = 1; renderOb(); }
  else if (a === 'back') { ob.step = 0; ob.tpl = ob.tpl || 'classic'; renderOb(); }
  else if (a === 'close') closeOb();
  else if (a === 'rest') {
    ob.draft.days[b.dataset.d] = '';
    const inp = $(`.f[data-d="${b.dataset.d}"]`, sheet); inp.value = '';
    b.classList.add('on');
  } else if (a === 'done') {
    const dr = ob.draft;
    if (!W.some(d => dr.days[d])) return ($('#ob-err').textContent = 'Add at least one training day to continue.');
    const on = $('#c-on').checked, nm = $('#c-name').value.trim(), mn = parseInt($('#c-min').value, 10);
    if (on && !nm) return ($('#ob-err').textContent = 'Name your cardio activity, or turn the finisher off.');
    dr.cardio = { on, name: nm, min: mn > 0 ? Math.min(180, mn) : '' };
    plan = dr; onboarded = true;
    save(); closeOb(); renderWeek(); selectDay(todayIndex);
  }
});
$('#ob').addEventListener('click', e => { if (e.target.id === 'ob' && ob.edit) closeOb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ob').hidden && ob.edit) closeOb(); });

$('#edit').addEventListener('click', () => openOb(true));
$('#auth').addEventListener('click', () => (user ? fb.signOut(auth) : signIn()));
renderWeek();

/* ---- Firebase load (UI above keeps working if this fails) ---- */
const G = 'https://www.gstatic.com/firebasejs/10.12.2/';
try {
  const [app, au, fs] = await Promise.all([
    import(G + 'firebase-app.js'), import(G + 'firebase-auth.js'), import(G + 'firebase-firestore.js')
  ]);
  fb = Object.assign({}, app, au, fs);
  const fapp = fb.initializeApp(firebaseConfig);
  auth = fb.getAuth(fapp);
  db = fb.getFirestore(fapp);

  fb.onAuthStateChanged(auth, u => {
    user = u; ready = true; loaded = false; onboarded = false; log = {};
    plan = mk(TPL.classic[2]);
    if (unsub) { unsub(); unsub = null; }
    closeOb();
    $('#auth').textContent = u ? 'Sign out' : 'Sign in';
    $('#edit').hidden = true;
    renderWeek();
    if (!u) return;
    unsub = fb.onSnapshot(fb.doc(db, 'users', u.uid, 'split', 'log'), snap => {
      if (snap.metadata.hasPendingWrites || timer) return;
      if (!snap.exists() && snap.metadata.fromCache) return;
      const data = snap.exists() ? snap.data() : {};
      const first = !loaded;
      if (!first && document.activeElement && document.activeElement.closest('.row')) return;
      log = data.days || {};
      loaded = true;
      if (data.plan && data.plan.days) { plan = data.plan; onboarded = true; }
      $('#edit').hidden = !onboarded;
      renderWeek();
      if (first && !onboarded) openOb(false);
    }, () => setMsg('Could not load your log. Check your Firestore rules.'));
  });
} catch (e) {
  ready = true;
  renderRows();
  setMsg('Could not load Firebase. Check your connection and config.');
}
</script>
</body>
</html>
