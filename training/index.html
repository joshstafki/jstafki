<style>
:root{
  color-scheme: light dark;
  --bg:#EFEDE7; --text:#211E1A; --muted:#5C554A; --border:#D9D3C6;
  --accent:#B8402A; --on-accent:#FFFFFF;
  --ink-filter:none; --ink-blend:multiply;
  --display:'Bebas Neue','Oswald',Impact,sans-serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181511; --text:#F3EEE6; --muted:#A79E92; --border:#3A3126;
    --accent:#E37A4C; --on-accent:#1B0F08; --ink-filter:invert(1); --ink-blend:screen;
  }
}
:root[data-theme="dark"]{
  --bg:#181511; --text:#F3EEE6; --muted:#A79E92; --border:#3A3126;
  --accent:#E37A4C; --on-accent:#1B0F08; --ink-filter:invert(1); --ink-blend:screen;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--body); line-height:1.5; overflow:hidden; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

.screen{
  height:100vh; height:100dvh; max-width:1100px; margin-inline:auto;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"top" "art" "copy";
  padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  gap:6px;
}
.top{ grid-area:top; display:flex; align-items:center; justify-content:space-between; }
.logo{ font:400 1.6rem/1 var(--display); letter-spacing:.03em; text-transform:uppercase; text-decoration:none; color:var(--text); }
.nav{ font-weight:600; font-size:14px; color:var(--muted); text-decoration:none; padding:12px 0 12px 12px; }

.art{ grid-area:art; position:relative; min-height:0; }
.art img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; mix-blend-mode:var(--ink-blend); filter:var(--ink-filter); }
@media (prefers-reduced-motion:no-preference){
  .art img{ animation:settle 1.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes settle{ from{ opacity:0; filter:var(--ink-filter) blur(10px); transform:scale(1.03); } }
}

.copy{ grid-area:copy; }
h1{ margin:0; font:400 clamp(3.2rem,min(15vw,9.5vh),7.5rem)/.9 var(--display); text-transform:uppercase; letter-spacing:.005em; }
.mission{ margin:14px 0 18px; max-width:36ch; font-size:clamp(1rem,3.4vw,1.15rem); color:var(--muted); }
.btn{ display:inline-flex; align-items:center; min-height:48px; padding:0 24px; border-radius:10px; background:var(--accent); color:var(--on-accent); font-weight:700; text-decoration:none; }
.btn:active{ transform:scale(.97); }

@media (min-width:860px){
  .screen{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"top top" "copy art"; column-gap:56px; padding-block:calc(22px + env(safe-area-inset-top,0px)) 40px;
  }
  .copy{ align-self:center; }
  .mission{ margin-block:20px 28px; }
}
@media (max-height:560px) and (max-width:859px){ .mission{ display:none; } }
</style>
</head>
