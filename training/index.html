<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Split</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#EFEDE7; --surface:#E6E2D8; --text:#211E1A; --text-muted:#5C554A; --border:#D9D3C6;
    --accent:#B8402A; --accent-small:#93321F; --accent-contrast:#FFFFFF; --accent-soft:rgba(184,64,42,.12);
    --rest:#4C6771; --rest-small:#374D55; --rest-contrast:#FFFFFF; --rest-soft:rgba(76,103,113,.12);
    --font-display:'Bebas Neue','Oswald',Impact,sans-serif;
    --font-body:'Archivo','Helvetica Neue',Arial,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181511; --surface:#221D17; --text:#F3EEE6; --text-muted:#A79E92; --border:#3A3126;
      --accent:#E37A4C; --accent-small:#E37A4C; --accent-contrast:#1B0F08; --accent-soft:rgba(227,122,76,.16);
      --rest:#86A9B6; --rest-small:#86A9B6; --rest-contrast:#12191C; --rest-soft:rgba(134,169,182,.16);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181511; --surface:#221D17; --text:#F3EEE6; --text-muted:#A79E92; --border:#3A3126;
    --accent:#E37A4C; --accent-small:#E37A4C; --accent-contrast:#1B0F08; --accent-soft:rgba(227,122,76,.16);
    --rest:#86A9B6; --rest-small:#86A9B6; --rest-contrast:#12191C; --rest-soft:rgba(134,169,182,.16);
  }

  *{ box-sizing: border-box; }
  body{ background: var(--bg); color: var(--text); font-family: var(--font-body); }

  .grip-strip{
    height: 9px;
    background-image: repeating-linear-gradient(135deg, var(--border) 0 2px, transparent 2px 7px);
    opacity: .55;
  }
  .page{
    max-width: 480px; margin-inline: auto; padding-inline: 20px; padding-block: 22px 48px;
    display: flex; flex-direction: column; gap: 22px;
  }

  .masthead{ display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .masthead-text{ display: flex; flex-direction: column; gap: 4px; }
  .eyebrow{
    margin: 0; font-family: var(--font-body); font-weight: 700; font-size: 12px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--accent-small);
  }
  .today-readout{
    margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 14px;
    letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .auth{
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: 600 12px var(--font-body); border-radius: 999px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  .msg{ margin: -8px 0 0; font-size: 14px; line-height: 1.4; color: var(--accent-small); }
  .msg:empty{ display: none; }

  .day-tabs{
    display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; box-shadow: inset 0 1px 2px rgba(0,0,0,.12);
  }
  .tab{
    flex: 1 1 0; position: relative; appearance: none; border: 0; border-radius: 7px; background: transparent;
    color: var(--text-muted); font-family: var(--font-body); font-weight: 600;
    font-size: clamp(10.5px, 2.8vw, 12px); letter-spacing: .02em; text-transform: uppercase;
    padding: 9px 0 8px; cursor: pointer; text-align: center;
  }
  @media (prefers-reduced-motion: no-preference){
    .tab{ transition: background-color .15s ease, color .15s ease; }
  }
  .tab.is-selected{ background: var(--accent); color: var(--accent-contrast); }
  .tab.is-selected[data-kind="rest"]{ background: var(--rest); color: var(--rest-contrast); }
  .tab.is-today:not(.is-selected)::after{
    content: ""; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .tab.is-today[data-kind="rest"]:not(.is-selected)::after{ background: var(--rest); }
  .tab:focus-visible, .auth:focus-visible, .add:focus-visible, .del:focus-visible, .gate-btn:focus-visible, .f:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .panel[hidden]{ display: none; }
  .session-tag{
    margin: 0 0 10px; font-family: var(--font-mono); font-weight: 600; font-size: 12px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--accent-small);
  }
  .panel[data-kind="rest"] .session-tag{ color: var(--rest-small); }
  .headline{
    margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.5rem, 11vw, 3.6rem);
    line-height: .94; letter-spacing: .01em; text-transform: uppercase; color: var(--accent); text-wrap: balance;
  }
  .panel[data-kind="rest"] .headline{ color: var(--rest); }
  .bar{ width: 56px; height: 4px; border-radius: 2px; background: var(--accent); margin: 16px 0 22px; }
  .panel[data-kind="rest"] .bar{ background: var(--rest); }

  .log{ margin: 0 0 14px; }
  .log-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .log-title{ margin: 0; font: 700 17px var(--font-body); }
  .add{
    width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    font: 500 28px/1 var(--font-body); cursor: pointer; display: grid; place-items: center; padding: 0 0 3px;
  }
  .add[hidden]{ display: none; }
  .rows{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .row{ display: grid; grid-template-columns: 1fr 84px 44px; gap: 8px; align-items: center; }
  .f{
    width: 100%; min-height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font: 500 16px var(--font-body); padding: 0 12px;
  }
  .f-wt{ font-family: var(--font-mono); text-align: right; }
  .del{
    width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted);
    font: 400 26px/1 var(--font-body); cursor: pointer;
  }
  .hint{ margin: 0 0 10px; font-size: 14px; line-height: 1.5; color: var(--text-muted); }
  .gate-btn{
    appearance: none; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-contrast);
    font: 600 14px var(--font-body); padding: 12px 16px; min-height: 44px; cursor: pointer;
  }

  .console{
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px;
  }
  .console-label{ display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .console-eyebrow{
    font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .console-name{ font-family: var(--font-body); font-weight: 700; font-size: 17px; color: var(--text); }
  .console-time{
    font-family: var(--font-mono); font-weight: 600; font-size: clamp(1.8rem, 8vw, 2.4rem);
    color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .rest-copy{ margin: 0; font-family: var(--font-body); font-size: 16.5px; line-height: 1.55; color: var(--text); max-width: 34ch; }
</style>
</head>
<body>

<div class="grip-strip" aria-hidden="true"></div>
<div class="page">
  <header class="masthead">
    <div class="masthead-text">
      <p class="eyebrow">Today's Split</p>
      <p class="today-readout" id="today-readout"></p>
    </div>
    <button type="button" class="auth" id="auth">Sign in</button>
  </header>
  <p class="msg" id="msg" role="status"></p>

  <nav class="day-tabs" id="tabs" role="tablist" aria-label="Choose a day"></nav>
  <main class="panels" id="panels"></main>
</div>

<script type="module">
/* ---- Firebase: paste your project's web config here ---- */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const setMsg = t => { $('#msg').textContent = t; };

/* ---- Split definition: [weekday index, tab label, headline (null = rest)] ---- */
const DAYS = [
  [1, 'Mon', 'Back &amp; Arms'], [2, 'Tue', 'Chest'], [3, 'Wed', 'Arms &amp; Legs'],
  [4, 'Thu', 'Chest'], [5, 'Fri', 'Legs &amp; Back'], [6, 'Sat', 'Chest'], [0, 'Sun', null]
];
const CARDIO = `<div class="console"><div class="console-label"><span class="console-eyebrow">Cardio Finisher</span><span class="console-name">Stair Stepper</span></div><span class="console-time">30:00</span></div>`;

DAYS.forEach(([d, abbr, name], i) => {
  const rest = name === null;
  $('#tabs').insertAdjacentHTML('beforeend',
    `<button type="button" class="tab" id="tab-${d}" data-day="${d}" data-kind="${rest ? 'rest' : 'train'}" role="tab" aria-selected="false" aria-controls="panel-${d}">${abbr}</button>`);
  $('#panels').insertAdjacentHTML('beforeend', rest
    ? `<section class="panel" id="panel-${d}" data-day="${d}" data-kind="rest" role="tabpanel" aria-labelledby="tab-${d}" hidden><p class="session-tag">Recovery</p><h1 class="headline">Rest Day</h1><div class="bar" aria-hidden="true"></div><p class="rest-copy">No training today &mdash; recovery is part of the program. Stretch, hydrate, and get ahead on sleep.</p></section>`
    : `<section class="panel" id="panel-${d}" data-day="${d}" data-kind="train" role="tabpanel" aria-labelledby="tab-${d}" hidden><p class="session-tag">Session 0${i + 1} / 06</p><h1 class="headline">${name}</h1><div class="bar" aria-hidden="true"></div><section class="log" data-day="${d}"><div class="log-head"><h2 class="log-title">Lifts</h2><button type="button" class="add" data-act="add" aria-label="Add exercise" hidden>+</button></div><ul class="rows"></ul></section>${CARDIO}</section>`);
});

const tabs = $$('.tab'), panels = $$('.panel');
function selectDay(n) {
  tabs.forEach(t => {
    const on = Number(t.dataset.day) === n;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.classList.toggle('is-selected', on);
  });
  panels.forEach(p => { p.hidden = Number(p.dataset.day) !== n; });
}
tabs.forEach(t => t.addEventListener('click', () => selectDay(Number(t.dataset.day))));

const now = new Date(), todayIndex = now.getDay();
$('#today-readout').textContent = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][todayIndex] + ' / ' +
  String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0') + '.' + now.getFullYear();
const todayTab = tabs.find(t => Number(t.dataset.day) === todayIndex);
if (todayTab) todayTab.classList.add('is-today');
selectDay(todayIndex);

/* ---- Lift log: { "1": [{id, n, w}], ... } ---- */
let user = null, ready = false, log = {}, timer = null, fb = null, auth = null, db = null, unsub = null;

function renderRows() {
  $$('.log').forEach(box => {
    const ul = $('.rows', box), items = log[box.dataset.day] || [];
    $('.add', box).hidden = !user;
    if (!user) {
      ul.innerHTML = ready
        ? `<li><p class="hint">Sign in with Google to log and save your lifts.</p><button type="button" class="gate-btn" data-act="signin">Sign in with Google</button></li>`
        : `<li><p class="hint">Loading your log&hellip;</p></li>`;
      return;
    }
    ul.innerHTML = items.length
      ? items.map(x => `<li class="row" data-id="${x.id}"><input class="f f-name" data-k="n" value="${esc(x.n)}" placeholder="Exercise" aria-label="Exercise name" autocomplete="off"><input class="f f-wt" data-k="w" value="${esc(x.w)}" placeholder="lb" inputmode="decimal" aria-label="Weight in pounds" autocomplete="off"><button type="button" class="del" data-act="del" aria-label="Delete exercise">&times;</button></li>`).join('')
      : `<li><p class="hint">Nothing logged yet. Tap + to add a lift.</p></li>`;
  });
}

function save() {
  if (!user || !db) return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    timer = null;
    try {
      await fb.setDoc(fb.doc(db, 'users', user.uid, 'split', 'log'), { days: log });
      setMsg('');
    } catch (e) {
      setMsg('Could not save your log. Check your connection and Firestore rules.');
    }
  }, 500);
}

async function signIn() {
  if (!fb) return setMsg('Firebase has not loaded yet.');
  try {
    await fb.signInWithPopup(auth, new fb.GoogleAuthProvider());
    setMsg('');
  } catch (e) {
    if (e.code !== 'auth/popup-closed-by-user') setMsg('Sign-in failed: ' + (e.code || e.message));
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'signin') return signIn();
  const box = b.closest('.log');
  if (!box) return;
  const d = box.dataset.day;
  log[d] = log[d] || [];
  if (b.dataset.act === 'add') {
    log[d].push({ id: uid(), n: '', w: '' });
    renderRows(); save();
    const last = $$('.f-name', box).pop();
    if (last) last.focus();
  } else if (b.dataset.act === 'del') {
    const id = b.closest('.row').dataset.id;
    log[d] = log[d].filter(x => x.id !== id);
    renderRows(); save();
  }
});

document.addEventListener('input', e => {
  const f = e.target.closest('.f');
  if (!f) return;
  const x = (log[f.closest('.log').dataset.day] || []).find(r => r.id === f.closest('.row').dataset.id);
  if (x) { x[f.dataset.k] = f.value; save(); }
});

$('#auth').addEventListener('click', () => (user ? fb.signOut(auth) : signIn()));
renderRows();

/* ---- Firebase load (UI above keeps working if this fails) ---- */
const G = 'https://www.gstatic.com/firebasejs/10.12.2/';
try {
  const [app, au, fs] = await Promise.all([
    import(G + 'firebase-app.js'), import(G + 'firebase-auth.js'), import(G + 'firebase-firestore.js')
  ]);
  fb = Object.assign({}, app, au, fs);
  const fapp = fb.initializeApp(firebaseConfig);
  auth = fb.getAuth(fapp);
  db = fb.getFirestore(fapp);

  fb.onAuthStateChanged(auth, u => {
    user = u; ready = true; log = {};
    if (unsub) { unsub(); unsub = null; }
    $('#auth').textContent = u ? 'Sign out' : 'Sign in';
    renderRows();
    if (!u) return;
    unsub = fb.onSnapshot(fb.doc(db, 'users', u.uid, 'split', 'log'), snap => {
      if (snap.metadata.hasPendingWrites || timer) return;
      const incoming = snap.exists() ? (snap.data().days || {}) : {};
      if (JSON.stringify(incoming) === JSON.stringify(log)) return;
      if (document.activeElement && document.activeElement.closest('.row')) return;
      log = incoming;
      renderRows();
    }, () => setMsg('Could not load your log. Check your Firestore rules.'));
  });
} catch (e) {
  ready = true;
  renderRows();
  setMsg('Could not load Firebase. Check your connection and config.');
}
</script>
</body>
</html>
