<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1B1B;
    --surface: #242424;
    --surface-2: #2C2C2C;
    --line: #3A3A3A;
    --orange: #E8622C;
    --orange-bright: #F4823C;
    --text: #F3EFE9;
    --text-dim: #9C9691;
    --text-faint: #6B6662;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; min-height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body{
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width: 560px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: 20px 18px 32px;
  }

  /* ---------- day switcher ---------- */
  .switcher{
    display:flex;
    justify-content:space-between;
    gap:6px;
    margin-bottom: 22px;
  }
  .switcher button{
    flex:1;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 10px 0;
    border-radius: 8px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .switcher button:hover{ border-color: var(--text-faint); }
  .switcher button:focus-visible{ outline: 2px solid var(--orange-bright); outline-offset: 2px; }
  .switcher button.is-today{ color: var(--text); }
  .switcher button.is-selected{
    background: var(--orange);
    border-color: var(--orange);
    color: #1B1B1B;
    font-weight:600;
  }

  .back-today{
    text-align:center;
    margin: -12px 0 20px;
    min-height: 18px;
  }
  .back-today button{
    background:none; border:none; color: var(--orange-bright);
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: .04em; cursor:pointer; padding: 4px 8px;
    visibility:hidden;
  }
  .back-today button.show{ visibility:visible; }
  .back-today button:focus-visible{ outline: 2px solid var(--orange-bright); outline-offset: 2px; }

  /* ---------- hero ---------- */
  .hero{ margin-bottom: 28px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--orange-bright);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .day-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 0.92;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
    position:relative;
    display:inline-block;
  }
  .day-name::after{
    content:"";
    position:absolute;
    left:2px; bottom:-8px;
    width: 46%;
    height: 5px;
    background: var(--orange);
  }
  .meta{
    margin-top: 18px;
    font-size: 15px;
    color: var(--text-dim);
  }
  .meta b{ color: var(--text); font-weight:600; }
  .duration-tag{
    display:inline-block;
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 999px;
  }

  /* ---------- exercise list ---------- */
  .list{ display:flex; flex-direction:column; gap:10px; }

  .ex{
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display:grid;
    grid-template-columns: 1fr auto;
    gap: 4px 14px;
    align-items:center;
  }
  .ex.is-main{
    background: var(--surface-2);
    border-left: 3px solid var(--orange);
  }
  .ex .idx{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    grid-column: 1 / 2;
  }
  .ex.is-main .idx{ color: var(--orange-bright); }
  .ex .name{
    grid-column: 1 / 2;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
  }
  .ex .setsreps{
    grid-column: 2 / 3;
    grid-row: 1 / 3;
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    text-align:right;
    white-space:nowrap;
    align-self:center;
  }
  .ex .subrow{
    grid-column: 1 / 3;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top: 6px;
  }
  .ex .rest{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }
  .ex .main-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--orange-bright);
    border: 1px solid var(--orange);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .ex .note{
    grid-column: 1 / 3;
    font-size: 12.5px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 2px;
  }

  /* ---------- off-day states (cardio / rest) ---------- */
  .off-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding: 30px 4px 60px;
  }
  .off-state .big{
    font-family:'Bebas Neue', sans-serif;
    font-size: 40px;
    line-height: 1.05;
    margin: 0 0 12px;
    max-width: 380px;
  }
  .off-state .big .accent{ color: var(--orange-bright); }
  .off-state p{
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.55;
    max-width: 360px;
    margin: 0;
  }

  /* ---------- footer note ---------- */
  .footer{
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.6;
  }
  .footer b{ color: var(--text-dim); }

  @media (max-width: 380px){
    .day-name{ font-size: 52px; }
    .ex .setsreps{ font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <nav class="switcher" id="switcher" aria-label="Choose a day"></nav>
  <div class="back-today"><button id="backToday">&larr; back to today</button></div>

  <main id="content"></main>

  <div class="footer">
    <b>Good pain</b> = burning inside the muscle. <b>Bad pain</b> = sharp or joint-located &mdash; stop.
    On the main lift, the last 1&ndash;2 reps should feel hard but controlled. Rest 90&ndash;120s on main lifts, 60&ndash;90s on everything else.
  </div>

</div>

<script>
  const WORKOUTS = {
    1: {
      day: "Monday", tag: "PUSH", focus: "Chest — moderate",
      duration: "60 min weights + 30 min cardio", type: "training",
      exercises: [
        { name: "Machine Chest Press", setsReps: "5 x 10-12", rest: "90-120s", main: true },
        { name: "Incline Chest Press", setsReps: "4 x 10-12", rest: "60-90s" },
        { name: "Pec Deck", setsReps: "3 x 12", rest: "60-90s" },
        { name: "Cable Pec Flies", setsReps: "3 x 15", rest: "60-90s" },
        { name: "Iso Lateral Hammer Press", setsReps: "3 x 12", rest: "60-90s" },
      ]
    },
    2: {
      day: "Tuesday", tag: "PULL", focus: "Back",
      duration: "60 min weights + 30 min cardio", type: "training",
      exercises: [
        { name: "Seated Cable Row", setsReps: "5 x 10-12", rest: "90-120s", main: true },
        { name: "Lat Pulldown (wide grip)", setsReps: "4 x 10-12", rest: "60-90s" },
        { name: "Chest-Supported Row", setsReps: "3 x 12", rest: "60-90s" },
        { name: "Single-Arm Lat Pulldown", setsReps: "3 x 12/side", rest: "60-90s" },
        { name: "Straight-Arm Pulldown", setsReps: "3 x 15", rest: "60-90s", note: "Lat isolation — feel it, don't strain." },
      ]
    },
    3: {
      day: "Wednesday", tag: "PUSH", focus: "Shoulders",
      duration: "60 min weights + 30 min cardio", type: "training",
      exercises: [
        { name: "Shoulder Overhead Press (barbell)", setsReps: "5 x 10-12", rest: "90-120s", main: true },
        { name: "Lateral Raise", setsReps: "4 x 12-15", rest: "60-90s" },
        { name: "Rear Delt Fly", setsReps: "3 x 12-15", rest: "60-90s" },
        { name: "Front Raise", setsReps: "3 x 12", rest: "60-90s" },
        { name: "Cable Lateral Raise", setsReps: "3 x 12", rest: "60-90s" },
      ]
    },
    4: {
      day: "Thursday", tag: "ARMS", focus: "Arms + back finisher",
      duration: "60 min weights + 30 min cardio", type: "training",
      exercises: [
        { name: "Bicep Curl (barbell or machine)", setsReps: "5 x 10-12", rest: "90-120s", main: true },
        { name: "Tricep Pushdown", setsReps: "5 x 10-12", rest: "90-120s", main: true },
        { name: "Hammer Curl", setsReps: "3 x 12", rest: "60-90s" },
        { name: "Overhead Tricep Extension", setsReps: "3 x 12", rest: "60-90s" },
        { name: "Cable Curl", setsReps: "3 x 12", rest: "60-90s" },
        { name: "Lat Pulldown or Pull-Ups", setsReps: "3 x AMRAP", rest: "60s", note: "Back finisher — burnout, not max effort." },
      ]
    },
    5: {
      day: "Friday", tag: "CARDIO", focus: "Cardio only",
      duration: "45–60 min", type: "cardio"
    },
    6: {
      day: "Saturday", tag: "PUSH · MARQUEE", focus: "Chest — big session",
      duration: "≈2 hrs", type: "training",
      exercises: [
        { name: "Bench Press (or Machine Bench Press)", setsReps: "5 x 8-10", rest: "90-120s", main: true },
        { name: "Incline Chest Press", setsReps: "5 x 10-12", rest: "90-120s" },
        { name: "Machine Chest Press", setsReps: "4 x 10-12", rest: "60-90s" },
        { name: "Pec Deck", setsReps: "4 x 12-15", rest: "60-90s" },
        { name: "Cable Pec Flies", setsReps: "4 x 15", rest: "60-90s" },
        { name: "Upper Chest Finisher", setsReps: "3 x 15", rest: "60-90s", note: "Low-to-high cable crossover." },
      ]
    },
    0: {
      day: "Sunday", tag: "REST", focus: "Rest",
      duration: "off", type: "rest"
    }
  };

  const DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
  const todayIndex = new Date().getDay();
  let selectedIndex = todayIndex;

  const switcherEl = document.getElementById("switcher");
  const contentEl = document.getElementById("content");
  const backBtn = document.getElementById("backToday");

  function buildSwitcher(){
    switcherEl.innerHTML = "";
    for (let i = 0; i < 7; i++){
      const btn = document.createElement("button");
      btn.textContent = DAY_LETTERS[i];
      btn.setAttribute("aria-label", WORKOUTS[i].day);
      if (i === todayIndex) btn.classList.add("is-today");
      if (i === selectedIndex) btn.classList.add("is-selected");
      btn.addEventListener("click", () => {
        selectedIndex = i;
        render();
      });
      switcherEl.appendChild(btn);
    }
  }

  function exerciseRow(ex, i){
    const isMain = !!ex.main;
    return `
      <div class="ex ${isMain ? "is-main" : ""}">
        <div class="idx">${(i + 1) < 10 ? "0" + (i + 1) : (i + 1)}</div>
        <div class="setsreps">${ex.setsReps}</div>
        <div class="name">${ex.name}</div>
        <div class="subrow">
          <div class="rest">rest ${ex.rest}</div>
          ${isMain ? '<div class="main-tag">MAIN LIFT</div>' : ''}
        </div>
        ${ex.note ? `<div class="note">${ex.note}</div>` : ''}
      </div>
    `;
  }

  function render(){
    const w = WORKOUTS[selectedIndex];
    buildSwitcher();
    backBtn.classList.toggle("show", selectedIndex !== todayIndex);

    let html = `
      <div class="hero">
        <p class="eyebrow">${w.tag}</p>
        <h1 class="day-name">${w.day}</h1>
        <div class="meta"><b>${w.focus}</b></div>
        <div class="duration-tag">${w.duration}</div>
      </div>
    `;

    if (w.type === "rest"){
      html += `
        <div class="off-state">
          <p class="big">Full <span class="accent">rest</span> day.</p>
          <p>No lifting, no structured cardio. This is where the muscle actually rebuilds from the rest of the week — skipping it costs progress, it doesn't add to it.</p>
        </div>
      `;
    } else if (w.type === "cardio"){
      html += `
        <div class="off-state">
          <p class="big">Cardio day. <span class="accent">No weights.</span></p>
          <p>Stairstepper, incline walk, or a run — whatever you actually enjoy, 45–60 minutes. Doubles as light active recovery from Mon–Thu.</p>
        </div>
      `;
    } else {
      html += `<div class="list">${w.exercises.map(exerciseRow).join("")}</div>`;
    }

    contentEl.innerHTML = html;
  }

  backBtn.addEventListener("click", () => {
    selectedIndex = todayIndex;
    render();
  });

  render();
</script>
</body>
</html>
