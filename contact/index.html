<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact — Josh Stafki</title>
<link rel="icon" type="image/png" href="https://www.jstafki.com/assets/main/monolith.png">
<meta name="description" content="Get in touch with Josh Stafki.">

<meta property="og:title" content="Contact — Josh Stafki">
<meta property="og:description" content="Reach out.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://joshstafki.com/contact">
<meta property="og:image" content="https://joshstafki.com/og-image.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact — Josh Stafki">
<meta name="twitter:description" content="Reach out.">
<meta name="twitter:image" content="https://joshstafki.com/og-image.jpg">

<style>
:root{
  --bg:#050505;
  --fg:#f5f5f2;
  --muted:#8d8d8d;
  --violet:#7c3aed;
  --teal:#14b8a6;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Inter,system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}
.center{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2rem;
  will-change:transform,opacity,filter;
}
h1{
  margin:0;
  font-size:clamp(3rem,10vw,8rem);
  letter-spacing:-0.08em;
  font-weight:800;
}
.tag{
  color:var(--muted);
  letter-spacing:.4em;
  margin-top:1rem;
  text-transform:uppercase;
  font-size:.8rem;
}

.contact-block{
  margin-top:4rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.85rem;
}

.email-link{
  font-size:clamp(1.1rem,3vw,1.9rem);
  text-decoration:none;
  color:var(--fg);
  letter-spacing:.03em;
  border-bottom:1px solid transparent;
  transition:transform .4s ease, border-color .3s ease, color .3s ease;
}
.email-link:hover,
.email-link:focus-visible{
  transform:scale(1.04);
  color:var(--teal);
  border-color:var(--teal);
}
.email-link:focus-visible{
  outline:2px solid var(--fg);
  outline-offset:6px;
  border-radius:2px;
}

.relay-note{
  color:var(--muted);
  font-size:.72rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  max-width:26ch;
}

.copy-btn{
  margin-top:.5rem;
  background:none;
  border:1px solid #2a2a2a;
  color:var(--muted);
  font-family:inherit;
  font-size:.68rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  padding:.55rem 1.1rem;
  border-radius:999px;
  cursor:pointer;
  transition:border-color .3s ease, color .3s ease;
}
.copy-btn:hover,
.copy-btn:focus-visible{
  border-color:var(--violet);
  color:var(--fg);
}
.copy-btn:focus-visible{
  outline:2px solid var(--fg);
  outline-offset:4px;
}
.copy-btn[data-copied="true"]{
  border-color:var(--teal);
  color:var(--teal);
}

.back{
  position:fixed;
  top:28px;
  left:28px;
  font-size:.72rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--muted);
  transition:color .3s ease, opacity .35s ease;
}
.back:hover,
.back:focus-visible{
  color:var(--fg);
}
.back:focus-visible{
  outline:2px solid var(--fg);
  outline-offset:4px;
  border-radius:2px;
}

.footer{
 position:fixed;bottom:24px;width:100%;text-align:center;
 color:#666;font-size:.75rem;letter-spacing:.25em;
 transition:opacity .35s ease;
}

/* ───────── Hyperspace jump ───────── */

.warpfield{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}
.streak{
  position:absolute;
  top:50%;
  left:50%;
  height:1.5px;
  width:75vmax;
  background:linear-gradient(to right, transparent, var(--streak-color,#fff));
  transform-origin:0 50%;
  transform:rotate(var(--angle,0deg)) scaleX(0);
  opacity:0;
  border-radius:2px;
}
body.warping .streak{
  animation:streak-fly var(--dur,650ms) var(--delay,0ms) cubic-bezier(.2,.6,.2,1) forwards;
}
@keyframes streak-fly{
  0%{   transform:rotate(var(--angle,0deg)) scaleX(0); opacity:0; }
  12%{  opacity:1; }
  100%{ transform:rotate(var(--angle,0deg)) scaleX(1); opacity:0; }
}

body.warping .center{
  animation:pull-in 820ms cubic-bezier(.5,0,1,1) forwards;
}
@keyframes pull-in{
  0%{   transform:scale(1);    filter:blur(0);   opacity:1; }
  55%{  transform:scale(2.6);  filter:blur(3px);  opacity:1; }
  100%{ transform:scale(16);   filter:blur(18px); opacity:0; }
}

body.warping .footer,
body.warping .back{
  opacity:0;
}

.blackout{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  z-index:10;
  pointer-events:none;
  transition:opacity .35s ease;
}
body.warping .blackout{
  opacity:1;
  transition-delay:.5s;
}

@media (prefers-reduced-motion:reduce){
  body.warping .center{
    animation:none;
    opacity:0;
    transition:opacity .35s ease;
  }
  .streak{ display:none; }
  body.warping .blackout{
    transition-delay:0s;
  }
}
</style>
</head>
<body>

<div class="warpfield" id="warpfield" aria-hidden="true"></div>
<div class="blackout" aria-hidden="true"></div>

<a href="/" class="back" id="backLink">← The Monolith</a>

<section class="center">
<h1>CONTACT</h1>
<div class="tag">SIGNAL • CORRESPONDENCE • INQUIRY</div>

<div class="contact-block">
  <a href="mailto:remits.agreed-6e@icloud.com" class="email-link" id="emailLink">remits.agreed-6e@icloud.com</a>
  <div class="relay-note">Routed through Apple Mail Relay for privacy</div>
  <button class="copy-btn" id="copyBtn" type="button">Copy email</button>
</div>
</section>

<div class="footer">THE MONOLITH</div>

<script>
const body = document.body;
const warpfield = document.getElementById('warpfield');
const backLink = document.getElementById('backLink');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let warping = false;

function buildStreaks(count = 50){
  const frag = document.createDocumentFragment();
  for(let i = 0; i < count; i++){
    const s = document.createElement('span');
    s.className = 'streak';
    const angle = Math.random() * 360;
    const delay = Math.random() * 150;
    const dur = 550 + Math.random() * 250;
    s.style.setProperty('--angle', angle + 'deg');
    s.style.setProperty('--delay', delay + 'ms');
    s.style.setProperty('--dur', dur + 'ms');
    s.style.setProperty('--streak-color', '#ffffff');
    frag.appendChild(s);
  }
  warpfield.appendChild(frag);
}

function jumpTo(href){
  if (warping) return;
  warping = true;

  if (!reduceMotion){
    buildStreaks();
  }

  body.classList.add('warping');

  const wait = reduceMotion ? 380 : 900;
  setTimeout(() => {
    window.location.href = href;
  }, wait);
}

backLink.addEventListener('click', (e) => {
  e.preventDefault();
  jumpTo(backLink.getAttribute('href'));
});

// Copy-to-clipboard for the email address
const copyBtn = document.getElementById('copyBtn');
const emailLink = document.getElementById('emailLink');
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(emailLink.textContent.trim());
    copyBtn.textContent = 'Copied';
    copyBtn.setAttribute('data-copied', 'true');
    setTimeout(() => {
      copyBtn.textContent = 'Copy email';
      copyBtn.removeAttribute('data-copied');
    }, 1800);
  } catch (err) {
    copyBtn.textContent = 'Copy failed';
    setTimeout(() => { copyBtn.textContent = 'Copy email'; }, 1800);
  }
});

// Reset warp state if page is restored from bfcache
function resetWarp(){
  warping = false;
  body.classList.remove('warping');
  warpfield.innerHTML = '';
}

window.addEventListener('pageshow', (e) => {
  if (e.persisted) resetWarp();
});
</script>
</body>
</html>
