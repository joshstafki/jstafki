<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>JOSHUA STAFKI — MAKE THINGS MOVE.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f4f5f0;
      --name-gradient: #f4f5f0;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle, rgba(125, 125, 125, 0.25) 1px, transparent 1.1px),
        radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, 0.035), transparent 70%);
      background-size: 5px 5px, 100% 100%;
      background-attachment: fixed;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      color: var(--fg);
      font-family: Manrope, Inter, Arial, sans-serif;
      font-weight: 300;
    }

    .wordmark {
      position: absolute;
      top: 34px;
      left: 6.5vw;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .name {
      margin: 0;
      font-size: clamp(28px, 3vw, 44px);
      font-weight: 300;
      letter-spacing: -0.055em;
      line-height: 0.95;
      color: transparent;
      background: var(--name-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .catchphrase {
      margin: 0;
      color: rgba(244, 245, 240, 0.68);
      font-size: clamp(12px, 1.05vw, 15px);
      font-weight: 300;
      letter-spacing: 0.105em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    @media (max-width: 800px) {
      .wordmark { top: 22px; left: 6vw; gap: 6px; }
      .name { font-size: clamp(25px, 7vw, 34px); }
      .catchphrase { font-size: 11px; letter-spacing: 0.075em; line-height: 1.5; }
    }

    @media (max-width: 420px) {
      .name { font-size: 27px; }
      .catchphrase { font-size: 10px; letter-spacing: 0.065em; }
    }
  </style>
</head>
<body>
  <header class="wordmark" aria-label="Joshua Stafki">
    <h1 class="name">JOSHUA STAFKI</h1>
    <p class="catchphrase">CHASING A STORY WORTH LEAVING BEHIND</p>
  </header>

  <script>
    (() => {
      const variants = [
        'linear-gradient(105deg, #75f7ff 0%, #8c7bff 48%, #ff76d8 100%)',
        'linear-gradient(105deg, #ff70c8 0%, #b27aff 50%, #6feaff 100%)',
        'linear-gradient(105deg, #72a7ff 0%, #6fffe0 52%, #b6ff78 100%)',
        'linear-gradient(105deg, #fff06a 0%, #ff9b70 48%, #ff6bc7 100%)',
        '#f4f5f0'
      ];

      let choice;
      try {
        const stored = sessionStorage.getItem('jstafki-name-gradient');
        if (stored !== null && Number.isInteger(Number(stored)) && Number(stored) >= 0 && Number(stored) < variants.length) {
          choice = Number(stored);
        } else {
          choice = Math.floor(Math.random() * variants.length);
          sessionStorage.setItem('jstafki-name-gradient', String(choice));
        }
      } catch (_) {
        choice = Math.floor(Math.random() * variants.length);
      }

      document.documentElement.style.setProperty('--name-gradient', variants[choice]);
    })();
  </script>
</body>
</html>
