<!DOCTYPE html>

<head>

<meta name="twitter:card" content="summary_large_image">

<style>
:root{
  --bg:#050505;
  --fg:#f5f5f2;
  --muted:#8d8d8d;
  --violet:#7c3aed;
  --teal:#14b8a6;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Inter,system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}
.center{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2rem;
  will-change:transform,opacity,filter;
}
h1{
  margin:0;
  font-size:clamp(3rem,10vw,8rem);
  letter-spacing:-0.08em;
  font-weight:800;
}
.tag{
  color:var(--muted);
  letter-spacing:.4em;
  margin-top:1rem;
  text-transform:uppercase;
  font-size:.8rem;
}
.projects{
  margin-top:4rem;
  display:flex;
  flex-direction:column;
  gap:1rem;
}
.project{
  font-size:clamp(1.2rem,3vw,2rem);
  text-decoration:none;
  color:var(--fg);
  transition:transform .4s ease;
  letter-spacing:.08em;
}
.project:hover,
.project:focus-visible{
  transform:scale(1.06);
}
.project:focus-visible{
  outline:2px solid var(--fg);
  outline-offset:6px;
  border-radius:2px;
}

.footer{
 position:fixed;bottom:24px;width:100%;text-align:center;
 color:#666;font-size:.75rem;letter-spacing:.25em;
 transition:opacity .35s ease;
}

/* ───────── Hyperspace jump ───────── */

.warpfield{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}
.streak{
  position:absolute;
  top:50%;
  left:50%;
  height:1.5px;
  width:75vmax;
  background:linear-gradient(to right, transparent, var(--streak-color,#fff));
  transform-origin:0 50%;
  transform:rotate(var(--angle,0deg)) scaleX(0);
  opacity:0;
  border-radius:2px;
}
body.warping .streak{
  animation:streak-fly var(--dur,650ms) var(--delay,0ms) cubic-bezier(.2,.6,.2,1) forwards;
}
@keyframes streak-fly{
  0%{   transform:rotate(var(--angle,0deg)) scaleX(0); opacity:0; }
  12%{  opacity:1; }
  100%{ transform:rotate(var(--angle,0deg)) scaleX(1); opacity:0; }
}

body.warping .center{
  animation:pull-in 820ms cubic-bezier(.5,0,1,1) forwards;
}
@keyframes pull-in{
  0%{   transform:scale(1);    filter:blur(0);   opacity:1; }
  55%{  transform:scale(2.6);  filter:blur(3px);  opacity:1; }
  100%{ transform:scale(16);   filter:blur(18px); opacity:0; }
}

body.warping .footer{
  opacity:0;
}

.blackout{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  z-index:10;
  pointer-events:none;
  transition:opacity .35s ease;
}
body.warping .blackout{
  opacity:1;
  transition-delay:.5s;
}

@media (prefers-reduced-motion:reduce){
  body.warping .center{
    animation:none;
    opacity:0;
    transition:opacity .35s ease;
  }
  .streak{ display:none; }
  body.warping .blackout{
    transition-delay:0s;
  }
}
</style>
</head>
<body>

<div class="warpfield" id="warpfield" aria-hidden="true"></div>
<div class="blackout" aria-hidden="true"></div>

<section class="center">
<h1>JOSH STAFKI</h1>
<div class="tag">PHILOSOPHY • ARCHITECTURE • SYNTAX</div>

<nav class="projects">
<a href="/projects/fintech" class="project">FINTECH</a>
<a href="/projects/intrepid-flights" class="project">INTREPID FLIGHTS</a>
<a href="/projects/astronautik" class="project">ASTRØNAUTIK</a>
</nav>
</section>

<div class="footer">THE MONOLITH</div>

<script>
const body = document.body;
const links = document.querySelectorAll('.project');
const warpfield = document.getElementById('warpfield');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let warping = false;

function buildStreaks(count = 50){
  const frag = document.createDocumentFragment();
  for(let i = 0; i < count; i++){
    const s = document.createElement('span');
    s.className = 'streak';
    const angle = Math.random() * 360;
    const delay = Math.random() * 150;
    const dur = 550 + Math.random() * 250;
    const color = '#ffffff';
    s.style.setProperty('--angle', angle + 'deg');
    s.style.setProperty('--delay', delay + 'ms');
    s.style.setProperty('--dur', dur + 'ms');
    s.style.setProperty('--streak-color', color);
    frag.appendChild(s);
  }
  warpfield.appendChild(frag);
}

function jumpTo(href){
  if (warping) return;
  warping = true;

  if (!reduceMotion){
    buildStreaks();
  }

  body.classList.add('warping');

  const wait = reduceMotion ? 380 : 900;
  setTimeout(() => {
    window.location.href = href;
  }, wait);
}

links.forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    jumpTo(el.getAttribute('href'));
  });
});

// When the browser restores this page from back/forward cache,
// it can come back frozen mid-warp (faded out, screen black).
// Reset everything so it looks like a fresh load.
function resetWarp(){
  warping = false;
  body.classList.remove('warping');
  warpfield.innerHTML = '';
}

window.addEventListener('pageshow', (e) => {
  if (e.persisted) resetWarp();
});
</script>
</body>
</html>
