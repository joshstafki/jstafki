<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>MAKE THINGS MOVE. — Digital Space</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050505;
    --fg: #f4f5f0;
    --cyan: #7df9ff;
    --gold: #d4bc82;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: Manrope, sans-serif;
}

#app {
    position: relative;
    isolation: isolate;
    width: 100%;
    height: 100%;
    height: 100svh;
    overflow: hidden;

    background-color: #050505;
    background-image: radial-gradient(
        ellipse at 50% 45%,
        rgba(255,255,255,.035),
        transparent 70%
    );
}

/* PERSONAL WORDMARK */

.site-header {
    position: absolute;
    top: 34px;
    left: 6.5vw;
    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;

    pointer-events: none;
}

.header-name {
    font-family: Manrope, sans-serif;
    font-size: clamp(28px, 3vw, 44px);
    font-weight: 800;
    letter-spacing: -.075em;
    line-height: .95;
    color: #f4f5f0;
}

.header-tagline {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(12px, 1.05vw, 15px);
    font-weight: 500;
    letter-spacing: .105em;
    line-height: 1.4;
    text-transform: uppercase;
    color: rgba(244, 245, 240, .68);
}

/* PROJECT ICONS */

.dock {
    margin-top: 14px;
    animation: fade-up 1s ease .5s both;
}

.dock ul {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 22px;
    list-style: none;
}

.dock-item {
    --glow: var(--cyan);

    position: relative;
    isolation: isolate;
    display: block;
    width: 32px;
    height: 32px;
    pointer-events: auto;

    transition: transform .35s cubic-bezier(.16,1,.3,1);
}

/* larger invisible hit area for fingers and cursors */
.dock-item::after {
    content: "";
    position: absolute;
    inset: -8px;
}

/* soft halo behind the icon; the only thing that animates, and only opacity */
.dock-item::before {
    content: "";
    position: absolute;
    inset: -20px;
    z-index: -1;
    pointer-events: none;

    background: radial-gradient(
        circle,
        color-mix(in srgb, var(--glow) 60%, transparent) 0%,
        transparent 68%
    );
    opacity: .6;

    transition: transform .35s ease;
    animation: dock-breathe 5s ease-in-out infinite;
}

.dock-item img {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--glow) 75%, transparent));
    transition: filter .35s ease;
}

.dock-item:hover,
.dock-item:focus-visible {
    transform: translateY(-2px);
}

.dock-item:hover::before,
.dock-item:focus-visible::before {
    transform: scale(1.35);
}

.dock-item:hover img,
.dock-item:focus-visible img {
    filter: drop-shadow(0 0 10px var(--glow));
}

/* label that fades in under the icon */
.dock-tip {
    position: absolute;
    top: calc(100% + 12px);
    left: 50%;
    transform: translate(-50%, -4px);
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;

    font-size: 9px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(244,245,240,.72);

    transition: opacity .25s ease, transform .35s cubic-bezier(.16,1,.3,1);
}

.dock-item:hover .dock-tip,
.dock-item:focus-visible .dock-tip {
    opacity: 1;
    transform: translate(-50%, 0);
}

@keyframes dock-breathe {
    0%, 100% { opacity: .4; }
    50%      { opacity: .85; }
}

/* RIPPLE */

#ripple {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.ripple-ring {
    position: absolute;
    z-index: 18;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    transform: scale(0);
    will-change: transform, opacity;

    background: radial-gradient(
        circle closest-side,
        transparent 84%,
        color-mix(in srgb, var(--c) 40%, transparent) 96%,
        transparent 100%
    );
}

/* ATMOSPHERE */

.atmosphere {
    position: absolute;
    inset: -30%;
    z-index: 1;
    pointer-events: none;

    background: radial-gradient(
        ellipse at 65% 45%,
        rgba(189,163,107,.045),
        transparent 58%
    );

    animation: atmosphere 14s ease-in-out infinite alternate;
}

@keyframes atmosphere {
    from {
        transform: scale(1) rotate(0deg);
        opacity: .5;
    }
    to {
        transform: scale(1.15) rotate(8deg);
        opacity: 1;
    }
}

/* FILM GRAIN */

.noise {
    position: absolute;
    inset: -50%;
    z-index: 5;
    pointer-events: none;
    opacity: .035;

    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

    animation: noise .2s steps(2) infinite;
}

@keyframes noise {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(1%,-1%); }
    50%  { transform: translate(-1%,1%); }
    75%  { transform: translate(1%,1%); }
    100% { transform: translate(-1%,-1%); }
}

/* VIGNETTE */

.vignette {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;

    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.25) 72%,
        rgba(0,0,0,.65) 100%
    );
}

/* HERO */

.hero {
    position: absolute;
    left: 6.5vw;
    bottom: 10vh;
    z-index: 10;
    pointer-events: none;
}

.kicker {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;

    font-size: 9px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255,255,255,.42);

    animation: fade-up 1s ease both;
}

.kicker::before {
    content: "";
    width: 30px;
    height: 1px;
    background: var(--cyan);
    box-shadow: 0 0 12px rgba(125,249,255,.5);
}

h1 {
    font-size: clamp(70px, 11vw, 170px);
    line-height: .78;
    letter-spacing: -.085em;
    font-weight: 700;
    mix-blend-mode: screen;
}

h1 div {
    overflow: hidden;
}

h1 span {
    display: block;
    animation: reveal 1.15s cubic-bezier(.16,1,.3,1) both;
}

h1 div:nth-child(1) span {
    animation-delay: .1s;
}

h1 div:nth-child(2) span {
    animation-delay: .23s;
}

h1 div:nth-child(3) span {
    animation-delay: .36s;
}

.h1-dim {
    opacity: .16;
}

@keyframes reveal {
    from {
        transform: translateY(110%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes fade-up {
    from {
        transform: translateY(12px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* ROTATING GLOBE */

#globe-stage {
    position: absolute;
    z-index: 2;

    width: min(54vw, 78vh, 780px);
    aspect-ratio: 1;

    left: 72%;
    top: 50%;
    transform: translate(-50%, -50%);

    pointer-events: none;
}

#globe {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.sphere {
    fill: url(#ocean);
    stroke: var(--gold);
    stroke-width: .85;
    vector-effect: non-scaling-stroke;
}

.graticule {
    fill: none;
    stroke: #b89b5c;
    stroke-width: .45;
    opacity: .36;
    vector-effect: non-scaling-stroke;
}

.country {
    fill: rgba(183,151,82,.15);
    stroke: #c8ad70;
    stroke-width: .48;
    vector-effect: non-scaling-stroke;
}

.borders {
    fill: none;
    stroke: #d5bd86;
    stroke-width: .38;
    opacity: .8;
    vector-effect: non-scaling-stroke;
}

.continent-label {
    fill: #e2d0a2;
    font-family: 'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 2px;
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(13,12,8,.75);
    stroke-width: 2px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
}

.ornament {
    fill: none;
    stroke: #bda36b;
    stroke-width: .65;
    opacity: .55;
    vector-effect: non-scaling-stroke;
}

/* RESPONSIVE */

@media (max-width: 800px) {
    .site-header {
        top: 22px;
        left: 6vw;
        right: 4vw;
        gap: 6px;
    }

    .header-name {
        font-size: clamp(25px, 7vw, 34px);
    }

    .header-tagline {
        font-size: 11px;
        letter-spacing: .075em;
        line-height: 1.5;
    }

    .dock {
        margin-top: 10px;
    }

    .dock ul {
        gap: 14px 20px;
    }

    .dock-item {
        width: 30px;
        height: 30px;
    }

    #globe-stage {
        width: min(88vw, 54vh, 520px);
        left: 72%;
        top: 34%;
        opacity: .72;
    }

    .hero {
        left: 6vw;
        right: 4vw;
        bottom: 12vh;
    }

    h1 {
        font-size: 20vw;
    }

    .kicker {
        font-size: 8px;
        margin-bottom: 20px;
    }

    .noise {
        opacity: .025;
    }

    .vignette {
        background: radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.25) 70%,
            rgba(0,0,0,.65) 100%
        );
    }
}

@media (max-width: 420px) {
    .header-name {
        font-size: 27px;
    }

    .header-tagline {
        font-size: 10px;
        letter-spacing: .065em;
    }

    #globe-stage {
        width: 94vw;
        left: 72%;
        top: 30%;
        opacity: .56;
    }

    .hero {
        bottom: 14vh;
    }

    h1 {
        font-size: 20.5vw;
    }

    .kicker {
        font-size: 7px;
        letter-spacing: .14em;
    }
}

@media (prefers-reduced-motion: reduce) {
    .noise,
    .atmosphere {
        animation: none !important;
    }

    h1 span {
        animation: none !important;
        transform: none;
        opacity: 1;
    }

    .kicker {
        animation: none !important;
    }

    .dock,
    .dock-item::before {
        animation: none !important;
    }
}
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
(() => {
    'use strict';

    const reducedMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
    );

    const projection = d3.geoOrthographic()
        .translate([300, 300])
        .scale(258)
        .clipAngle(90)
        .precision(.3);

    const path = d3.geoPath(projection);
    const landLayer = d3.select('#land');
    const labelLayer = d3.select('#labels');

    const graticulePath = document.getElementById('graticule');
    const bordersPath = document.getElementById('borders');

    const labels = [
        { name: 'EUROPA', coordinates: [18, 51] },
        { name: 'ASIA', coordinates: [88, 43] },
        { name: 'AFRICA', coordinates: [20, 3] },
        { name: 'AMERICA SEPTENTRIONALIS', coordinates: [-103, 39] },
        { name: 'AMERICA MERIDIONALIS', coordinates: [-61, -20] },
        { name: 'OCEANIA', coordinates: [137, -25] }
    ];

    const labelNodes = labelLayer
        .selectAll('text')
        .data(labels)
        .join('text')
        .attr('class', 'continent-label')
        .text(d => d.name);

    const graticule = d3.geoGraticule().step([15, 15])();

    function render() {
        graticulePath.setAttribute('d', path(graticule) || '');

        landLayer.selectAll('path').attr('d', path);

        if (window.__worldTopology) {
            bordersPath.setAttribute(
                'd',
                path(
                    topojson.mesh(
                        window.__worldTopology,
                        window.__worldTopology.objects.countries,
                        (a, b) => a !== b
                    )
                ) || ''
            );
        }

        const rotation = projection.rotate();
        const center = [-rotation[0], -rotation[1]];

        labelNodes
            .attr('x', d => {
                const p = projection(d.coordinates);
                return p ? p[0] : -1000;
            })
            .attr('y', d => {
                const p = projection(d.coordinates);
                return p ? p[1] + 4 : -1000;
            })
            .attr('opacity', d =>
                d3.geoDistance(d.coordinates, center) < Math.PI / 2
                    ? 1
                    : 0
            );
    }

    async function start() {
        const response = await fetch(
            'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'
        );

        if (!response.ok) {
            throw new Error('Could not load world geometry');
        }

        const topology = await response.json();
        window.__worldTopology = topology;

        const features = topojson.feature(
            topology,
            topology.objects.countries
        ).features;

        landLayer
            .selectAll('path')
            .data(features)
            .join('path')
            .attr('class', 'country')
            .attr('d', path);

        render();

        let last = 0;
        let longitude = -18;

        function animate(now) {
            requestAnimationFrame(animate);

            if (reducedMotion.matches) {
                last = now;
                return;
            }

            if (!last) last = now;

            const delta = Math.min(now - last, 50);
            last = now;

            longitude += delta * .0042;

            projection.rotate([longitude, -8, 0]);
            render();
        }

        requestAnimationFrame(animate);

        reducedMotion.addEventListener?.('change', render);
    }

    if (window.d3 && window.topojson) {
        start().catch(err =>
            console.error('Globe geometry could not be loaded:', err)
        );
    }
})();
</script>

<script>
/* RIPPLE: click a project icon and the dots + a colored ring sweep out from it */
(() => {
    'use strict';

    const app = document.getElementById('app');
    const cv = document.getElementById('ripple');
    const c = cv.getContext('2d');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

    const STEP = 5;      // dot spacing
    const LEVELS = 8;    // color/size steps between grey dot and glow
    const TAU = Math.PI * 2;

    let W, H, DPR, base;
    let running = false;

    const ring = document.createElement('div');
    ring.className = 'ripple-ring';
    app.appendChild(ring);

    function paintBase() {
        if (!base) return;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, cv.width, cv.height);
        c.drawImage(base, 0, 0);
    }

    function layout() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth;
        H = cv.clientHeight;
        if (!W || !H) return;

        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);

        base = document.createElement('canvas');
        base.width = cv.width;
        base.height = cv.height;

        const b = base.getContext('2d');
        b.scale(DPR, DPR);
        b.fillStyle = 'rgba(125,125,125,.25)';
        b.beginPath();

        for (let y = STEP / 2; y < H; y += STEP) {
            for (let x = STEP / 2; x < W; x += STEP) {
                b.moveTo(x + 1, y);
                b.arc(x, y, 1, 0, TAU);
            }
        }

        b.fill();
        paintBase();
    }

    function toRGB(str) {
        const t = document.createElement('canvas').getContext('2d');
        t.fillStyle = '#7df9ff';
        t.fillStyle = str;
        const h = t.fillStyle;
        const v = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        return v.some(Number.isNaN) ? [125, 249, 255] : v;
    }

    function ripple(x0, y0, color) {
        const [R, G, B] = toRGB(color);

        const A = 8;        // how far dots get pushed (px)
        const FRONT = 16;   // sharpness of the leading edge
        const DECAY = 70;   // how far the trailing waves reach
        const WAVE = 15;    // spacing of the trailing waves
        const T = 1900;     // total duration (ms)

        const reach = Math.hypot(Math.max(x0, W - x0), Math.max(y0, H - y0)) + 260;

        const shades = Array.from({ length: LEVELS }, (_, i) => {
            const m = i / (LEVELS - 1);
            const mix = v => Math.round(125 + (v - 125) * m);
            return `rgba(${mix(R)},${mix(G)},${mix(B)},${(.25 + .7 * m).toFixed(2)})`;
        });

        ring.style.setProperty('--c', color);
        ring.style.width = ring.style.height = reach * 2 + 'px';
        ring.style.left = x0 - reach + 'px';
        ring.style.top = y0 - reach + 'px';

        const t0 = performance.now();

        function frame(now) {
            const p = Math.max(0, Math.min((now - t0) / T, 1));
            const r = reach * (1 - Math.pow(1 - p, 1.6));
            const amp = Math.pow(1 - p, 1.3) * Math.exp(-r / 1500);

            const ro = r + FRONT * 3;
            const ri = Math.max(0, r - DECAY * 3.5);

            const paths = shades.map(() => new Path2D());

            const dot = (x, y) => {
                const dx = x - x0;
                const dy = y - y0;
                const d = Math.hypot(dx, dy) || 1;
                const u = r - d;                    // positive = behind the front

                const w = u < 0
                    ? Math.exp(-(u * u) / (2 * FRONT * FRONT))
                    : Math.exp(-u / DECAY) * Math.cos(u / WAVE);

                const k = w * amp;
                const m = Math.min(1, Math.abs(k) * 1.8);
                const lvl = Math.round(m * (LEVELS - 1));
                const rad = 1 + 1.4 * (lvl / (LEVELS - 1));
                const px = x + (dx / d) * A * k;
                const py = y + (dy / d) * A * k;

                paths[lvl].moveTo(px + rad, py);
                paths[lvl].arc(px, py, rad, 0, TAU);
            };

            const scan = (y, xa, xb) => {
                xa = Math.max(xa, 0);
                xb = Math.min(xb, W);
                let x = STEP / 2 + Math.ceil((xa - STEP / 2) / STEP) * STEP;
                for (; x <= xb; x += STEP) dot(x, y);
            };

            // only the dots inside the moving band get recomputed
            for (let y = STEP / 2; y < H; y += STEP) {
                const dy = y - y0;
                const ao = ro * ro - dy * dy;
                if (ao <= 0) continue;

                const xo = Math.sqrt(ao);
                const ai = ri * ri - dy * dy;
                const xi = ai > 0 ? Math.sqrt(ai) : 0;

                scan(y, x0 - xo, x0 - xi);
                scan(y, x0 + xi, x0 + xo);
            }

            // untouched dots: the cached grid with the band cut out
            c.setTransform(1, 0, 0, 1, 0, 0);
            c.clearRect(0, 0, cv.width, cv.height);

            c.save();
            c.scale(DPR, DPR);
            c.beginPath();
            c.rect(0, 0, W, H);
            c.moveTo(x0 + ro, y0);
            c.arc(x0, y0, ro, 0, TAU);
            c.moveTo(x0 + ri, y0);
            c.arc(x0, y0, ri, 0, TAU);
            c.clip('evenodd');
            c.drawImage(base, 0, 0, W, H);
            c.restore();

            // displaced, tinted dots
            c.save();
            c.scale(DPR, DPR);
            paths.forEach((pth, i) => {
                c.fillStyle = shades[i];
                c.fill(pth);
            });
            c.restore();

            ring.style.transform = `scale(${r / reach})`;
            ring.style.opacity = Math.max(0, (1 - p) * .9);

            if (p < 1) {
                requestAnimationFrame(frame);
            } else {
                paintBase();
                ring.style.opacity = 0;
            }
        }

        requestAnimationFrame(frame);
    }

    document.querySelectorAll('.dock-item').forEach(a => {
        a.addEventListener('click', e => {
            if (!base || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
            if (a.target === '_blank' || reduced.matches) return;

            e.preventDefault();
            if (running) return;
            running = true;

            const b = a.getBoundingClientRect();
            const color = getComputedStyle(a).getPropertyValue('--glow').trim() || '#7df9ff';

            ripple(b.left + b.width / 2, b.top + b.height / 2, color);

            setTimeout(() => { location.href = a.href; }, 1000);
            setTimeout(() => { running = false; }, 2600);
        });
    });

    // coming back with the browser's Back button: clear any half-finished ripple
    window.addEventListener('pageshow', e => {
        if (e.persisted) {
            running = false;
            ring.style.opacity = 0;
            paintBase();
        }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (!running) layout(); }, 150);
    });

    layout();
})();
</script>

</body>
</html>
