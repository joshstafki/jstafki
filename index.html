<html lang="en">
<head>

<!-- Icon font for the menu — swap this link (and the ti-* classes below) for Font Awesome or any other set if you'd rather not depend on Tabler. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
:root{
  --bg:#050505;
  --fg:#f5f5f2;
  --muted:#8d8d8d;
  --violet:#7c3aed;
  --teal:#14b8a6;
  --glass-bg:rgba(245,245,242,0.06);
  --glass-border:rgba(245,245,242,0.14);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Inter,system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}

/* ───────── Starfield canvas: sits behind everything ───────── */

#space{
  position:fixed;
  inset:0;
  z-index:0;
  display:block;
}

.center{
  position:relative;
  z-index:2;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2rem;
  will-change:transform,opacity,filter;
}
h1{
  margin:0;
  font-size:clamp(3rem,10vw,8rem);
  letter-spacing:-0.08em;
  font-weight:800;
}
.tag{
  color:var(--muted);
  letter-spacing:.4em;
  margin-top:1rem;
  text-transform:uppercase;
  font-size:.8rem;
}

/* ───────── Menu: morphs in place, no separate flyout ───────── */

.menu-wrap{
  position:relative;
  margin-top:4rem;
  width:52px;
  height:52px;
}
.morph-box{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:52px;
  height:52px;
  border:1px solid rgba(245,245,242,0.25);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  background:transparent;
  transition:width .38s cubic-bezier(.2,.7,.2,1), height .38s cubic-bezier(.2,.7,.2,1),
             border-radius .38s ease, background .38s ease, border-color .38s ease;
}
.morph-box:hover{ border-color:rgba(245,245,242,0.45); }
.morph-box:focus-visible{ outline:2px solid var(--fg); outline-offset:4px; }
/* Width and height are set from JS below, computed from the project count
   and the available screen width, so adding a project — or viewing on a
   narrow phone — never requires touching this CSS. */
.morph-box.is-open{
  border-radius:20px;
  background:var(--glass-bg);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-color:var(--glass-border);
}
.icon-layer{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .2s ease;
}
.dots{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:4px; width:18px; height:18px;
}
.dots span{ background:var(--fg); border-radius:2px; }
.list-layer{
  position:absolute; inset:0;
  padding:14px;
  display:grid;
  grid-auto-flow:column;
  grid-template-rows:repeat(2, 1fr);
  grid-auto-columns:92px;
  gap:8px;
  opacity:0; pointer-events:none;
  transition:opacity .18s ease;
}
.project-row{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:8px 4px; border-radius:10px;
  color:var(--fg); text-decoration:none; text-align:center;
  font-size:.6rem; letter-spacing:.06em; font-weight:600; line-height:1.25;
  transition:background .15s ease;
}
.project-row:hover, .project-row:focus-visible{ background:rgba(245,245,242,0.08); }
.project-row:focus-visible{ outline:2px solid var(--fg); outline-offset:-2px; }
.project-row i{ font-size:20px; color:var(--muted); }

.footer{
 position:fixed;bottom:24px;width:100%;text-align:center;
 color:#666;font-size:.75rem;letter-spacing:.25em;
 transition:opacity .35s ease;
 z-index:2;
}

/* ───────── Hyperspace jump ─────────
   The star streaks themselves are drawn on the canvas — the same
   stars that drift in the background accelerate into the warp, so
   the ambient field and the jump are one continuous effect.
   The CSS below handles what happens to the page *content*:
   it gets pulled past the camera while the blackout covers the
   navigation swap. */

body.warping .center{
  animation:pull-in 820ms cubic-bezier(.5,0,1,1) forwards;
}
@keyframes pull-in{
  0%{   transform:scale(1);    filter:blur(0);   opacity:1; }
  55%{  transform:scale(2.6);  filter:blur(3px);  opacity:1; }
  100%{ transform:scale(16);   filter:blur(18px); opacity:0; }
}

body.warping .footer{
  opacity:0;
}

.blackout{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  z-index:10;
  pointer-events:none;
  transition:opacity .35s ease;
}
body.warping .blackout{
  opacity:1;
  transition-delay:.5s;
}

@media (prefers-reduced-motion:reduce){
  body.warping .center{
    animation:none;
    opacity:0;
    transition:opacity .35s ease;
  }
  body.warping .blackout{
    transition-delay:0s;
  }
  .morph-box, .icon-layer, .list-layer, .project-row{
    transition:none !important;
  }
}
</style>
</head>
<body>

<canvas id="space" aria-hidden="true"></canvas>
<div class="blackout" aria-hidden="true"></div>

<section class="center">
<h1>JOSH STAFKI</h1>
<div class="tag">PHILOSOPHY • ARCHITECTURE • SYNTAX</div>

<div class="menu-wrap">
  <div class="morph-box" id="morphBox" role="button" tabindex="0"
       aria-haspopup="true" aria-expanded="false" aria-controls="listLayer" aria-label="Open project menu">
    <div class="icon-layer" id="iconLayer">
      <div class="dots"><span></span><span></span><span></span><span></span></div>
    </div>
    <nav class="list-layer" id="listLayer" aria-hidden="true" aria-label="Projects">
      <a href="/projects/fintech" class="project-row"><i class="ti ti-chart-bar" aria-hidden="true"></i><span>FINTECH</span></a>
      <a href="/projects/intrepidflights" class="project-row"><i class="ti ti-drone" aria-hidden="true"></i><span>INTREPID FLIGHTS</span></a>
      <a href="/projects/astronautik" class="project-row"><i class="ti ti-music" aria-hidden="true"></i><span>ASTRØNAUTIK</span></a>
      <a href="/projects/gbro" class="project-row"><i class="ti ti-barbell" aria-hidden="true"></i><span>GBRO</span></a>
      <a href="/projects/premiere" class="project-row"><i class="ti ti-movie" aria-hidden="true"></i><span>PREMIERE</span></a>
      <a href="/projects/chroma" class="project-row"><i class="ti ti-palette" aria-hidden="true"></i><span>CHROMA</span></a>
      <a href="/projects/artisan" class="project-row"><i class="ti ti-pizza" aria-hidden="true"></i><span>ARTISIANO</span>
</a>
    </nav>
  </div>
</div>
</section>

<div class="footer">THE MONOLITH</div>

<script>
const body = document.body;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let warping = false;

/* ───────── 3D starfield ─────────
   Stars live in a real 3D frustum and are projected with
   sx = cx + x/z * fov. In ambient mode they drift toward the
   camera and twinkle; during a jump the same stars accelerate
   ~30x and are drawn as streaks from their previous projected
   position — the classic hyperspace pull. */

const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');

const STAR_COUNT = 420;
const MAX_DEPTH = 1600;      // far plane
const AMBIENT_SPEED = 275;   // units/second of forward drift
const WARP_MAX_SPEED = 9000; // units/second at full warp
const WARP_RAMP = 0.7;       // seconds to reach full speed

let width, height, cx, cy, fov;
let stars = [];
let mode = 'ambient';        // ambient | warp
let warpT = 0;
let lastTime = performance.now();

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = width / 2;
  cy = height / 2;
  fov = Math.max(width, height) * 0.8;
  if (reduceMotion) drawStatic();
}

function makeStar(randomDepth){
  return {
    x: (Math.random() - 0.5) * width * 2.4,
    y: (Math.random() - 0.5) * height * 2.4,
    z: randomDepth ? Math.random() * MAX_DEPTH : MAX_DEPTH,
    pz: 0,
    tw: Math.random() * Math.PI * 2,
    twSpeed: 0.6 + Math.random() * 1.8,
    size: 0.6 + Math.random() * 1.2
  };
}

function initStars(){
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar(true));
}

function respawn(s){
  s.x = (Math.random() - 0.5) * width * 2.4;
  s.y = (Math.random() - 0.5) * height * 2.4;
  s.z = MAX_DEPTH;
  s.pz = MAX_DEPTH;
}

function currentSpeed(){
  if (mode === 'warp'){
    const p = Math.min(warpT / WARP_RAMP, 1);
    const eased = p * p * p; // ease-in cubic
    return AMBIENT_SPEED + (WARP_MAX_SPEED - AMBIENT_SPEED) * eased;
  }
  return AMBIENT_SPEED;
}

function frame(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const speed = currentSpeed();
  const inWarp = mode === 'warp';
  if (inWarp) warpT += dt;

  // During warp, let previous frames linger slightly for glow;
  // ambient gets a clean wipe every frame.
  if (inWarp){
    ctx.fillStyle = 'rgba(5, 5, 5, 0.35)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, width, height);
  }

  for (const s of stars){
    s.pz = s.z;
    s.z -= speed * dt;
    if (s.z <= 1){ respawn(s); continue; }

    const sx = cx + (s.x / s.z) * fov;
    const sy = cy + (s.y / s.z) * fov;
    if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50){
      respawn(s);
      continue;
    }

    const depth = 1 - s.z / MAX_DEPTH; // 0 far, 1 near

    if (inWarp && s.pz > s.z){
      const px = cx + (s.x / s.pz) * fov;
      const py = cy + (s.y / s.pz) * fov;
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.25 + depth * 0.75).toFixed(3) + ')';
      ctx.lineWidth = 0.5 + depth * 2.5;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    } else {
      s.tw += s.twSpeed * dt;
      const twinkle = 0.55 + Math.sin(s.tw) * 0.35;
      const alpha = Math.max(0.06, twinkle * (0.25 + depth * 0.75));
      const r = s.size * (0.4 + depth * 1.1);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}

// Reduced motion: a single static starfield frame, no drift, no warp.
function drawStatic(){
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, width, height);
  for (const s of stars){
    if (s.z <= 1) continue;
    const sx = cx + (s.x / s.z) * fov;
    const sy = cy + (s.y / s.z) * fov;
    if (sx < 0 || sx > width || sy < 0 || sy > height) continue;
    const depth = 1 - s.z / MAX_DEPTH;
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.15 + depth * 0.5).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, s.size * (0.4 + depth * 1.1), 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ───────── Hyperspace jump on navigation ───────── */

function jumpTo(href){
  if (warping) return;
  warping = true;

  if (!reduceMotion){
    mode = 'warp';   // the background stars themselves become the streaks
    warpT = 0;
  }

  body.classList.add('warping');

  const wait = reduceMotion ? 380 : 900;
  setTimeout(() => {
    window.location.href = href;
  }, wait);
}

// Project links inside the menu trigger the warp jump.
document.querySelectorAll('.project-row').forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    jumpTo(el.getAttribute('href'));
  });
});

// When the browser restores this page from back/forward cache,
// it can come back frozen mid-warp (faded out, screen black,
// stars still streaking). Reset everything to ambient.
function resetWarp(){
  warping = false;
  mode = 'ambient';
  warpT = 0;
  body.classList.remove('warping');
}

window.addEventListener('pageshow', (e) => {
  if (e.persisted) resetWarp();
});

/* ───────── Menu: morphs in place ───────── */

const morphBox = document.getElementById('morphBox');
const iconLayer = document.getElementById('iconLayer');
const listLayer = document.getElementById('listLayer');
let menuOpen = false;

// Panel prefers 2 rows and grows wider as projects are added — but on a
// narrow phone there isn't always room for that, so past a screen-width
// threshold it falls back to adding rows instead of overflowing the edges.
const PANEL_PADDING = 14;
const PANEL_GAP = 8;
const PANEL_COL_WIDTH = 92;
const PANEL_ROW_HEIGHT = 68;
const EDGE_MARGIN = 40; // minimum breathing room from the screen edges

function computePanelSize(){
  const count = document.querySelectorAll('.project-row').length;
  const maxWidth = window.innerWidth - EDGE_MARGIN;

  let columns = Math.max(1, Math.ceil(count / 2));
  let rows = 2;
  let width = (PANEL_PADDING * 2) + (columns * PANEL_COL_WIDTH) + (Math.max(0, columns - 1) * PANEL_GAP);

  if (width > maxWidth){
    columns = Math.max(1, Math.floor((maxWidth - PANEL_PADDING * 2 + PANEL_GAP) / (PANEL_COL_WIDTH + PANEL_GAP)));
    rows = Math.max(2, Math.ceil(count / columns));
    width = (PANEL_PADDING * 2) + (columns * PANEL_COL_WIDTH) + (Math.max(0, columns - 1) * PANEL_GAP);
  }

  const height = (PANEL_PADDING * 2) + (rows * PANEL_ROW_HEIGHT) + (Math.max(0, rows - 1) * PANEL_GAP);
  return { width, height, columns, rows };
}

function applyPanelSize(){
  const size = computePanelSize();
  morphBox.style.width = size.width + 'px';
  morphBox.style.height = size.height + 'px';
  if (size.rows > 2){
    listLayer.style.gridAutoFlow = 'row';
    listLayer.style.gridTemplateColumns = `repeat(${size.columns}, ${PANEL_COL_WIDTH}px)`;
    listLayer.style.gridTemplateRows = `repeat(${size.rows}, ${PANEL_ROW_HEIGHT}px)`;
  } else {
    listLayer.style.gridAutoFlow = '';
    listLayer.style.gridTemplateColumns = '';
    listLayer.style.gridTemplateRows = '';
  }
}

window.addEventListener('resize', () => { if (menuOpen) applyPanelSize(); });

function openMenu(){
  menuOpen = true;
  applyPanelSize();
  morphBox.classList.add('is-open');
  morphBox.setAttribute('aria-expanded', 'true');
  iconLayer.style.opacity = '0';
  iconLayer.style.pointerEvents = 'none';
  listLayer.setAttribute('aria-hidden', 'false');
  setTimeout(() => {
    listLayer.style.opacity = '1';
    listLayer.style.pointerEvents = 'auto';
  }, 160);
}

function closeMenu(){
  menuOpen = false;
  morphBox.setAttribute('aria-expanded', 'false');
  listLayer.style.opacity = '0';
  listLayer.style.pointerEvents = 'none';
  listLayer.setAttribute('aria-hidden', 'true');
  setTimeout(() => {
    morphBox.classList.remove('is-open');
    morphBox.style.width = '';
    morphBox.style.height = '';
    iconLayer.style.opacity = '1';
    iconLayer.style.pointerEvents = 'auto';
  }, 100);
}

morphBox.addEventListener('click', (e) => {
  if (e.target.closest('.project-row')) return;
  menuOpen ? closeMenu() : openMenu();
});

morphBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    menuOpen ? closeMenu() : openMenu();
  } else if (e.key === 'Escape' && menuOpen){
    closeMenu();
    morphBox.focus();
  }
});

document.addEventListener('click', (e) => {
  if (menuOpen && !morphBox.contains(e.target)) closeMenu();
});

/* ───────── Boot ───────── */

window.addEventListener('resize', resize);
resize();
initStars();
if (reduceMotion){
  drawStatic();
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
