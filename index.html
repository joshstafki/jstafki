<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Construction</title>

    <meta name="description" content="This website is currently under construction. Please check back soon.">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .construction-image {
            display: block;
            width: 100%;
            max-width: 560px;
            height: auto;
            margin: 0 auto 35px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0 auto;
            max-width: 600px;
            color: #666;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: #999;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="construction-image"
            src="https://t4.ftcdn.net/jpg/00/89/02/67/360_F_89026793_eyw5a7WCQE0y1RHsizu41uhj7YStgvAA.jpg"
            alt="Under construction"
        >

        <h1>This Site Is Under Construction</h1>

        <p>
            We’re currently working on something new.
            Please check back soon for updates.
        </p>

        <div class="footer">
            © 2026
        </div>

    </main>

</body>
</html>
