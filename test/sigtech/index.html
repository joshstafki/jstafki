<style>
:root {
  --ink:#0b0f1a;
  --mut:#6b7280;
  --line:#e5e7eb;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:#fff;
  color:var(--ink);
  padding:env(safe-area-inset-top) 16px calc(48px + env(safe-area-inset-bottom));
}

.wrap {
  max-width:720px;
  margin:0 auto;
}

[hidden] {
  display:none!important;
}

.sr {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
}

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 0 6px;
}

.mark {
  display:flex;
  align-items:baseline;
  gap:.18em;
  font-weight:800;
  font-size:2rem;
  letter-spacing:.04em;

}

.who {
  display:flex;
  align-items:center;
  gap:10px;

  font-size:.8rem;

}

.who span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.link {
  min-height:44px;
  padding:0 6px;
  border:0;
  background:none;
  font:inherit;
  font-weight:600;

  cursor:pointer;
}

#signin {
  text-align:center;
  padding:18vh 0 0;
}

#signin .mark {
  justify-content:center;
  font-size:4.5rem;
}

  margin:14px auto 26px;

}

.go {
  min-height:48px;
  padding:0 24px;
  border:0;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

#err,#msg {
  margin-top:16px;

  color:var(--mut);
}

.pick {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:6px;
}

.pick label {
  font-size:1.6rem;
  font-weight:800;
  line-height:1;
}

.pick select {
  flex:1;

  border:1px solid var(--line);

}

.tabs {
  position:sticky;
  top:0;
  z-index:5;
  display:grid;
  grid-template-columns:1fr 1fr;

}

.tabs button {
  min-height:48px;
  border:0;
  border-bottom:3px solid transparent;
  background:none;
  font:inherit;
  font-weight:700;
  color:var(--mut);
  cursor:pointer;
}

.tabs button[aria-selected=true] {
  color:var(--ink);
  border-bottom-color:var(--ink);
}

.card {
  margin-top:14px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.card h3 {
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  background:#f9fafb;

  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--mut);
}

.row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);

}

.row:last-child {
  border-bottom:0;
}

.neg {
  color:#dc2626;
}

.scroll {
  overflow-x:auto;
}

table {
  width:100%;
  min-width:300px;
  border-collapse:collapse;
}

th,td {
  padding:10px 14px;
  text-align:left;
  border-bottom:1px solid var(--line);

}

th {
  font-size:.7rem;

}

.net {

.net small,

.ch {

}

.ch text {

}

.ch .m {

}

.ch .b {

}

.ch .gl,

.ch .ld {

}

.ch .gl {

}

.ch .ax,

.ch .cage {

}

.rise polygon {

.rise {

.note {

.er {

.er .nm {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

}

.er b {
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.hb {
  display:block;
  width:100%;
  height:auto;
}

.lg {
  min-width:0;
  margin-top:10px;
}

.lg td {
  padding:6px 0;
  font-size:.85rem;
}

.lg tr:last-child td {

}

.sw {
  display:inline-block;

}

@media (min-width:900px) {
  body {
    padding-left:32px;
    padding-right:32px;
  }

    max-width:1280px;
  }

  .pick select {
    flex:0 1 420px;
  }

  #p-data {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:0 16px;

  }

    grid-template-columns:repeat(12,1fr);
  }

  .c12 { grid-column:span 12; }
  .c7 { grid-column:span 7; }

}

@media (prefers-reduced-motion:reduce) {
  .rise {
    animation:none;
  }

</style>

<body>

<div class="wrap">

<header class="top">
  <div class="mark" aria-label="Sigma AGG">
    <span>Σ</span><span>AGG</span>
  </div>

  <div class="who" id="who" hidden>
    <span id="email"></span>
    <button type="button" class="link" id="out">Sign out</button>
  </div>
</header>

<section id="signin" hidden>
  <div class="mark" aria-hidden="true">
    <span>Σ</span><span>AGG</span>
  </div>

  <p>Sign in with the Google account you use for FINTECH.</p>

  <button type="button" class="go" id="in">

  </button>

<script type="module">

/* ---------- Firebase imports ---------- */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* ---------- Firebase configuration ---------- */

const app = initializeApp({
  apiKey: "AIzaSyCy-TtJUv-lqhNd_aiadEoiLSveYSTatVA",
  authDomain: "fintech-dashboard-ff65f.firebaseapp.com",
  projectId: "fintech-dashboard-ff65f",
  storageBucket: "fintech-dashboard-ff65f.firebasestorage.app",
  messagingSenderId: "447875559759",
  appId: "1:447875559759:web:93cd3a61024ed62336953a"
});

const db = getFirestore(app);
const auth = getAuth(app);


/* ---------- Helpers ---------- */

const $ = (id) => document.getElementById(id);

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

const n = (v) => Number.isFinite(+v) ? +v : 0;

const money = (v) =>
  (n(v) < 0 ? '-' : '') +
  '$' +
  Math.abs(n(v)).toLocaleString('en-US', {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const DAY = /^\d{4}-\d{2}-\d{2}$/;

const fmt = (d) =>
  d.toLocaleDateString('en-US', {
    month:'short',
    day:'numeric',
    year:'numeric'
  });

const day = (s) =>
  DAY.test(s)
    ? fmt(new Date(
        +s.slice(0,4),
        +s.slice(5,7)-1,
        +s.slice(8,10)
      ))
    : '—';

const list = (a) => Array.isArray(a) ? a : [];

const sum = (a, f = (x) => x) =>
  a.reduce((t,x) => t + n(f(x)), 0);

const badge = (s) =>
  s
    ? `<span class="badge ${s === 'PAID' ? 'ok' : 'no'}">${esc(s)}</span>`
    : '';

const saved = (s) =>
  s.savedAt?.toDate
    ? fmt(s.savedAt.toDate())
    : '—';

const label = (s) =>
  DAY.test(s.session?.start) && DAY.test(s.session?.end)
    ? `${day(s.session.start)} – ${day(s.session.end)}`
    : `Undated · saved ${saved(s)}`;


/* ---------- Table helper ---------- */

const tbl = (title, head, body, foot) => `
<div class="card">
  <h3>${title}</h3>
  <div class="scroll">
    <table>
      <thead>
        <tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr>
      </thead>

      <tbody>
        ${body || `<tr><td class="mut" colspan="${head.length}">None</td></tr>`}
      </tbody>

      ${foot || ''}
    </table>
  </div>
</div>`;


/* ---------- Session Data tab ---------- */

function renderData(s) {

  const T = s.totals || {};
  const E = s.entries || {};
  const R = s.reconciliation || {};
  const G = s.goal || {};
  const se = s.session || {};

  const row = (k,v,neg) => `
    <div class="row">
      <span>${k}</span>
      <b${neg && n(v) < 0 ? ' class="neg"' : ''}>${v}</b>
    </div>`;

  const exp = (title, rows) => {

    rows = list(rows);

    return tbl(
      title,
      ['Date','Name','Amount','Status'],

      rows.map((r) => `
        <tr>
          <td>${day(r.date)}</td>
          <td>${esc(r.name)}</td>
          <td class="r">${money(r.amount)}</td>
          <td>${badge(r.status)}</td>
        </tr>
      `).join(''),

      `<tfoot>
        <tr>
          <td colspan="2">Σ Total</td>
          <td class="r">${money(sum(rows,(r) => r.amount))}</td>
          <td></td>
        </tr>
      </tfoot>`
    );
  };

  const rec = (title, rows, r = {}) =>
    tbl(
      title,
      ['Name','Deducted'],

      list(rows).map((x) => `
        <tr>
          <td>${esc(x.name)}</td>
          <td class="r">-${money(Math.abs(n(x.amount)))}</td>
        </tr>
      `).join(''),

      `<tfoot>
        <tr>
          <td>Starting balance</td>
          <td class="r">${money(r.startingBalance)}</td>
        </tr>

        <tr>
          <td>
            Ending balance
            <span class="badge ${r.reconciled ? 'ok' : 'no'}">
              ${r.reconciled ? 'RECONCILED' : 'NOT RECONCILED'}
            </span>
          </td>
          <td class="r">${money(r.endingBalance)}</td>
        </tr>
      </tfoot>`
    );

  const fills = list(E.fillUps);

  return `

    <div class="card">
      <h3>Σ Session</h3>
      ${row('Dates',esc(label(s)))}
      ${row('Length',se.days ? se.days + (se.days === 1 ? ' day' : ' days') : '—')}
      ${row('Saved',saved(s))}
    </div>

    <div class="card">
      <h3>Summary</h3>
      ${row('Total Spendable Income',money(T.spendableIncome))}
      ${row('Out of Pocket',money(T.outOfPocket))}
      ${row('Bank Initiated',money(T.bankInitiated))}
      ${row('Est. Gas',money(T.estGas))}
      ${row('Est. Groceries',money(T.estGroceries))}
      ${row('Actual Total Revenue',money(T.actualRevenue),1)}
      ${row('True Net Revenue',money(T.trueNetRevenue),1)}
      ${row('Burn per Day',T.burnPerDay == null ? '—' : money(T.burnPerDay))}
    </div>

    ${exp('Out of Pocket Expenses',E.outOfPocket)}

    ${exp('Bank Initiated Expenses',E.bankInitiated)}

    ${tbl(
      'Fill Ups',
      ['Date','Name','Status'],
      fills.map((r) => `
        <tr>
          <td>${day(r.date)}</td>
          <td>${esc(r.name)}</td>
          <td>${badge(r.status)}</td>
        </tr>
      `).join('')
    )}

    ${rec('Bank Reconciliation',E.bankReconciliation,R.bank)}

    ${rec('Grocery Budget',E.groceryBudget,R.grocery)}

    ${
      n(G.target) > 0 || G.name
        ? `
          <div class="card">
            <h3>Σ ${esc(G.name || 'Goal')}</h3>
            ${row('Progress',`${money(G.current)} of ${money(G.target)}`)}
          </div>
        `
        : ''
    }

    ${
      s.scratchpad
        ? `
          <div class="card">
            <h3>Pending / Uncleared Scratchpad</h3>
            <pre>${esc(s.scratchpad)}</pre>
          </div>
        `
        : ''
    }

  `;
}


/* ---------- Analysis helpers ---------- */

const PAL = ['#2563eb','#111827','#d97706','#64748b','#0d9488'];
const GREY = '#d1d5db';

const pct = (v, d) => d > 0 ? (v / d * 100).toFixed(1) + '%' : '—';

const ts = (d) => +new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));

/* lighten (t > 0) or darken (t < 0) a hex color: flat shades, no gradients */
const mix = (h, t) =>
  '#' + [1,3,5].map((i) => {
    const v = parseInt(h.slice(i, i + 2), 16);
    return Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t)
      .toString(16).padStart(2, '0');
  }).join('');

const pn = (cls, title, tag, body) => `
  <section class="pn ${cls}">
    <h3><span>${title}</span><em>${tag || ''}</em></h3>
    ${body}
  </section>`;

/* extruded block: x,y = front bottom-left, h up, depth d drawn up and to the right */
const box = (x, y, w, h, d, c, i = 0) => {

  if (h < .5 || w < .5) return '';

  const ox = d * .6, oy = d * .45;

  const p = (a) => a.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');

  return `
    <g class="rise" style="animation-delay:${i * 60}ms">
      <polygon points="${p([[x,y],[x+w,y],[x+w,y-h],[x,y-h]])}" fill="${c}"/>
      <polygon points="${p([[x,y-h],[x+ox,y-h-oy],[x+w+ox,y-h-oy],[x+w,y-h]])}" fill="${mix(c,.35)}"/>
      <polygon points="${p([[x+w,y],[x+w+ox,y-oy],[x+w+ox,y-h-oy],[x+w,y-h]])}" fill="${mix(c,-.3)}"/>
    </g>`;
};

/* one horizontal extruded bar, split into parts */
const hbar = (parts, total, i0 = 0, h = 14) => {

  let x = 0;

  return `<svg class="hb" viewBox="0 0 300 ${h + 10}" aria-hidden="true">` +
    parts.filter((p) => p[1] > 0).map((p, i) => {
      const w = p[1] / (total || 1) * 280;
      const b = box(x, h + 6, w, h, 10, p[2], i0 + i);
      x += w;
      return b;
    }).join('') + '</svg>';
};

const legend = (parts, denom) => `
  <table class="lg">
    <tbody>
      ${parts.filter((p) => p[1] > 0).map((p) => `
        <tr>
          <td><i class="sw" style="--c:${p[2]}"></i>${p[0]}</td>
          <td class="r">${money(p[1])}</td>
          <td class="r mut">${pct(p[1], denom)}</td>
        </tr>`).join('')}
    </tbody>
  </table>`;


/* ---------- Analysis tab ---------- */

function renderAna(s) {

  const T = s.totals || {};
  const E = s.entries || {};
  const G = s.goal || {};
  const R = s.reconciliation || {};
  const se = s.session || {};

  const exps = [
    ...list(E.outOfPocket),
    ...list(E.bankInitiated)
  ];

  const income = n(T.spendableIncome);
  const net = n(T.trueNetRevenue);

  const spent =
    n(T.totalExpenses) +
    n(T.estGas) +
    n(T.estGroceries);

  const rc = [R.bank,R.grocery]
    .filter((r) => r && r.reconciled).length;


  /* Header band */

  const band = `
    <section class="band c12">
      <div class="net">
        <small>True net revenue</small>
        <b class="${net < 0 ? 'neg' : ''}">${money(net)}</b>
        <span>${pct(spent, income)} of ${money(income)} income spent</span>
      </div>

      ${[
        ['Burn / day',T.burnPerDay == null ? '—' : money(T.burnPerDay)],
        ['Days',se.days ?? '—'],
        ['Transactions',exps.length],
        ['Reconciled',rc + '/2']
      ].map((k) => `<div class="k"><small>${k[0]}</small><b>${esc(k[1])}</b></div>`).join('')}
    </section>`;


  /* Where it went: stacked tower, dashed outline = income */

  const parts = [
    ['Out of pocket',n(T.outOfPocket),PAL[0]],
    ['Bank initiated',n(T.bankInitiated),PAL[1]],
    ['Gas',n(T.estGas),PAL[2]],
    ['Groceries',n(T.estGroceries),PAL[3]],
    ['Remaining',Math.max(0,income-spent),PAL[4]]
  ].filter((p) => p[1] > 0);

  let tower = '<p class="note">No data.</p>';

  if (parts.length) {

    const TX = 24, TW = 110, TD = 70, FY = 300, TH = 230;
    const OX = TD * .6, OY = TD * .45;
    const k = TH / Math.max(income, spent, 1);

    let acc = 0;
    const mids = [];

    const slabs = parts.map((p,i) => {
      const h = p[1] * k;
      mids.push(FY - acc - h / 2);
      const b = box(TX, FY - acc, TW, h, TD, p[2], i);
      acc += h;
      return b;
    }).join('');

    const a = FY - income * k;

    const cage = income > 0
      ? `<path class="cage" d="M${TX} ${FY} V${a} H${TX+TW} V${FY} M${TX} ${a} L${TX+OX} ${a-OY} H${TX+TW+OX} L${TX+TW} ${a} M${TX+TW+OX} ${a-OY} V${FY-OY}"/>`
      : '';

    const labels = parts.map((_, j) => {
      const i = parts.length - 1 - j;
      const p = parts[i];
      const ly = 34 + j * 54;
      const px = TX + TW + OX / 2;
      const py = mids[i] - OY / 2;
      return `
        <path class="ld" d="M${px.toFixed(1)} ${py.toFixed(1)} L228 ${ly}"/>
        <rect x="232" y="${ly - 4}" width="9" height="9" fill="${p[2]}"/>
        <text class="b" x="248" y="${ly + 5}">${p[0]}</text>
        <text class="m" x="248" y="${ly + 22}">${money(p[1])}  ·  ${pct(p[1], Math.max(income, spent))}</text>`;
    }).join('');

    tower = `
      <svg class="ch" viewBox="0 0 470 316" role="img" aria-label="Spending breakdown, ${money(spent)} spent of ${money(income)} income">
        <line class="ax" x1="8" x2="462" y1="${FY}" y2="${FY}"/>
        ${slabs}
        ${cage}
        ${labels}
      </svg>
      <p class="note">Block height is proportional to dollars. The dashed outline marks income.</p>`;
  }

  const where = pn('c5', 'Where it went', 'spent ' + pct(spent, income), tower);


  /* Daily spend: extruded columns on a floor plane */

  const byDay = {};

  exps.forEach((e) => {
    if (DAY.test(e.date)) {
      byDay[e.date] = (byDay[e.date] || 0) + Math.max(0, n(e.amount));
    }
  });

  const days = Object.keys(byDay).sort();

  let cols = '<p class="note">No dated expenses.</p>';
  let tag = '';

  if (days.length) {

    const X0 = 56, X1 = 596, Y1 = 262, H = 190, FOX = 24, FOY = 18, YB = Y1 - 6;
    const t0 = ts(days[0]);
    const N = Math.round((ts(days[days.length-1]) - t0) / 864e5) + 1;
    const spread = N <= 120;
    const slots = spread ? N : days.length;
    const sw = (X1 - X0) / slots;
    const bw = Math.min(sw * .62, 40);
    const mx = Math.max(...days.map((d) => byDay[d])) || 1;
    const peak = days.find((d) => byDay[d] === mx);

    const grid = [0,1,2,3,4].map((g) => {
      const y = YB - g / 4 * H;
      return `
        <line class="${g ? 'gl' : 'ax'}" x1="${X0}" x2="${X1 + FOX}" y1="${y}" y2="${y}"/>
        <text class="m" x="${X0 - 8}" y="${y + 4}" text-anchor="end">$${Math.round(mx * g / 4).toLocaleString('en-US')}</text>`;
    }).join('');

    const bars = days.map((d,i) => {
      const idx = spread ? Math.round((ts(d) - t0) / 864e5) : i;
      return box(X0 + idx * sw + (sw - bw) / 2, YB, bw, byDay[d] / mx * H, 16, d === peak ? PAL[1] : PAL[0], i);
    }).join('');

    cols = `
      <svg class="ch" viewBox="0 0 640 290" role="img" aria-label="Daily spending, peak ${money(mx)} on ${day(peak)}">
        <polygon class="fl" points="${X0},${Y1} ${X1},${Y1} ${X1 + FOX},${Y1 - FOY} ${X0 + FOX},${Y1 - FOY}"/>
        ${grid}
        ${bars}
        <text class="m" x="${X0}" y="${Y1 + 18}">${day(days[0])}</text>
        ${days.length > 1 ? `<text class="m" x="${X1}" y="${Y1 + 18}" text-anchor="end">${day(days[days.length-1])}</text>` : ''}
      </svg>
      <p class="note">Spend per day. The darkest column is the peak, ${money(mx)} on ${day(peak)}.</p>`;

    tag = `${days.length} ${days.length === 1 ? 'day' : 'days'} logged`;
  }

  const daily = pn('c7', 'Daily spend', tag, cols);


  /* Biggest expenses: extruded bars */

  const top = exps
    .filter((e) => n(e.amount) > 0)
    .sort((a,b) => n(b.amount)-n(a.amount))
    .slice(0,5);

  const mxe = n(top[0]?.amount) || 1;

  const biggest = pn('c7', 'Biggest expenses', `top ${top.length} of ${exps.length}`,
    top.length
      ? top.map((e,i) => `
          <div class="er">
            <span class="nm">${esc(e.name)}</span>
            ${hbar([[n(e.amount), i ? PAL[0] : PAL[1]]], mxe, i)}
            <b>${money(e.amount)}</b>
          </div>`).join('')
      : '<p class="note">No expenses logged.</p>'
  );


  /* Paid vs owed, goal */

  const paid = sum(exps.filter((e) => e.status === 'PAID'), (e) => e.amount);
  const owed = sum(exps.filter((e) => e.status === 'UNPAID'), (e) => e.amount);

  const pv = [['Paid',paid,PAL[4]],['Still owed',owed,PAL[2]]];

  const status = pn('', 'Paid vs still owed', money(paid + owed) + ' total',
    paid + owed > 0
      ? hbar(pv, paid + owed, 0, 24) + legend(pv, paid + owed)
      : '<p class="note">No payment status logged.</p>'
  );

  const cur = n(G.current), tgt = n(G.target);

  const goal = tgt > 0
    ? pn('', `Σ ${esc(G.name || 'Goal')}`, pct(cur, tgt),
        hbar([[cur,PAL[4]],[Math.max(0,tgt-cur),GREY]], Math.max(tgt,cur), 0, 24) +
        `<p class="note">${money(cur)} of ${money(tgt)}</p>`)
    : '';


  /* Render analysis */

  $('p-ana').innerHTML = `
    <div class="ana">
      ${band}
      ${where}
      ${daily}
      ${biggest}
      <div class="c5 stk">${status}${goal}</div>
    </div>`;
}


/* ---------- Application state ---------- */

let sessions = [];
let curId = null;
let tab = 'data';
let unsub = null;

const cur = () =>
  sessions.find((s) => s.id === curId) || null;


function paint() {

  const s = cur();

  if (!s) return;

  if (tab === 'data') {
    $('p-data').innerHTML = renderData(s);
  } else {
    renderAna(s);
  }
}


function show(t) {

  tab = t;

  ['data','ana'].forEach((k) => {

    $('t-' + k).setAttribute(
      'aria-selected',
      String(k === t)
    );

    $('t-' + k).tabIndex =
      k === t ? 0 : -1;

    $('p-' + k).hidden =
      k !== t;
  });

  paint();
}


/* ---------- Tab interactions ---------- */

$('t-data').addEventListener('click',() => show('data'));

$('t-ana').addEventListener('click',() => show('ana'));

document.querySelector('.tabs').addEventListener('keydown',(e) => {

  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
    return;
  }

  const t = tab === 'data' ? 'ana' : 'data';

  show(t);

  $('t-' + t).focus();
});


/* ---------- Session selector ---------- */

$('pick').addEventListener('change',(e) => {

  curId = e.target.value;

  paint();
});


/* ---------- Google authentication ---------- */

$('in').addEventListener('click',async () => {

  $('err').textContent = '';

  try {

    await signInWithPopup(
      auth,
      new GoogleAuthProvider()
    );

  } catch (err) {

    console.error(err);

    $('err').textContent = 'Sign-in failed.';
  }
});


$('out').addEventListener('click',() => {

  signOut(auth).catch((err) => {
    console.error('Sign-out failed:',err);
  });

});


/* ---------- Firebase authentication state ---------- */

onAuthStateChanged(auth,(u) => {

  /* Stop previous listener */

  if (unsub) {
    unsub();
    unsub = null;
  }

  /* Reset session state */

  sessions = [];
  curId = null;

  $('signin').hidden = !!u;
  $('who').hidden = !u;
  $('main').hidden = true;

  $('msg').textContent =
    u ? 'Loading your sessions…' : '';

  if (!u) return;

  $('email').textContent = u.email || '';


  /* ---------- Live Firestore session retrieval ---------- */

  const sessionsRef = collection(
    db,
    'users',
    u.uid,
    'sessions'
  );

  const sessionsQuery = query(
    sessionsRef,
    orderBy('savedAt','desc')
  );


  /* Subscribe to live updates */

  unsub = onSnapshot(
    sessionsQuery,

    (snap) => {

      sessions = snap.docs.map((d) => ({
        id:d.id,
        ...d.data()
      }));

      /* Preserve selected session when possible */

      if (!sessions.some((s) => s.id === curId)) {
        curId = sessions[0]?.id ?? null;
      }

      /* Empty-state message */

      $('msg').textContent = sessions.length
        ? ''
        : 'No sessions yet. Tap Σ SUM in FINTECH to send one.';

      $('main').hidden = !sessions.length;


      /* Populate session selector */

      $('pick').innerHTML = sessions.map((s) => `
        <option
          value="${esc(s.id)}"
          ${s.id === curId ? 'selected' : ''}>
          ${esc(label(s))}
        </option>
      `).join('');


      /* Render selected session */

      paint();

    },

    (err) => {

      console.error('Firestore read error:',err);

      $('main').hidden = true;

      $('msg').textContent =
        "Couldn't load your sessions. Check your connection and sign in again.";

    }
  );

});

</script>
