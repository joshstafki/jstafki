<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f1a'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='white' font-family='sans-serif'%3EΣ%3C/text%3E%3C/svg%3E">

<style>
:root {
  --ink:#0b0f1a;
  --mut:#6b7280;
  --line:#e5e7eb;
  --c1:#2563eb;
  --c2:#111827;
  --c3:#d97706;
  --c4:#64748b;
  --c5:#0d9488;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#fff;
  color:var(--ink);
  padding:env(safe-area-inset-top) 16px calc(48px + env(safe-area-inset-bottom));
}

.wrap {
  max-width:720px;
  margin:0 auto;
}

[hidden] {
  display:none!important;
}

.sr {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
}

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 0 6px;
}

.mark {
  display:flex;
  align-items:baseline;
  gap:.18em;
  font-weight:800;
  font-size:2rem;
  letter-spacing:.04em;
  line-height:1;
}

.who {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  font-size:.8rem;
  color:var(--mut);
}

.who span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.link {
  min-height:44px;
  padding:0 6px;
  border:0;
  background:none;
  font:inherit;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
}

#signin {
  text-align:center;
  padding:18vh 0 0;
}

#signin .mark {
  justify-content:center;
  font-size:4.5rem;
}

#signin p {
  margin:14px auto 26px;
  max-width:300px;
  color:var(--mut);
}

.go {
  min-height:48px;
  padding:0 24px;
  border:0;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

#err,#msg {
  margin-top:16px;
  text-align:center;
  color:var(--mut);
}

.pick {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:6px;
}

.pick label {
  font-size:1.6rem;
  font-weight:800;
  line-height:1;
}

.pick select {
  flex:1;
  min-width:0;
  min-height:44px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font:inherit;
}

.tabs {
  position:sticky;
  top:0;
  z-index:5;
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:10px;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.tabs button {
  min-height:48px;
  border:0;
  border-bottom:3px solid transparent;
  background:none;
  font:inherit;
  font-weight:700;
  color:var(--mut);
  cursor:pointer;
}

.tabs button[aria-selected=true] {
  color:var(--ink);
  border-bottom-color:var(--ink);
}

.card {
  margin-top:14px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.card h3 {
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  background:#f9fafb;
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--mut);
}

.row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:.92rem;
}

.row:last-child {
  border-bottom:0;
}

.neg {
  color:#dc2626;
}

.scroll {
  overflow-x:auto;
}

table {
  width:100%;
  min-width:300px;
  border-collapse:collapse;
}

th,td {
  padding:10px 14px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:.92rem;
}

th {
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--mut);
}

tbody tr:last-child td {
  border-bottom:0;
}

tfoot td {
  background:#f9fafb;
  font-weight:700;
}

tfoot tr:last-child td {
  border-bottom:0;
}

.r {
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.mut {
  color:var(--mut);
}

.badge {
  display:inline-block;
  padding:2px 9px;
  border-radius:999px;
  font-size:.7rem;
  font-weight:700;
}

.ok {
  background:#d1fae5;
  color:#065f46;
}

.no {
  background:#fee2e2;
  color:#991b1b;
}

pre {
  padding:14px;
  white-space:pre-wrap;
  word-break:break-word;
  font:inherit;
  font-size:.92rem;
}

.dk {
  margin-top:14px;
  border:1px solid var(--ink);
  border-radius:2px;
  background:#fff;
  font-family:var(--mono);
}

.dk h3 {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:8px 12px;
  border-bottom:1px solid var(--ink);
  font-size:.72rem;
  font-weight:600;
}

.dk h3 em {
  font-style:normal;
  font-weight:400;
  color:var(--mut);
}

.bd {
  padding:14px 12px;
}

.big {
  font-size:2rem;
  font-weight:600;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}

.cap {
  margin:4px 0 12px;
  font-size:.72rem;
  color:var(--mut);
}

.gauge {
  position:relative;
  height:14px;
  border:1px solid var(--ink);
}

.gauge::after {
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#fff calc(25% - 1px) 25%);
}

.ticks {
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  font-size:.65rem;
  color:var(--mut);
}

.kp {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  border:1px solid var(--line);
  background:var(--line);
}

.kp div {
  padding:10px;
  background:#fff;
}

.kp small {
  display:block;
  font-size:.68rem;
  color:var(--mut);
}

.kp b {
  font-size:1.2rem;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.stack {
  display:flex;
  gap:2px;
  height:18px;
}

.seg {
  display:block;
  width:0;
  min-width:0;
  background:var(--c);
  transition:width .5s ease-out;
}

.lg {
  min-width:0;
  margin-top:12px;
}

.lg td {
  padding:6px 0;
  font-size:.78rem;
}

.lg tr:last-child td {
  border-bottom:0;
}

.sw {
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:8px;
  background:var(--c);
}

.rw+.rw {
  margin-top:12px;
}

.rl {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:5px;
  font-size:.8rem;
  font-variant-numeric:tabular-nums;
}

.rl span {
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.bar {
  height:8px;
  background:#eef0f3;
}

.fill {
  display:block;
  width:0;
  height:100%;
  background:var(--c,var(--c1));
  transition:width .5s ease-out;
}

.area {
  display:block;
  width:100%;
  max-width:520px;
}

.area text {
  font:9px var(--mono);
  fill:var(--mut);
}

.area .gl {
  stroke:var(--line);
  stroke-width:1;
}

.area .ax {
  stroke:var(--ink);
  stroke-width:1;
}

@media (prefers-reduced-motion:reduce) {
  .seg,.fill {
    transition:none;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="top">
  <div class="mark" aria-label="Sigma AGG">
    <span>Σ</span><span>AGG</span>
  </div>

  <div class="who" id="who" hidden>
    <span id="email"></span>
    <button type="button" class="link" id="out">Sign out</button>
  </div>
</header>

<section id="signin" hidden>
  <div class="mark" aria-hidden="true">
    <span>Σ</span><span>AGG</span>
  </div>

  <p>Sign in with the Google account you use for FINTECH.</p>

  <button type="button" class="go" id="in">
    Sign in with Google
  </button>

  <div id="err" role="alert"></div>
</section>

<div id="msg" role="status"></div>

<main id="main" hidden>

  <div class="pick">
    <label for="pick">
      <span aria-hidden="true">Σ</span>
      <span class="sr">Session</span>
    </label>
    <select id="pick"></select>
  </div>

  <div class="tabs" role="tablist" aria-label="Session views">
    <button
      type="button"
      role="tab"
      id="t-data"
      aria-selected="true"
      aria-controls="p-data">
      Session Data
    </button>

    <button
      type="button"
      role="tab"
      id="t-ana"
      aria-selected="false"
      aria-controls="p-ana"
      tabindex="-1">
      Analysis
    </button>
  </div>

  <section id="p-data" role="tabpanel" aria-labelledby="t-data"></section>
  <section id="p-ana" role="tabpanel" aria-labelledby="t-ana" hidden></section>

</main>
</div>

<script type="module">

/* ---------- Firebase imports ---------- */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* ---------- Firebase configuration ---------- */

const app = initializeApp({
  apiKey: "AIzaSyCy-TtJUv-lqhNd_aiadEoiLSveYSTatVA",
  authDomain: "fintech-dashboard-ff65f.firebaseapp.com",
  projectId: "fintech-dashboard-ff65f",
  storageBucket: "fintech-dashboard-ff65f.firebasestorage.app",
  messagingSenderId: "447875559759",
  appId: "1:447875559759:web:93cd3a61024ed62336953a"
});

const db = getFirestore(app);
const auth = getAuth(app);


/* ---------- Helpers ---------- */

const $ = (id) => document.getElementById(id);

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

const n = (v) => Number.isFinite(+v) ? +v : 0;

const money = (v) =>
  (n(v) < 0 ? '-' : '') +
  '$' +
  Math.abs(n(v)).toLocaleString('en-US', {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const DAY = /^\d{4}-\d{2}-\d{2}$/;

const fmt = (d) =>
  d.toLocaleDateString('en-US', {
    month:'short',
    day:'numeric',
    year:'numeric'
  });

const day = (s) =>
  DAY.test(s)
    ? fmt(new Date(
        +s.slice(0,4),
        +s.slice(5,7)-1,
        +s.slice(8,10)
      ))
    : '—';

const list = (a) => Array.isArray(a) ? a : [];

const sum = (a, f = (x) => x) =>
  a.reduce((t,x) => t + n(f(x)), 0);

const badge = (s) =>
  s
    ? `<span class="badge ${s === 'PAID' ? 'ok' : 'no'}">${esc(s)}</span>`
    : '';

const saved = (s) =>
  s.savedAt?.toDate
    ? fmt(s.savedAt.toDate())
    : '—';

const label = (s) =>
  DAY.test(s.session?.start) && DAY.test(s.session?.end)
    ? `${day(s.session.start)} – ${day(s.session.end)}`
    : `Undated · saved ${saved(s)}`;


/* ---------- Table helper ---------- */

const tbl = (title, head, body, foot) => `
<div class="card">
  <h3>${title}</h3>
  <div class="scroll">
    <table>
      <thead>
        <tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr>
      </thead>

      <tbody>
        ${body || `<tr><td class="mut" colspan="${head.length}">None</td></tr>`}
      </tbody>

      ${foot || ''}
    </table>
  </div>
</div>`;


/* ---------- Session Data tab ---------- */

function renderData(s) {

  const T = s.totals || {};
  const E = s.entries || {};
  const R = s.reconciliation || {};
  const G = s.goal || {};
  const se = s.session || {};

  const row = (k,v,neg) => `
    <div class="row">
      <span>${k}</span>
      <b${neg && n(v) < 0 ? ' class="neg"' : ''}>${v}</b>
    </div>`;

  const exp = (title, rows) => {

    rows = list(rows);

    return tbl(
      title,
      ['Date','Name','Amount','Status'],

      rows.map((r) => `
        <tr>
          <td>${day(r.date)}</td>
          <td>${esc(r.name)}</td>
          <td class="r">${money(r.amount)}</td>
          <td>${badge(r.status)}</td>
        </tr>
      `).join(''),

      `<tfoot>
        <tr>
          <td colspan="2">Σ Total</td>
          <td class="r">${money(sum(rows,(r) => r.amount))}</td>
          <td></td>
        </tr>
      </tfoot>`
    );
  };

  const rec = (title, rows, r = {}) =>
    tbl(
      title,
      ['Name','Deducted'],

      list(rows).map((x) => `
        <tr>
          <td>${esc(x.name)}</td>
          <td class="r">-${money(Math.abs(n(x.amount)))}</td>
        </tr>
      `).join(''),

      `<tfoot>
        <tr>
          <td>Starting balance</td>
          <td class="r">${money(r.startingBalance)}</td>
        </tr>

        <tr>
          <td>
            Ending balance
            <span class="badge ${r.reconciled ? 'ok' : 'no'}">
              ${r.reconciled ? 'RECONCILED' : 'NOT RECONCILED'}
            </span>
          </td>
          <td class="r">${money(r.endingBalance)}</td>
        </tr>
      </tfoot>`
    );

  const fills = list(E.fillUps);

  return `

    <div class="card">
      <h3>Σ Session</h3>
      ${row('Dates',esc(label(s)))}
      ${row('Length',se.days ? se.days + (se.days === 1 ? ' day' : ' days') : '—')}
      ${row('Saved',saved(s))}
    </div>

    <div class="card">
      <h3>Summary</h3>
      ${row('Total Spendable Income',money(T.spendableIncome))}
      ${row('Out of Pocket',money(T.outOfPocket))}
      ${row('Bank Initiated',money(T.bankInitiated))}
      ${row('Est. Gas',money(T.estGas))}
      ${row('Est. Groceries',money(T.estGroceries))}
      ${row('Actual Total Revenue',money(T.actualRevenue),1)}
      ${row('True Net Revenue',money(T.trueNetRevenue),1)}
      ${row('Burn per Day',T.burnPerDay == null ? '—' : money(T.burnPerDay))}
    </div>

    ${exp('Out of Pocket Expenses',E.outOfPocket)}

    ${exp('Bank Initiated Expenses',E.bankInitiated)}

    ${tbl(
      'Fill Ups',
      ['Date','Name','Status'],
      fills.map((r) => `
        <tr>
          <td>${day(r.date)}</td>
          <td>${esc(r.name)}</td>
          <td>${badge(r.status)}</td>
        </tr>
      `).join('')
    )}

    ${rec('Bank Reconciliation',E.bankReconciliation,R.bank)}

    ${rec('Grocery Budget',E.groceryBudget,R.grocery)}

    ${
      n(G.target) > 0 || G.name
        ? `
          <div class="card">
            <h3>Σ ${esc(G.name || 'Goal')}</h3>
            ${row('Progress',`${money(G.current)} of ${money(G.target)}`)}
          </div>
        `
        : ''
    }

    ${
      s.scratchpad
        ? `
          <div class="card">
            <h3>Pending / Uncleared Scratchpad</h3>
            <pre>${esc(s.scratchpad)}</pre>
          </div>
        `
        : ''
    }

  `;
}


/* ---------- Analysis helpers ---------- */

const pct = (v, d) => d > 0 ? (v / d * 100).toFixed(1) + '%' : '—';

const ts = (d) => +new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));

const pn = (title, tag, body) => `
  <div class="dk">
    <h3><span>${title}</span><em>${tag || ''}</em></h3>
    <div class="bd">${body}</div>
  </div>`;

const gauge = (frac, c) => `
  <div class="gauge">
    <i class="fill" style="--c:${c}" data-w="${(Math.min(Math.max(frac,0),1) * 100).toFixed(1)}%"></i>
  </div>
  <div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100%</span></div>`;

const stack = (parts, denom) => {

  parts = parts.filter((p) => p[1] > 0);

  if (!parts.length) {
    return '<p class="cap">No data.</p>';
  }

  return `
    <div class="stack">
      ${parts.map((p) => `<i class="seg" style="--c:${p[2]}" data-w="${(p[1] / (denom || 1) * 100).toFixed(2)}%"></i>`).join('')}
    </div>

    <table class="lg">
      <tbody>
        ${parts.map((p) => `
          <tr>
            <td><i class="sw" style="--c:${p[2]}"></i>${p[0]}</td>
            <td class="r">${money(p[1])}</td>
            <td class="r mut">${pct(p[1], denom)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
};


/* ---------- Analysis tab ---------- */

function renderAna(s) {

  const T = s.totals || {};
  const E = s.entries || {};
  const G = s.goal || {};
  const R = s.reconciliation || {};
  const se = s.session || {};

  const exps = [
    ...list(E.outOfPocket),
    ...list(E.bankInitiated)
  ];

  const income = n(T.spendableIncome);
  const net = n(T.trueNetRevenue);

  const spent =
    n(T.totalExpenses) +
    n(T.estGas) +
    n(T.estGroceries);

  const share = income > 0 ? spent / income : 0;


  /* Net position */

  const hero = pn('Net position', 'spent / income', `
    <div class="big${net < 0 ? ' neg' : ''}">${money(net)}</div>
    <div class="cap">True net revenue</div>
    ${gauge(share, share > 1 ? '#b91c1c' : 'var(--c1)')}
    <div class="cap" style="margin:10px 0 0">${(share * 100).toFixed(1)}% spent: ${money(spent)} of ${money(income)}</div>
  `);


  /* Key figures */

  const rc = [R.bank,R.grocery]
    .filter((r) => r && r.reconciled).length;

  const kpis = pn('Key figures', '', `
    <div class="kp">
      ${[
        ['Burn / day',T.burnPerDay == null ? '—' : money(T.burnPerDay)],
        ['Days',se.days ?? '—'],
        ['Transactions',exps.length],
        ['Reconciled',rc + '/2']
      ].map((k) => `<div><small>${k[0]}</small><b>${esc(k[1])}</b></div>`).join('')}
    </div>
  `);


  /* Where it went */

  const parts = [
    ['Out of pocket',n(T.outOfPocket),'var(--c1)'],
    ['Bank initiated',n(T.bankInitiated),'var(--c2)'],
    ['Gas',n(T.estGas),'var(--c3)'],
    ['Groceries',n(T.estGroceries),'var(--c4)'],
    ['Remaining',Math.max(0,income-spent),'var(--c5)']
  ];

  const where = pn('Where it went', 'share of ' + money(Math.max(income,spent)), stack(parts,Math.max(income,spent)));


  /* Biggest expenses */

  const top = exps
    .filter((e) => n(e.amount) > 0)
    .sort((a,b) => n(b.amount)-n(a.amount))
    .slice(0,5);

  const mx = n(top[0]?.amount) || 1;

  const biggest = pn('Biggest expenses', `top ${top.length} of ${exps.length}`,
    top.length
      ? top.map((e) => `
          <div class="rw">
            <div class="rl"><span>${esc(e.name)}</span><b>${money(e.amount)}</b></div>
            <div class="bar"><i class="fill" data-w="${(n(e.amount)/mx*100).toFixed(1)}%"></i></div>
          </div>`).join('')
      : '<p class="cap">No expenses logged.</p>'
  );


  /* Spending over time (cumulative, step) */

  const byDay = {};

  exps.forEach((e) => {
    if (DAY.test(e.date)) {
      byDay[e.date] = (byDay[e.date] || 0) + n(e.amount);
    }
  });

  const days = Object.keys(byDay).sort();

  let run = 0;

  const pts = days.map((d) => (run += byDay[d]));

  let trend = `<p class="cap">${pts.length ? 'All spending was logged on one day.' : 'No dated expenses.'}</p>`;

  if (pts.length > 1 && run > 0) {

    const X0 = 52, X1 = 352, Y0 = 14, Y1 = 134;
    const t0 = ts(days[0]);
    const span = ts(days[days.length-1]) - t0;
    const f = (v) => v.toFixed(1);

    const xy = pts.map((v,i) => [
      X0 + (ts(days[i]) - t0) / span * (X1 - X0),
      Y1 - v / run * (Y1 - Y0)
    ]);

    const step = xy.map((p,i) =>
      i ? `H${f(p[0])} V${f(p[1])}` : `M${f(p[0])} ${f(p[1])}`
    ).join(' ');

    const grid = [0,1,2,3,4].map((k) => {
      const y = Y1 - k / 4 * (Y1 - Y0);
      return `
        <line class="${k ? 'gl' : 'ax'}" x1="${X0}" x2="${X1}" y1="${f(y)}" y2="${f(y)}"/>
        <text x="${X0 - 6}" y="${f(y + 3)}" text-anchor="end">$${Math.round(run * k / 4).toLocaleString('en-US')}</text>`;
    }).join('');

    trend = `
      <svg class="area" viewBox="0 0 360 160" role="img" aria-label="Cumulative spending over the session, ${money(run)} total">
        ${grid}
        <path d="${step}" fill="none" stroke="var(--c1)" stroke-width="1.5"/>
        ${xy.map((p) => `<rect x="${f(p[0]-2.5)}" y="${f(p[1]-2.5)}" width="5" height="5" fill="var(--c1)"/>`).join('')}
        <text x="${X0}" y="153">${day(days[0])}</text>
        <text x="${X1}" y="153" text-anchor="end">${day(days[days.length-1])}</text>
      </svg>
    `;
  }

  const trendCard = pn('Spending over time', 'cumulative', trend);


  /* Paid vs owed */

  const paid = sum(exps.filter((e) => e.status === 'PAID'), (e) => e.amount);
  const owed = sum(exps.filter((e) => e.status === 'UNPAID'), (e) => e.amount);

  const status = pn('Paid vs still owed', '', stack([
    ['Paid',paid,'var(--c5)'],
    ['Still owed',owed,'var(--c3)']
  ],paid+owed));


  /* Goal progress */

  const goal = n(G.target) > 0
    ? pn(`Σ ${esc(G.name || 'Goal')}`, pct(n(G.current), n(G.target)), `
        <div class="rl"><span>${money(G.current)}</span><b>of ${money(G.target)}</b></div>
        ${gauge(n(G.current) / n(G.target), 'var(--c5)')}
      `)
    : '';


  /* Render analysis */

  const root = $('p-ana');

  root.innerHTML =
    hero +
    kpis +
    where +
    biggest +
    trendCard +
    status +
    goal;

  requestAnimationFrame(() =>
    requestAnimationFrame(() => {
      root.querySelectorAll('[data-w]').forEach((el) => {
        el.style.width = el.dataset.w;
      });
    })
  );
}


/* ---------- Application state ---------- */

let sessions = [];
let curId = null;
let tab = 'data';
let unsub = null;

const cur = () =>
  sessions.find((s) => s.id === curId) || null;


function paint() {

  const s = cur();

  if (!s) return;

  if (tab === 'data') {
    $('p-data').innerHTML = renderData(s);
  } else {
    renderAna(s);
  }
}


function show(t) {

  tab = t;

  ['data','ana'].forEach((k) => {

    $('t-' + k).setAttribute(
      'aria-selected',
      String(k === t)
    );

    $('t-' + k).tabIndex =
      k === t ? 0 : -1;

    $('p-' + k).hidden =
      k !== t;
  });

  paint();
}


/* ---------- Tab interactions ---------- */

$('t-data').addEventListener('click',() => show('data'));

$('t-ana').addEventListener('click',() => show('ana'));

document.querySelector('.tabs').addEventListener('keydown',(e) => {

  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
    return;
  }

  const t = tab === 'data' ? 'ana' : 'data';

  show(t);

  $('t-' + t).focus();
});


/* ---------- Session selector ---------- */

$('pick').addEventListener('change',(e) => {

  curId = e.target.value;

  paint();
});


/* ---------- Google authentication ---------- */

$('in').addEventListener('click',async () => {

  $('err').textContent = '';

  try {

    await signInWithPopup(
      auth,
      new GoogleAuthProvider()
    );

  } catch (err) {

    console.error(err);

    $('err').textContent = 'Sign-in failed.';
  }
});


$('out').addEventListener('click',() => {

  signOut(auth).catch((err) => {
    console.error('Sign-out failed:',err);
  });

});


/* ---------- Firebase authentication state ---------- */

onAuthStateChanged(auth,(u) => {

  /* Stop previous listener */

  if (unsub) {
    unsub();
    unsub = null;
  }

  /* Reset session state */

  sessions = [];
  curId = null;

  $('signin').hidden = !!u;
  $('who').hidden = !u;
  $('main').hidden = true;

  $('msg').textContent =
    u ? 'Loading your sessions…' : '';

  if (!u) return;

  $('email').textContent = u.email || '';


  /* ---------- Live Firestore session retrieval ---------- */

  const sessionsRef = collection(
    db,
    'users',
    u.uid,
    'sessions'
  );

  const sessionsQuery = query(
    sessionsRef,
    orderBy('savedAt','desc')
  );


  /* Subscribe to live updates */

  unsub = onSnapshot(
    sessionsQuery,

    (snap) => {

      sessions = snap.docs.map((d) => ({
        id:d.id,
        ...d.data()
      }));

      /* Preserve selected session when possible */

      if (!sessions.some((s) => s.id === curId)) {
        curId = sessions[0]?.id ?? null;
      }

      /* Empty-state message */

      $('msg').textContent = sessions.length
        ? ''
        : 'No sessions yet. Tap Σ SUM in FINTECH to send one.';

      $('main').hidden = !sessions.length;


      /* Populate session selector */

      $('pick').innerHTML = sessions.map((s) => `
        <option
          value="${esc(s.id)}"
          ${s.id === curId ? 'selected' : ''}>
          ${esc(label(s))}
        </option>
      `).join('');


      /* Render selected session */

      paint();

    },

    (err) => {

      console.error('Firestore read error:',err);

      $('main').hidden = true;

      $('msg').textContent =
        "Couldn't load your sessions. Check your connection and sign in again.";

    }
  );

});

</script>
