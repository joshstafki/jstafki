# Deploys the repository's static files directly to GitHub Pages.
# No build step — this just packages what's already in the repo and ships it.

name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # lets you manually trigger a deploy from the Actions tab

# Only one deployment runs at a time; new pushes queue cleanly behind it
# instead of piling up as separate competing deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # deploys the whole repo as-is — change this if your site lives in a subfolder, e.g. './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
