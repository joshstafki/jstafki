<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Montserrat:wght@400&display=swap" rel="stylesheet">
<title>Premiere — A Countdown for Every Premiere</title>
<meta name="description" content="Track every movie release with a live countdown. Add a title, a date, and a poster — Premiere handles the rest." />
<link rel="icon" type="image/png" href="https://www.jstafki.com/assets/prem.png">
<link rel="apple-touch-icon" href="">
<link rel="icon" type="image/png" href="/assets/main/monolith.png" />

<!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, etc.) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Premiere — A Countdown for Every Premiere" />
<meta property="og:description" content="Track every movie release with a live countdown. Add a title, a date, and a poster — Premiere handles the rest." />
<meta property="og:image" content="https://www.jstafki.com/assets/premiere/IMG_5730.png"/>
<meta property="og:url" content="https://www.jstafki.com/projects/premiere/" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Premiere — A Countdown for Every Premiere" />
<meta name="twitter:description" content="Track every movie release with a live countdown. Add a title, a date, and a poster — Premiere handles the rest." />
<meta name="twitter:image" content="" />
<style>
  :root{
    --red:#e3121b;
    --tw:clamp(128px,36vw,230px);
    --th:clamp(66px,10.5vh,112px);
    --pw:clamp(200px,18vw,340px);
    --ease:cubic-bezier(.62,0,.3,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0a0a0b;-webkit-text-size-adjust:100%}
  .stage{
    position:fixed;inset:0;height:100vh;height:100dvh;
    overflow:hidden;perspective:1400px;background:#0a0a0b;
  }
  /* ---------- WALL ---------- */
  .wall{
    position:absolute;left:-12%;right:-12%;top:-2%;height:80%;
    transform:rotateY(-5deg);transform-origin:50% 50%;
  }
  /* one vertical panel = one clipped window onto the full wall artwork */
  .panel{
    position:absolute;top:0;height:100%;overflow:hidden;
    isolation:isolate;contain:layout paint;
    box-shadow:0 26px 40px -12px rgba(0,0,0,.85);
    transform:translate3d(0,0,0);backface-visibility:hidden;
  }
  .skin{
    position:absolute;top:0;height:100%;
    background:linear-gradient(180deg,#3b3b3e 0%,#353538 45%,#2c2c2f 100%);
  }
  .panels{
    position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,
      rgba(255,255,255,.018) 0 var(--pw),
      rgba(0,0,0,.03) var(--pw) calc(var(--pw)*2),
      rgba(255,255,255,.008) calc(var(--pw)*2) calc(var(--pw)*3));
  }
  .tiles{position:absolute;inset:0}
  .tile{position:absolute;width:var(--tw);height:var(--th);display:grid;place-items:center;font-size:clamp(9.5px,2.55vw,15px)}
  .probe{position:absolute;visibility:hidden;pointer-events:none;width:var(--tw);height:var(--th)}
  .probe i{display:block;width:var(--pw);height:1px}

  .logo{
    color:var(--red);line-height:1;text-align:center;white-space:nowrap;
    text-shadow:0 .6px 0 rgba(0,0,0,.35),0 0 .6px rgba(255,40,45,.7);
    font-family:"Helvetica Neue",Arial,sans-serif;user-select:none;
  }
  .logo small{display:block;font-size:.42em;letter-spacing:.32em;font-weight:700;margin-top:.25em}
  .amc{font:900 2.15em "Arial Black",Impact,sans-serif;letter-spacing:-.03em;border:.11em solid currentColor;padding:.02em .22em;border-radius:.08em}
  .regal{font:700 1.45em Georgia,"Times New Roman",serif;letter-spacing:.28em;text-transform:uppercase;border-top:.07em solid;border-bottom:.07em solid;padding:.2em 0 .2em .28em}
  .cinemark{font-style:italic;font-weight:900;font-size:1.5em;letter-spacing:.02em;text-transform:uppercase;transform:skewX(-6deg)}
  .odeon{font-weight:800;font-size:1.6em;letter-spacing:.2em;text-transform:uppercase}
  .vue{font:800 2.4em system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.04em;text-transform:lowercase}
  .cineworld{font:700 1.55em system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.02em;text-transform:lowercase}
  .imax{font:900 2.05em Impact,"Arial Black",sans-serif;letter-spacing:.1em}
  .alamo{font:900 1.7em "Arial Black",Impact,sans-serif;letter-spacing:.04em}
  .marcus{font:700 1.6em Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
  .harkins{font:italic 700 1.75em Georgia,serif;letter-spacing:.01em}
  .showcase{font-weight:300;font-size:1.6em;letter-spacing:.24em;text-transform:uppercase}
  .hoyts{font:900 1.95em "Arial Black",Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .cinepolis{font:700 1.65em system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.01em}
  .pathe{font:700 1.85em Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
  .everyman{font:400 1.55em Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
  .landmark{font-weight:800;font-size:1.4em;letter-spacing:.12em;text-transform:uppercase}

  .seams{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,
      transparent 0 calc(var(--pw) - 3px),
      rgba(0,0,0,.55) calc(var(--pw) - 3px) calc(var(--pw) - 1.5px),
      rgba(255,255,255,.07) calc(var(--pw) - 1.5px) var(--pw));
  }
  .grain{
    position:absolute;inset:0;pointer-events:none;opacity:.42;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .mottle{
    position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.006 .012' numOctaves='4' seed='7'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
    background-size:cover;
  }
  .light{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 55% 45% at 30% 8%,rgba(255,236,214,.17),transparent 70%),
      radial-gradient(ellipse 50% 40% at 78% 12%,rgba(255,236,214,.12),transparent 70%),
      linear-gradient(180deg,transparent 55%,rgba(0,0,0,.38) 100%),
      linear-gradient(90deg,rgba(0,0,0,.35),transparent 18%,transparent 82%,rgba(0,0,0,.45));
  }

  /* ---------- FLOOR ---------- */
  .floor{
    position:absolute;left:0;right:0;bottom:0;height:23%;
    background:
      radial-gradient(ellipse 70% 60% at 50% 0%,rgba(227,18,27,.07),transparent 70%),
      linear-gradient(180deg,#0a0a0b 0%,#18181a 30%,#202022 100%);
  }
  .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:28%;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
  .floor::after{
    content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='c'><feTurbulence type='turbulence' baseFrequency='1.4' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");
  }
  .rope{position:absolute;left:0;right:0;bottom:4%;width:100%;height:70%;z-index:2}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 42%,transparent 55%,rgba(0,0,0,.6) 100%)}


  /* layering: theater (back) < brand wall < floor + stanchion (front) */
  .theater{z-index:1}
  .wall{z-index:2}
  .floor{z-index:3}
  .vignette{z-index:4}

  /* ---------- THE WALL COMES DOWN ---------- */
  .panel{will-change:transform}
  .run .panel{animation:drop 1.45s var(--ease) both}
  @keyframes drop{to{transform:translate3d(0,110%,0)}}

  /* ---------- AUDITORIUM ---------- */
  .theater{
    position:absolute;left:0;right:0;top:0;height:78%;
    display:grid;place-items:center;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%,#1a1416 0%,#0d0b0c 60%,#060506 100%);
  }

  /* ---------- THE SCREEN ---------- */
  .frame{
    position:relative;z-index:1;
    width:min(calc(100vw - 200px),calc(78vh * .86 * 2.39));
    aspect-ratio:2.39/1;
    margin-top:4%;
    padding:min(1.3vw,14px);
    background:#000;                       /* black velour masking */
    border-radius:50% / 3.5%;              /* slight curve, like a real cinema screen */
    box-shadow:0 0 0 1px #151214,0 30px 70px -10px rgba(0,0,0,.9);
  }
  .screen{
    position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
    border-radius:50% / 3.2%;
    display:grid;place-items:center;container-type:inline-size;
    background:#0b0b0d;
  }
  .screen .perf{                           /* perforated screen texture */
    position:absolute;inset:0;opacity:.55;
    background-image:radial-gradient(rgba(0,0,0,.9) .6px,transparent 1px);
    background-size:4px 4px;
  }
  .screen .grit{
    position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .screen .sheen{                          /* projector light hitting the screen */
    position:absolute;inset:0;opacity:0;
    background:
      radial-gradient(ellipse 55% 75% at 50% 50%,rgba(210,214,224,.13),rgba(160,165,175,.05) 55%,transparent 85%),
      linear-gradient(90deg,rgba(0,0,0,.35),transparent 12%,transparent 88%,rgba(0,0,0,.35));
    transition:opacity 1.2s ease-out 2.6s;
  }
  .run .screen .sheen{opacity:1}

  /* projector beam from behind the audience */
  .beam{
    position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
    filter:blur(18px);               /* blur on the parent softens the clipped edges */
    transition:opacity 1.4s ease-out 2.5s;
  }
  .beam i{position:absolute;inset:0;
    clip-path:polygon(45% 0,55% 0,88% 85%,12% 85%);
    background:linear-gradient(180deg,rgba(255,250,240,.12),rgba(255,250,240,.04) 60%,transparent 85%)}
  .run .beam{opacity:.6}

  .billing{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}
  .title{
    margin:0;
    font-family:"Playfair Display","Didot","Bodoni 72","Bodoni MT",Georgia,serif;
    font-weight:900;text-transform:uppercase;line-height:1;white-space:nowrap;
    font-size:15cqw;letter-spacing:.03em;
    color:var(--red);opacity:0;
    transition:opacity 1.1s ease-out 2.9s;
  }
  .subtitle{
    margin:.7em 0 0;
    font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;
    font-weight:400;line-height:1.2;letter-spacing:.08em;
    font-size:max(11px,2.6cqw);
    color:#e9e5e1;opacity:0;
    transition:opacity 1s ease-out 3.7s;
  }
  .run .title{opacity:1}
  .run .subtitle{opacity:.85}

  /* ---------- ENTER BUTTON ---------- */
  .go{
    position:fixed;z-index:7;
    right:calc(22px + env(safe-area-inset-right));
    bottom:calc(18vh + env(safe-area-inset-bottom));
    bottom:calc(18dvh + env(safe-area-inset-bottom));
    width:clamp(54px,15vw,68px);height:clamp(54px,15vw,68px);border-radius:50%;
    display:grid;place-items:center;text-decoration:none;
    background:radial-gradient(circle at 35% 30%,#ff4a4f 0%,#ef1520 45%,#b5000b 100%);
    box-shadow:0 0 22px rgba(255,20,30,.45),0 8px 18px rgba(0,0,0,.6);
    opacity:0;transform:scale(.8);pointer-events:none;
    transition:opacity .5s ease-out 4.4s,transform .5s cubic-bezier(.2,1.4,.4,1) 4.4s,box-shadow .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .go svg{width:42%;height:42%;display:block}
  .go path{fill:none;stroke:#0a0a0a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .run .go{opacity:1;transform:scale(1);pointer-events:auto}
  .run .go:hover{box-shadow:0 0 34px rgba(255,30,40,.75),0 8px 18px rgba(0,0,0,.6)}
  .run .go:active{transform:scale(.94);transition-delay:0s}
  .go:focus-visible{outline:2px solid #fff;outline-offset:4px}

  @media (orientation:portrait){
    :root{
      --tw:clamp(132px,40vw,230px);
      --th:clamp(70px,9.5vh,112px);
      --pw:31vw;
    }
    .tile{font-size:clamp(10.5px,2.9vw,15px)}
    .theater{height:74%}
    .wall{height:77%}
    .floor{height:27%}
    .frame{width:92vw;aspect-ratio:1.43/1;margin-top:0;padding:min(2vw,12px)}
    .title{font-size:13cqw;letter-spacing:.02em}
    .subtitle{font-size:max(12px,4.1cqw);letter-spacing:.06em;margin-top:.9em}
    .beam{filter:blur(12px)}
  }
  @media (orientation:landscape) and (max-height:520px){
    :root{--th:clamp(54px,14vh,90px)}
    .tile{font-size:clamp(9px,1.7vw,14px)}
    .frame{width:min(94vw,calc(78vh * .86 * 2.39))}
    .go{bottom:calc(5vh + env(safe-area-inset-bottom));bottom:calc(5dvh + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="theater">
    <div class="frame">
      <section class="screen">
        <div class="perf" aria-hidden="true"></div>
        <div class="grit" aria-hidden="true"></div>
        <div class="sheen" aria-hidden="true"></div>
        <div class="billing">
          <h1 class="title">Premiere</h1>
          <p class="subtitle">A countdown for every premiere</p>
        </div>
      </section>
    </div>
    <div class="beam" aria-hidden="true"><i></i></div>
  </div>
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true">
    <svg class="rope" viewBox="0 0 400 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff3b3b"/><stop offset=".45" stop-color="#d0101a"/><stop offset="1" stop-color="#5e0007"/>
        </linearGradient>
        <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#060606"/><stop offset=".55" stop-color="#2a2a2c"/><stop offset="1" stop-color="#0b0b0c"/>
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>
      <path d="M44 64 Q220 100 420 78" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="7" filter="url(#soft)"/>
      <path d="M44 34 Q220 74 420 48" fill="none" stroke="url(#velvet)" stroke-width="7" stroke-linecap="round"/>
      <path d="M44 32.5 Q220 72 420 46.5" fill="none" stroke="#ff8a8a" stroke-opacity=".35" stroke-width="1.2"/>
      <rect x="22" y="14" width="24" height="86" fill="url(#post)"/>
      <rect x="22" y="14" width="24" height="3" fill="#3a3a3d"/>
      <rect x="22" y="14" width="2" height="86" fill="#000" fill-opacity=".5"/>
    </svg>
  </div>
  <div class="vignette" aria-hidden="true"></div>
</div>

<a class="go" id="go" href="https://www.jstafki.com/premiere/videre/" aria-label="Enter Premiere">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</a>

<script>
(function(){
  var brands = [
    ['amc','AMC'],['regal','Regal'],['cinemark','Cinemark'],['odeon','Odeon'],
    ['vue','vue'],['cineworld','cineworld'],['imax','IMAX'],['alamo','ALAMO<small>DRAFTHOUSE</small>'],
    ['marcus','Marcus<small>THEATRES</small>'],['harkins','Harkins'],['showcase','Showcase'],['hoyts','Hoyts'],
    ['cinepolis','Cinépolis'],['pathe','Pathé'],['everyman','Everyman'],['landmark','Landmark<small>THEATRES</small>']
  ];
  var wall = document.getElementById('wall');
  var stage = wall.parentNode;
  var started = false, done = false;

  function build(){
    // measure the CSS-driven sizes (--tw, --th, --pw)
    var probe = document.createElement('div');
    probe.className = 'probe';
    probe.innerHTML = '<i></i>';
    wall.appendChild(probe);
    var tw = probe.offsetWidth || 160, th = probe.offsetHeight || 80;
    var pw = probe.firstChild.offsetWidth || 300;
    wall.removeChild(probe);

    var W = wall.offsetWidth, H = wall.offsetHeight;
    var S = stage.clientWidth, off = wall.offsetLeft;
    var rows = Math.min(30, Math.ceil(H / th) + 2);
    var top = (H - rows * th) / 2;
    var count = Math.ceil(W / pw);
    var n = brands.length;

    // first / last panel actually on screen, so the sweep starts at the visible left edge
    var first = 0, last = count - 1;
    while (first < count - 1 && off + (first + 1) * pw <= 0) first++;
    while (last > first && off + last * pw >= S) last--;
    var spread = S < 700 ? 0.7 : 1.0;          // total left-to-right sweep, seconds
    var step = spread / Math.max(1, last - first);
    var base = 0.6;

    var frag = document.createDocumentFragment();
    for (var p = 0; p < count; p++){
      var x0 = p * pw, x1 = x0 + pw;
      var panel = document.createElement('div');
      panel.className = 'panel';
      panel.style.left = x0 + 'px';
      panel.style.width = (pw + 1) + 'px';      // 1px overlap hides sub-pixel gaps
      var k = Math.min(last, Math.max(first, p)) - first;
      panel.style.animationDelay = (base + k * step).toFixed(3) + 's';

      var skin = document.createElement('div');
      skin.className = 'skin';
      skin.style.width = W + 'px';
      skin.style.left = (-x0) + 'px';

      var html = '';
      for (var i = 0; i < rows; i++){
        var rowX = (i % 2 ? -1.5 : -1) * tw, y = top + i * th;
        for (var c = 0; ; c++){
          var x = rowX + c * tw;
          if (x >= x1 || x >= W) break;
          if (x + tw <= x0) continue;
          var b = brands[(c * 2 + i * 5) % n];
          html += '<div class="tile" style="left:' + x + 'px;top:' + y + 'px"><span class="logo ' + b[0] + '">' + b[1] + '</span></div>';
        }
      }
      skin.innerHTML =
        '<div class="panels"></div>' +
        '<div class="tiles">' + html + '</div>' +
        '<div class="seams"></div><div class="mottle"></div><div class="grain"></div><div class="light"></div>';
      panel.appendChild(skin);
      frag.appendChild(panel);
    }
    wall.innerHTML = '';
    wall.appendChild(frag);

    // once the last panel has dropped, remove the wall entirely (frees GPU layers on mobile)
    wall.children[count - 1].addEventListener('animationend', function(){
      done = true;
      wall.style.display = 'none';
      wall.innerHTML = '';
    });
  }
  build();

  // Start once fonts are loaded so the title never swaps typeface mid-fade.
  function start(){
    if (started) return; started = true;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      document.body.classList.add('run');
    }); });
  }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(start);
    setTimeout(start, 1200);
  } else { start(); }

  // Rebuild only before the drop starts, and only on real width changes (ignores mobile toolbar show/hide).
  var lastW = window.innerWidth, timer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (started || done) return;
      if (Math.abs(window.innerWidth - lastW) < 2) return;
      lastW = window.innerWidth;
      requestAnimationFrame(build);
    }, 150);
  });
})();
</script>
</body>
</html>
