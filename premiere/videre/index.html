<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141416">

  <meta name="description" content="Track every movie release with a live countdown. Add a title, a date, and a poster — Premiere handles the rest." />

  <!-- Twitter Card -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@1.24.0"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap');

    /* ---------- Premiere palette ----------
       charcoal  #141416 / #1C1C1F / #232327
       gold      #E8B84B  (hi #F6D27A, lo #B8892A)
       text      #F2EEE6  (secondary #BDB8AF, muted #8E8A84)
    ---------------------------------------- */
    :root{
      --gold:#E8B84B; --gold-hi:#F6D27A; --gold-lo:#B8892A;
      --ink:#F2EEE6; --ink-2:#BDB8AF; --ink-3:#8E8A84;
      --bg:#141416; --card:#1C1C1F; --card-2:#232327;
      --line:rgba(242,238,230,0.09);
    }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 70% 45% at 25% -5%, rgba(255,226,170,0.10), transparent 70%),
        radial-gradient(ellipse 55% 40% at 85% -5%, rgba(255,226,170,0.06), transparent 70%),
        linear-gradient(180deg, #232326 0%, #18181a 40%, #121214 100%);
      background-attachment: fixed;
    }
    /* press-wall seams + grain, carried over from the landing page */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(90deg, transparent 0 calc(clamp(170px,48vw,340px) - 2px), rgba(0,0,0,0.3) calc(clamp(170px,48vw,340px) - 2px) calc(clamp(170px,48vw,340px) - 1px), rgba(255,255,255,0.035) calc(clamp(170px,48vw,340px) - 1px) clamp(170px,48vw,340px));
      -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.2) 55%, transparent 100%);
              mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.2) 55%, transparent 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .3; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    #app { position: relative; z-index: 1; }

    /* ---------- type ---------- */
    .pm-display { font-family: 'Playfair Display', Didot, Georgia, serif; font-weight: 900; letter-spacing: .005em; }
    .pm-body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
    .pm-stencil { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .pm-ash { color: var(--ink-2); }
    .pm-gold-text { color: var(--gold); }
    .pm-eyebrow { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: .6rem; margin: 0; }
    .pm-eyebrow::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--gold-hi), var(--gold-lo)); }

    /* ---------- header ---------- */
    .pm-header {
      position: sticky; top: 0; z-index: 30;
      background: linear-gradient(180deg, rgba(20,20,22,0.92), rgba(20,20,22,0.72));
      backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid var(--line);
    }
    .pm-wordmark {
      font-size: clamp(22px, 5vw, 28px); text-transform: uppercase; letter-spacing: .04em; line-height: 1; margin: 0;
      background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .pm-logo-badge {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
      background: linear-gradient(145deg, rgba(232,184,75,.22), rgba(232,184,75,.06));
      border: 1px solid rgba(232,184,75,.35);
    }

    /* ---------- buttons ---------- */
    .pm-btn-gold {
      background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 50%, #D9A63A 100%);
      color: #1a1408; border: none; cursor: pointer;
      box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 6px 18px -6px rgba(232,184,75,.55);
      transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
    }
    .pm-btn-gold:hover { filter: brightness(1.06); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 10px 26px -8px rgba(232,184,75,.7); }
    .pm-btn-gold:active { transform: translateY(1px) scale(.99); }
    .pm-btn-gold:disabled { background: rgba(242,238,230,0.08); color: #6f6b66; box-shadow: none; filter: none; cursor: not-allowed; }
    .pm-btn-ghost { background: rgba(242,238,230,0.03); color: var(--ink); border: 1px solid rgba(242,238,230,0.16); transition: background-color .15s ease, border-color .15s ease; cursor: pointer; }
    .pm-btn-ghost:hover { background: rgba(242,238,230,0.08); border-color: rgba(242,238,230,0.28); }
    .pm-link { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .85rem; border-radius: 9999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: rgba(242,238,230,.04); color: var(--ink-2); transition: all .15s ease; cursor: pointer; }
    .pm-link:hover { color: var(--ink); border-color: rgba(242,238,230,.25); background: rgba(242,238,230,.08); }
    .pm-link-gold { color: #1a1408 !important; border-color: transparent !important; background: linear-gradient(180deg, var(--gold-hi), var(--gold)) !important; }
    .pm-link-gold:hover { filter: brightness(1.06); }
    .pm-link-danger { color: #F6C3CA !important; border-color: rgba(220,90,105,.5) !important; background: rgba(156,46,61,.28) !important; }

    /* ---------- fields ---------- */
    .pm-field { background-color: rgba(0,0,0,0.28); border: 1px solid rgba(242,238,230,0.13); color: var(--ink); transition: border-color .15s ease, background-color .15s ease; }
    .pm-field:hover { border-color: rgba(242,238,230,0.22); }
    .pm-field:focus { outline: 3px solid rgba(232,184,75,0.22); outline-offset: 0; border-color: var(--gold); background-color: rgba(0,0,0,0.38); }
    .pm-field::placeholder { color: #75716B; }
    .pm-label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-2); display: block; margin-bottom: .45rem; }

    /* ---------- surfaces ---------- */
    .pm-panel-bg { background: linear-gradient(180deg, var(--card-2), var(--card)); }
    .pm-card {
      background: linear-gradient(180deg, rgba(38,38,42,.85), rgba(26,26,29,.85));
      border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 60px -24px rgba(0,0,0,.8);
    }
    .pm-hero-card { border-color: rgba(232,184,75,.22); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 40px 80px -30px rgba(0,0,0,.9), 0 0 80px -30px rgba(232,184,75,.25); }

    .pm-poster-frame {
      aspect-ratio: 2 / 3; border-radius: 14px;
      border: 1px solid rgba(242,238,230,0.1);
      background: linear-gradient(160deg, #2a2a2e, #18181b);
      box-shadow: 0 18px 32px -14px rgba(0,0,0,.85);
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .pm-tile { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
    .pm-tile:hover { transform: translateY(-4px); }
    .pm-tile:hover .pm-poster-frame { border-color: rgba(232,184,75,.45); box-shadow: 0 24px 40px -14px rgba(0,0,0,.9), 0 0 30px -10px rgba(232,184,75,.35); }
    .pm-tile-actions { transition: opacity .2s ease; }
    @media (hover: hover) { .pm-tile-actions { opacity: 0; } .pm-tile:hover .pm-tile-actions, .pm-tile:focus-within .pm-tile-actions { opacity: 1; } }

    .pm-icon-btn { background-color: rgba(14,14,16,0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(242,238,230,0.18); transition: background-color 0.15s ease, border-color .15s ease; cursor: pointer; }
    .pm-icon-btn:hover { background-color: rgba(14,14,16,0.96); border-color: rgba(232,184,75,.5); }

    /* ---------- countdown dial: gold ring, sans numerals ---------- */
    .pm-dial-outer {
      border-radius: 9999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: conic-gradient(from 210deg, var(--gold-hi), var(--gold) 35%, var(--gold-lo) 60%, var(--gold) 80%, var(--gold-hi));
      box-shadow: 0 10px 30px -10px rgba(232,184,75,.5), 0 0 0 1px rgba(0,0,0,.5);
    }
    .pm-dial-inner {
      border-radius: 9999px; background: radial-gradient(circle at 50% 30%, #2a2a2e, #141416 70%);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.65);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .pm-dial-lg { width: clamp(112px, 25vw, 150px); height: clamp(112px, 25vw, 150px); }
    .pm-dial-lg .pm-dial-inner { width: 88%; height: 88%; }
    .pm-dial-sm { width: 46px; height: 46px; }
    .pm-dial-sm .pm-dial-inner { width: 84%; height: 84%; }
    .pm-dial-num { color: var(--ink); line-height: 1; }
    .pm-dial-num-lg { font-size: clamp(32px, 7.5vw, 46px); }
    .pm-dial-num-sm { font-size: 12px; }
    .pm-dial-num-word { font-size: clamp(20px, 4.6vw, 26px); }

    .pm-hero-divider { border-top: 1px solid var(--line); padding-top: 1.5rem; }
    @media (min-width: 640px) { .pm-hero-divider { border-top: none; border-left: 1px solid var(--line); padding-top: 0; padding-left: 2.5rem; } }
    .pm-perf { border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(232,184,75,.3), transparent); margin: 3rem 0 1.5rem; }
    .pm-modal-backdrop { background-color: rgba(8,8,9,0.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .pm-modal { animation: pmIn .22s cubic-bezier(.2,.8,.2,1); }
    @keyframes pmIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    .pm-hero-title { font-size: clamp(26px, 5.2vw, 40px); line-height: 1.1; }
    .pm-chip { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .7rem; border-radius: 9999px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: rgba(242,238,230,.06); border: 1px solid var(--line); }

    .pm-focus-visible:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation: none !important; } }
  </style>
</head>
<body class="pm-body">

  <div id="app"></div>

  <script type="module">
    // 1. Firebase SDK Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. PASTE YOUR CONFIG HERE
    const firebaseConfig = {
    apiKey: "AIzaSyBHa2f-ThkmbzYNVKjz4XHtM87mSI2dkLI",
    authDomain: "premiere-47ace.firebaseapp.com",
    projectId: "premiere-47ace",
    storageBucket: "premiere-47ace.firebasestorage.app",
    messagingSenderId: "644651181200",
    appId: "1:644651181200:web:2ad450077763fa1483e415",
    measurementId: "G-TFF1TE9T3R"
  };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // --- State Variables ---
    let currentUser = null;
    let movies = [];
    let ready = false;
    let saveIssue = false;
    let authError = false;
    let showForm = false;
    let editingId = null;
    let imgErrors = {};
    let confirmDeleteId = null;
    let unsubscribeMovies = null;
    let legacyMovies = null; // movies found in the old single-document format, awaiting import
    let legacyChecked = false;

    // --- Auth Observers & Actions ---
    onAuthStateChanged(auth, (user) => {
      // Tear down any listener from a previous session before starting a new one
      if (unsubscribeMovies) {
        unsubscribeMovies();
        unsubscribeMovies = null;
      }
      authError = false; // clear any stale sign-in error on every auth transition

      if (user) {
        currentUser = user;
        ready = false;
        legacyChecked = false;
        legacyMovies = null;
        render();

        // Real-time listener on this user's movies subcollection.
        // Each movie is its own document, so adds/edits/deletes from any
        // device are independent writes instead of one shared array.
        const moviesRef = collection(db, "users", user.uid, "movies");
        unsubscribeMovies = onSnapshot(
          moviesRef,
          async (snapshot) => {
            movies = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
            saveIssue = false;
            ready = true;

            // One-time check for movies saved under the old single-document
            // format (from before this version). Only runs once per sign-in,
            // and only offers an import if the new subcollection is empty —
            // it will never overwrite or duplicate movies you already have here.
            if (!legacyChecked) {
              legacyChecked = true;
              if (movies.length === 0) {
                try {
                  const legacySnap = await getDoc(doc(db, "users", user.uid));
                  const legacyData = legacySnap.exists() ? legacySnap.data().movies : null;
                  if (Array.isArray(legacyData) && legacyData.length > 0) {
                    legacyMovies = legacyData;
                  }
                } catch (e) {
                  console.error("Legacy data check failed:", e);
                }
              }
            }
            render();
          },
          (error) => {
            console.error("Movies listener failed:", error);
            saveIssue = true;
            ready = true;
            render();
          }
        );
      } else {
        currentUser = null;
        movies = [];
        // Close out any open form — there's nothing to edit if you're signed out,
        // and leaving this open risks the modal referencing a movie that no
        // longer exists in `movies`.
        showForm = false;
        editingId = null;
        confirmDeleteId = null;
        legacyMovies = null;
        legacyChecked = false;
        ready = true;
        render();
      }
    });

    window.loginWithGoogle = async () => {
      authError = false;
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login failed:", error.message);
        authError = true;
        render();
      }
    };

    window.logout = async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Logout failed:", error.message);
      }
    };

    // --- Firestore Writes (each movie is its own document) ---
    async function addMovie(data) {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, "users", currentUser.uid, "movies"), data);
      } catch (e) {
        console.error("Add failed:", e);
        saveIssue = true;
        render();
      }
    }

    async function updateMovie(id, data) {
      if (!currentUser) return;
      try {
        await updateDoc(doc(db, "users", currentUser.uid, "movies", id), data);
      } catch (e) {
        console.error("Update failed:", e);
        saveIssue = true;
        render();
      }
    }

    async function removeMovie(id) {
      if (!currentUser) return;
      try {
        await deleteDoc(doc(db, "users", currentUser.uid, "movies", id));
      } catch (e) {
        console.error("Delete failed:", e);
        saveIssue = true;
        render();
      }
    }

    // --- Helper Functions ---
    function daysUntil(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const release = new Date(`${dateStr}T00:00:00`);
      return Math.round((release - today) / 86400000);
    }

    function formatDate(dateStr) {
      const d = new Date(`${dateStr}T00:00:00`);
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function formatAgo(days) {
      const n = Math.abs(days);
      if (n === 0) return 'Released today';
      if (n === 1) return 'Released yesterday';
      if (n < 7) return `Released ${n} days ago`;
      if (n < 30) {
        const w = Math.round(n / 7);
        return `Released ${w} week${w > 1 ? 's' : ''} ago`;
      }
      if (n < 365) {
        const m = Math.round(n / 30);
        return `Released ${m} month${m > 1 ? 's' : ''} ago`;
      }
      const y = Math.round(n / 365);
      return `Released ${y} year${y > 1 ? 's' : ''} ago`;
    }

    // Escapes user-supplied text before it's dropped into an HTML template
    // string. Every field that came from the Add/Edit form (title, notes,
    // posterUrl) must go through this before being interpolated anywhere.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }

    function ymd(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    // Builds a Google Calendar "quick add" link for a movie's release date.
    // This opens a pre-filled event in a new tab; the user still clicks
    // Save on Google's side, so no extra OAuth scopes are needed.
    function calendarUrl(movie) {
      const start = new Date(`${movie.releaseDate}T00:00:00`);
      const end = new Date(start);
      end.setDate(end.getDate() + 1); // all-day events use an exclusive end date

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: `${movie.title} — Release Day`,
        dates: `${ymd(start)}/${ymd(end)}`,
        details: movie.notes ? movie.notes : `Marking the release of ${movie.title}.`,
      });

      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    window.importLegacyMovies = async () => {
      if (!currentUser || !legacyMovies) return;
      const toImport = legacyMovies;
      legacyMovies = null; // hide the banner right away
      render();
      try {
        for (const m of toImport) {
          const { id, ...data } = m; // drop the old client-generated id; Firestore assigns a fresh one
          await addDoc(collection(db, "users", currentUser.uid, "movies"), data);
        }
      } catch (e) {
        console.error("Import failed:", e);
        saveIssue = true;
        render();
      }
    };

    window.dismissLegacyImport = () => {
      legacyMovies = null;
      render();
    };

    // --- UI Actions ---
    window.openAdd = () => {
      editingId = null;
      confirmDeleteId = null;
      showForm = true;
      render();
      document.getElementById('form-title')?.focus();
    };

    window.openEdit = (id) => {
      editingId = id;
      confirmDeleteId = null;
      showForm = true;
      render();
      document.getElementById('form-title')?.focus();
    };

    window.closeForm = () => {
      showForm = false;
      editingId = null;
      confirmDeleteId = null;
      render();
    };

    window.requestDelete = (id) => {
      if (confirmDeleteId === id) {
        removeMovie(id);
        confirmDeleteId = null;
        render();
      } else {
        confirmDeleteId = id;
        render();
      }
    };

    window.handleImgError = (id, el) => {
      if (!imgErrors[id]) {
        imgErrors[id] = true;
        el.style.display = 'none';
        render();
      }
    };

    // Escape closes the modal; Tab/Shift+Tab is trapped inside it.
    document.addEventListener('keydown', (e) => {
      if (!showForm) return;
      if (e.key === 'Escape') {
        closeForm();
        return;
      }
      if (e.key === 'Tab') {
        const panel = document.getElementById('pm-modal-panel');
        if (!panel) return;
        const focusable = Array.from(panel.querySelectorAll('input, textarea, button, a[href]')).filter(
          (el) => !el.disabled
        );
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });

    // --- Form Handling ---
    window.checkFormValidity = () => {
      const title = document.getElementById('form-title').value.trim();
      const date = document.getElementById('form-release').value;
      document.getElementById('form-submit-btn').disabled = !(title && date);
    };

    window.updatePreview = (val) => {
      const container = document.getElementById('poster-preview-container');
      const img = document.getElementById('poster-preview-img');
      if (val) {
        container.style.display = 'block';
        img.src = val;
        img.style.display = 'block';
      } else {
        container.style.display = 'none';
      }
    };

    window.submitOnEnter = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        window.submitForm();
      }
    };

    window.submitForm = () => {
      const title = document.getElementById('form-title').value.trim();
      const releaseDate = document.getElementById('form-release').value;
      const posterUrl = document.getElementById('form-poster').value.trim();
      const notes = document.getElementById('form-notes').value.trim();

      if (!title || !releaseDate) return;

      const cleaned = { title, releaseDate, posterUrl, notes };

      if (editingId) {
        updateMovie(editingId, cleaned);
      } else {
        addMovie(cleaned);
      }
      closeForm();
    };

    // --- Component Templates ---
    const PosterTpl = (url, alt, errored, id) => {
      if (!url || errored) {
        return `
          <div class="pm-poster-frame rounded-lg w-full flex items-center justify-center">
            <i data-lucide="clapperboard" class="w-1/4 h-1/4" style="color: rgba(232,184,75,0.45)" stroke-width="1.5"></i>
          </div>
        `;
      }
      return `<img src="${escapeHtml(url)}" alt="${escapeHtml(alt)}" onerror="handleImgError('${id}', this)" class="pm-poster-frame rounded-lg w-full object-cover" />`;
    };

    const CountdownDialTpl = (days, size) => {
      const isLg = size === 'lg';
      let label;
      if (days <= 0) label = isLg ? 'Today' : 'NOW';
      else label = isLg ? String(days) : `${days}D`;
      const showUnit = isLg && days >= 1;
      const numClass = !isLg ? 'pm-dial-num-sm' : (days <= 0 ? 'pm-dial-num-word' : 'pm-dial-num-lg');

      return `
        <div class="pm-dial-outer ${isLg ? 'pm-dial-lg' : 'pm-dial-sm'}">
          <div class="pm-dial-inner">
            <span class="pm-stencil pm-dial-num ${numClass}">
              ${label}
            </span>
            ${showUnit ? `<span class="pm-body mt-1.5" style="color: #E8B84B; font-size: 10px; font-weight: 700; letter-spacing: .16em;">${days === 1 ? 'DAY TO GO' : 'DAYS TO GO'}</span>` : ''}
          </div>
        </div>
      `;
    };

    const MovieCardTpl = (movie, days, released) => {
      const isConfirming = confirmDeleteId === movie.id;
      return `
        <div class="pm-tile">
          <div class="relative">
            ${PosterTpl(movie.posterUrl, movie.title, imgErrors[movie.id], movie.id)}
            ${!released ? `<div class="absolute -top-2 -right-2">${CountdownDialTpl(days, 'sm')}</div>` : ''}

            <div class="pm-tile-actions absolute top-2 left-2 flex gap-1">
              <button onclick="openEdit('${movie.id}')" aria-label="Edit movie" class="pm-icon-btn pm-focus-visible rounded-full w-7 h-7 flex items-center justify-center">
                <i data-lucide="pencil" class="w-3 h-3" style="color: #F2EEE6"></i>
              </button>
              ${!released ? `
              <a href="${escapeHtml(calendarUrl(movie))}" target="_blank" rel="noopener noreferrer" aria-label="Add to Google Calendar" class="pm-icon-btn pm-focus-visible rounded-full w-7 h-7 flex items-center justify-center">
                <i data-lucide="calendar-plus" class="w-3 h-3" style="color: #F2EEE6"></i>
              </a>
              ` : ''}
              <button onclick="requestDelete('${movie.id}')" aria-label="Remove movie" class="pm-icon-btn pm-focus-visible rounded-full h-7 px-2 flex items-center justify-center" style="background-color: ${isConfirming ? '#9C2E3D' : ''}">
                <i data-lucide="trash-2" class="w-3 h-3" style="color: #F2EEE6"></i>
                ${isConfirming ? `<span class="pm-body ml-1 text-xs" style="color: #F2EEE6">Sure?</span>` : ''}
              </button>
            </div>
          </div>
          <p class="pm-body mt-3 text-sm font-semibold truncate" style="color: #F2EEE6">${escapeHtml(movie.title)}</p>
          <p class="pm-body pm-ash text-xs mt-0.5">${released ? formatAgo(days) : formatDate(movie.releaseDate)}</p>
        </div>
      `;
    };

    const FormModalTpl = () => {
      if (!showForm) return '';
      const movie = editingId
        ? (movies.find((m) => m.id === editingId) || { title: '', releaseDate: '', posterUrl: '', notes: '' })
        : { title: '', releaseDate: '', posterUrl: '', notes: '' };

      return `
        <div class="pm-modal-backdrop fixed inset-0 flex items-center justify-center p-4 z-50" onclick="closeForm()">
          <div id="pm-modal-panel" role="dialog" aria-modal="true" aria-labelledby="pm-modal-title" class="pm-modal pm-panel-bg w-full max-w-md rounded-3xl p-6 sm:p-7 overflow-y-auto" style="max-height: 88vh; border: 1px solid rgba(232,184,75,0.22); box-shadow: 0 40px 80px -20px rgba(0,0,0,.9)" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-5">
              <h3 id="pm-modal-title" class="pm-display text-2xl" style="color: #F2EEE6">${editingId ? 'Edit Movie' : 'Add Movie'}</h3>
              <button onclick="closeForm()" aria-label="Close" class="pm-icon-btn pm-focus-visible rounded-full w-8 h-8 flex items-center justify-center">
                <i data-lucide="x" class="w-4 h-4 pm-ash"></i>
              </button>
            </div>

            <div class="space-y-4">
              <div>
                <label class="pm-label">Title</label>
                <input id="form-title" type="text" value="${escapeHtml(movie.title)}" oninput="checkFormValidity()" onkeydown="submitOnEnter(event)" placeholder="e.g. Dune: Part Three" class="pm-field pm-body w-full rounded-xl px-3.5 py-2.5 text-sm" />
              </div>
              <div>
                <label class="pm-label">Release Date</label>
                <input id="form-release" type="date" value="${escapeHtml(movie.releaseDate)}" oninput="checkFormValidity()" onkeydown="submitOnEnter(event)" class="pm-field pm-body w-full rounded-xl px-3.5 py-2.5 text-sm" style="color-scheme: dark" />
              </div>
              <div>
                <label class="pm-label">Poster Image URL</label>
                <input id="form-poster" type="text" value="${escapeHtml(movie.posterUrl)}" oninput="updatePreview(this.value)" onkeydown="submitOnEnter(event)" placeholder="https://…" class="pm-field pm-body w-full rounded-xl px-3.5 py-2.5 text-sm" />

                <div id="poster-preview-container" class="pm-poster-frame rounded-lg overflow-hidden mt-2" style="width: 72px; display: ${movie.posterUrl ? 'block' : 'none'}">
                  <img id="poster-preview-img" src="${escapeHtml(movie.posterUrl)}" alt="Preview" class="w-full h-full object-cover" onerror="this.style.display='none'" />
                </div>
              </div>
              <div>
                <label class="pm-label">Notes</label>
                <textarea id="form-notes" placeholder="Genre, who you're seeing it with, why you're hyped…" rows="2" class="pm-field pm-body w-full rounded-xl px-3.5 py-2.5 text-sm resize-none">${escapeHtml(movie.notes || '')}</textarea>
              </div>
            </div>

            <div class="flex gap-3 mt-6">
              <button onclick="closeForm()" class="pm-btn-ghost pm-body flex-1 rounded-full py-3 text-sm font-medium">Cancel</button>
              <button id="form-submit-btn" onclick="submitForm()" ${!movie.title || !movie.releaseDate ? 'disabled' : ''} class="pm-btn-gold pm-body flex-1 rounded-full py-3 text-sm font-semibold">
                ${editingId ? 'Save Changes' : 'Add Movie'}
              </button>
            </div>
          </div>
        </div>
      `;
    };

    // --- Main Render Loop ---
    function render() {
      const appContainer = document.getElementById('app');
      let html = '';

      const upcoming = movies
        .filter((m) => daysUntil(m.releaseDate) >= 0)
        .sort((a, b) => daysUntil(a.releaseDate) - daysUntil(b.releaseDate));

      const released = movies
        .filter((m) => daysUntil(m.releaseDate) < 0)
        .sort((a, b) => daysUntil(b.releaseDate) - daysUntil(a.releaseDate));

      const hero = upcoming[0];
      const restUpcoming = upcoming.slice(1);
      const heroDays = hero ? daysUntil(hero.releaseDate) : 0;
      const isHeroConfirming = hero && confirmDeleteId === hero.id;

      

      // Header Area (with Auth Controls)
      html += `
        <header class="pm-header">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
          <a href="https://www.jstafki.com/projects/premiere/" class="flex items-center gap-2.5 pm-focus-visible rounded-lg">
            <span class="pm-logo-badge"><i data-lucide="clapperboard" class="w-[18px] h-[18px]" style="color: #E8B84B"></i></span>
            <h1 class="pm-display pm-wordmark">Premiere</h1>
          </a>
          <div class="flex items-center gap-3 sm:gap-4">
            ${currentUser
              ? `
                <div class="flex items-center gap-3">
                  ${currentUser.photoURL ? `<img src="${escapeHtml(currentUser.photoURL)}" alt="Avatar" class="w-8 h-8 rounded-full" style="box-shadow: 0 0 0 2px #141416, 0 0 0 3px rgba(232,184,75,.55)">` : ''}
                  <button onclick="logout()" class="pm-body pm-ash text-sm font-medium hover:text-white transition-colors pm-focus-visible hidden sm:inline">Sign out</button>
                  <button onclick="logout()" aria-label="Sign out" class="pm-body pm-ash hover:text-white transition-colors pm-focus-visible sm:hidden"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
                <button onclick="openAdd()" class="pm-btn-gold pm-body flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold pm-focus-visible">
                  <i data-lucide="plus" class="w-4 h-4" stroke-width="2.5"></i> <span class="hidden sm:inline">Add Movie</span><span class="sm:hidden">Add</span>
                </button>
              `
              : `
                <button onclick="loginWithGoogle()" class="pm-btn-ghost pm-body flex items-center gap-2 rounded-full px-5 py-2 text-sm font-medium pm-focus-visible">
                  <i data-lucide="log-in" class="w-4 h-4"></i> Sign in with Google
                </button>
              `
            }
          </div>
        </div>
        </header>
      `;
      html += `<main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">`;

      // Main Content State Logic
      if (!ready) {
        html += `<div class="pm-body pm-ash text-center py-24 flex flex-col items-center gap-4"><i data-lucide="loader-circle" class="w-6 h-6 animate-spin" style="color: #E8B84B"></i>Rolling film…</div>`;
      }
      else if (!currentUser) {
        // Logged Out State
        html += `
          <div class="pm-card pm-hero-card text-center py-20 sm:py-24 px-6">
            <div class="pm-logo-badge mx-auto mb-6" style="width:64px;height:64px;border-radius:18px"><i data-lucide="ticket" class="w-7 h-7" style="color: #E8B84B"></i></div>
            <h2 class="pm-display text-3xl sm:text-4xl mb-3" style="color: #F2EEE6">Your personal watchlist</h2>
            <p class="pm-body pm-ash max-w-md mx-auto mb-8 leading-relaxed">Sign in to sync your upcoming movie hype across all your devices and never miss a release date.</p>
            ${authError ? `
              <p class="pm-body text-xs mb-5 max-w-sm mx-auto rounded-lg px-3 py-2" style="color: #F6D5DA; background-color: rgba(156,46,61,0.22); border: 1px solid rgba(220,90,105,0.45)">
                Sign-in didn't go through. Check that popups are allowed for this site and try again.
              </p>
            ` : ''}
            <button onclick="loginWithGoogle()" class="pm-btn-gold pm-body inline-flex items-center gap-2 rounded-full px-6 py-3 text-sm font-bold pm-focus-visible"><i data-lucide="log-in" class="w-4 h-4"></i>
              Sign in with Google
            </button>
          </div>
        `;
      }
      else {
        // Logged In States
        if (legacyMovies && legacyMovies.length > 0) {
          html += `
            <div class="pm-body text-xs mb-6 rounded-lg px-3 py-3 flex items-center justify-between gap-3 flex-wrap" style="color: #F2EEE6; background-color: rgba(232,184,75,0.12); border: 1px solid rgba(232,184,75,0.35)">
              <span>Found ${legacyMovies.length} movie${legacyMovies.length > 1 ? 's' : ''} from before this update — want to bring ${legacyMovies.length > 1 ? 'them' : 'it'} over?</span>
              <div class="flex gap-2">
                <button onclick="importLegacyMovies()" class="pm-btn-gold pm-body rounded-full px-3 py-1.5 text-xs font-semibold pm-focus-visible">Import</button>
                <button onclick="dismissLegacyImport()" class="pm-btn-ghost pm-body rounded-full px-3 py-1.5 text-xs pm-focus-visible">Not now</button>
              </div>
            </div>
          `;
        }

        if (saveIssue) {
          html += `
            <div class="pm-body text-xs mb-6 rounded-lg px-3 py-2" style="color: #F6D5DA; background-color: rgba(156,46,61,0.22); border: 1px solid rgba(220,90,105,0.45)">
              Changes aren't syncing to the cloud right now. Check your connection or Firestore security rules.
            </div>
          `;
        }

        if (movies.length === 0) {
          html += `
            <div class="pm-card text-center py-20 px-6">
              <div class="pm-logo-badge mx-auto mb-5" style="width:56px;height:56px;border-radius:16px"><i data-lucide="sparkles" class="w-6 h-6" style="color: #E8B84B"></i></div>
              <p class="pm-display text-3xl" style="color: #F2EEE6">No movies yet</p>
              <p class="pm-body pm-ash mt-2 mb-6">Add the next release you can't stop thinking about.</p>
              <button onclick="openAdd()" class="pm-btn-gold pm-body inline-flex items-center gap-1.5 rounded-full px-5 py-2.5 text-sm font-semibold pm-focus-visible">
                <i data-lucide="plus" class="w-4 h-4" stroke-width="2.5"></i> Add a movie
              </button>
            </div>
          `;
        } else {
          // Hero Section
          if (hero) {
            html += `
              <div class="pm-card pm-hero-card relative overflow-hidden">
                <div class="absolute inset-0">
                  ${hero.posterUrl && !imgErrors[hero.id]
                    ? `<img src="${escapeHtml(hero.posterUrl)}" alt="" class="w-full h-full object-cover blur-3xl scale-125 opacity-50" />`
                    : `<div class="w-full h-full" style="background: radial-gradient(ellipse at 20% 30%, rgba(232,184,75,.12), transparent 60%)"></div>`
                  }
                  <div class="absolute inset-0" style="background: linear-gradient(105deg, rgba(20,20,22,.55) 0%, rgba(20,20,22,.88) 45%, rgba(20,20,22,.96) 100%)"></div>
                </div>
                <div class="relative flex flex-col sm:flex-row items-center gap-7 p-6 sm:p-10">
                  <div class="flex flex-col sm:flex-row items-center gap-5 shrink-0">
                    <div style="width: clamp(104px, 24vw, 140px)">
                      ${PosterTpl(hero.posterUrl, hero.title, imgErrors[hero.id], hero.id)}
                    </div>
                    ${CountdownDialTpl(heroDays, 'lg')}
                  </div>
                  <div class="pm-hero-divider text-center sm:text-left w-full sm:flex-1">
                    <p class="pm-eyebrow mb-3">Up next</p>
                    <h2 class="pm-display pm-hero-title" style="color: #F2EEE6">${escapeHtml(hero.title)}</h2>
                    <p class="mt-3"><span class="pm-chip pm-body"><i data-lucide="calendar" class="w-3.5 h-3.5"></i>${formatDate(hero.releaseDate)}</span></p>
                    ${hero.notes ? `<p class="pm-body text-sm mt-3 mx-auto sm:mx-0" style="color: #BDB8AF; max-width: 460px; line-height: 1.6">${escapeHtml(hero.notes)}</p>` : ''}
                    <div class="flex items-center gap-2 justify-center sm:justify-start mt-6 flex-wrap">
                      <button onclick="openEdit('${hero.id}')" class="pm-link pm-body pm-focus-visible">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit
                      </button>
                      <a href="${escapeHtml(calendarUrl(hero))}" target="_blank" rel="noopener noreferrer" class="pm-link pm-link-gold pm-body pm-focus-visible">
                        <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i> Add to Calendar
                      </a>
                      <button onclick="requestDelete('${hero.id}')" class="pm-link pm-body pm-focus-visible ${isHeroConfirming ? 'pm-link-danger' : ''}">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ${isHeroConfirming ? 'Tap again to remove' : 'Remove'}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }

          // Upcoming Grid
          if (restUpcoming.length > 0) {
            html += `
              <hr class="pm-perf" />
              <div class="flex items-baseline justify-between mb-5"><p class="pm-eyebrow">Coming soon</p><span class="pm-body text-xs pm-ash">${restUpcoming.length} title${restUpcoming.length > 1 ? 's' : ''}</span></div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-4 sm:gap-x-5 gap-y-7">
                ${restUpcoming.map(m => MovieCardTpl(m, daysUntil(m.releaseDate), false)).join('')}
              </div>
            `;
          }

          // Released Grid
          if (released.length > 0) {
            html += `
              ${hero ? '<hr class="pm-perf" />' : ''}
              <div class="flex items-baseline justify-between mb-5"><p class="pm-eyebrow" style="color: #BDB8AF">Now showing</p><span class="pm-body text-xs pm-ash">${released.length} title${released.length > 1 ? 's' : ''}</span></div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-4 sm:gap-x-5 gap-y-7" style="filter: saturate(.6); opacity: .75">
                ${released.map(m => MovieCardTpl(m, daysUntil(m.releaseDate), true)).join('')}
              </div>
            `;
          }
        }
      }

      html += `</main>`;
      html += FormModalTpl();

      appContainer.innerHTML = html;
      lucide.createIcons();
    }

  </script>
</body>
</html>
