     file's path instead. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="https://www.jstafki.com/assets/main/monolith.png">

<meta property="og:image" content="https://joshstafki.com/og-image.jpg">

<style>
:root{
  --bg:#050505;
  --fg:#f5f5f2;
  --muted:#8d8d8d;
  --violet:#7c3aed;
  --teal:#14b8a6;
  --glass-bg:rgba(245,245,242,0.06);
  --glass-border:rgba(245,245,242,0.14);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Inter,system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}

/* ───────── Starfield canvas: sits behind everything ───────── */

#space{
  position:fixed;
  inset:0;
  z-index:0;
  display:block;
}

.center{
  position:relative;
  z-index:2;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2rem;
  will-change:transform,opacity,filter;
}

.code{
  margin:0;
  font-size:clamp(4rem,16vw,11rem);
  letter-spacing:-0.05em;
  font-weight:800;
  line-height:1;
  background:linear-gradient(135deg, var(--fg) 35%, var(--violet) 75%, var(--teal) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.tag{
  color:var(--muted);
  letter-spacing:.4em;
  margin-top:1rem;
  text-transform:uppercase;
  font-size:.8rem;
}
.desc{
  color:var(--muted);
  margin-top:1.5rem;
  font-size:.95rem;
  line-height:1.6;
}
.desc strong{
  color:var(--fg);
  font-variant-numeric:tabular-nums;
}

.home-btn{
  margin-top:2.25rem;
  display:inline-block;
  border:1px solid rgba(245,245,242,0.25);
  background:var(--glass-bg);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  color:var(--fg);
  text-decoration:none;
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:14px 30px;
  border-radius:14px;
  transition:background .2s ease, border-color .2s ease;
}
.home-btn:hover, .home-btn:focus-visible{
  background:rgba(245,245,242,0.1);
  border-color:rgba(245,245,242,0.45);
}
.home-btn:focus-visible{ outline:2px solid var(--fg); outline-offset:4px; }

.sr-only{
  position:absolute;
  width:1px; height:1px;
  padding:0; margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

/* ───────── Hyperspace jump (same choreography as the index) ───────── */

body.warping .center{
  animation:pull-in 820ms cubic-bezier(.5,0,1,1) forwards;
}
@keyframes pull-in{
  0%{   transform:scale(1);    filter:blur(0);   opacity:1; }
  55%{  transform:scale(2.6);  filter:blur(3px);  opacity:1; }
  100%{ transform:scale(16);   filter:blur(18px); opacity:0; }
}

.blackout{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  z-index:10;
  pointer-events:none;
  transition:opacity .35s ease;
}
body.warping .blackout{
  opacity:1;
  transition-delay:.5s;
}

@media (prefers-reduced-motion:reduce){
  body.warping .center{
    animation:none;
    opacity:0;
    transition:opacity .35s ease;
  }
  body.warping .blackout{
    transition-delay:0s;
  }
  .home-btn{ transition:none !important; }
}
</style>
</head>
<body>

<canvas id="space" aria-hidden="true"></canvas>
<div class="blackout" aria-hidden="true"></div>

<section class="center">
  <h1 class="code">404</h1>
  <div class="tag">LOST IN TRANSIT</div>
  <p class="desc">
    This page doesn't exist in this system.<br>
    Returning home in <strong id="count">5</strong>s.
  </p>
  <a href="/" class="home-btn" id="homeLink">Return Home Now</a>
  <span class="sr-only" role="status">
    This page could not be found. You'll be redirected to the homepage automatically, or use the link to go now.
  </span>
</section>

<script>
const body = document.body;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let warping = false;

/* ───────── 3D starfield — same engine as the Monolith index ─────────
   Stars live in a real 3D frustum and are projected with
   sx = cx + x/z * fov. In ambient mode they drift toward the camera
   and twinkle; during a jump they accelerate ~30x and are drawn as
   streaks from their previous projected position. */

const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');

const STAR_COUNT = 420;
const MAX_DEPTH = 1600;      // far plane
const AMBIENT_SPEED = 275;   // units/second of forward drift
const WARP_MAX_SPEED = 9000; // units/second at full warp
const WARP_RAMP = 0.7;       // seconds to reach full speed

let width, height, cx, cy, fov;
let stars = [];
let mode = 'ambient';        // ambient | warp
let warpT = 0;
let lastTime = performance.now();

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = width / 2;
  cy = height / 2;
  fov = Math.max(width, height) * 0.8;
  if (reduceMotion) drawStatic();
}

function makeStar(randomDepth){
  return {
    x: (Math.random() - 0.5) * width * 2.4,
    y: (Math.random() - 0.5) * height * 2.4,
    z: randomDepth ? Math.random() * MAX_DEPTH : MAX_DEPTH,
    pz: 0,
    tw: Math.random() * Math.PI * 2,
    twSpeed: 0.6 + Math.random() * 1.8,
    size: 0.6 + Math.random() * 1.2
  };
}

function initStars(){
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar(true));
}

function respawn(s){
  s.x = (Math.random() - 0.5) * width * 2.4;
  s.y = (Math.random() - 0.5) * height * 2.4;
  s.z = MAX_DEPTH;
  s.pz = MAX_DEPTH;
}

function currentSpeed(){
  if (mode === 'warp'){
    const p = Math.min(warpT / WARP_RAMP, 1);
    const eased = p * p * p; // ease-in cubic
    return AMBIENT_SPEED + (WARP_MAX_SPEED - AMBIENT_SPEED) * eased;
  }
  return AMBIENT_SPEED;
}

function frame(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const speed = currentSpeed();
  const inWarp = mode === 'warp';
  if (inWarp) warpT += dt;

  if (inWarp){
    ctx.fillStyle = 'rgba(5, 5, 5, 0.35)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, width, height);
  }

  for (const s of stars){
    s.pz = s.z;
    s.z -= speed * dt;
    if (s.z <= 1){ respawn(s); continue; }

    const sx = cx + (s.x / s.z) * fov;
    const sy = cy + (s.y / s.z) * fov;
    if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50){
      respawn(s);
      continue;
    }

    const depth = 1 - s.z / MAX_DEPTH; // 0 far, 1 near

    if (inWarp && s.pz > s.z){
      const px = cx + (s.x / s.pz) * fov;
      const py = cy + (s.y / s.pz) * fov;
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.25 + depth * 0.75).toFixed(3) + ')';
      ctx.lineWidth = 0.5 + depth * 2.5;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    } else {
      s.tw += s.twSpeed * dt;
      const twinkle = 0.55 + Math.sin(s.tw) * 0.35;
      const alpha = Math.max(0.06, twinkle * (0.25 + depth * 0.75));
      const r = s.size * (0.4 + depth * 1.1);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}

// Reduced motion: a single static starfield frame, no drift, no warp.
function drawStatic(){
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, width, height);
  for (const s of stars){
    if (s.z <= 1) continue;
    const sx = cx + (s.x / s.z) * fov;
    const sy = cy + (s.y / s.z) * fov;
    if (sx < 0 || sx > width || sy < 0 || sy > height) continue;
    const depth = 1 - s.z / MAX_DEPTH;
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.15 + depth * 0.5).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, s.size * (0.4 + depth * 1.1), 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ───────── Hyperspace jump ───────── */

function jumpTo(href){
  clearInterval(redirectTimer);
  if (warping) return;
  warping = true;

  if (!reduceMotion){
    mode = 'warp';   // the background stars themselves become the streaks
    warpT = 0;
  }

  body.classList.add('warping');

  const wait = reduceMotion ? 380 : 900;
  setTimeout(() => {
    window.location.href = href;
  }, wait);
}

/* ───────── Auto-redirect countdown ─────────
   Counts down on its own; clicking the link (or running out of time)
   both funnel into the same jumpTo() used for in-menu navigation, so
   the visual is identical either way. */

const REDIRECT_HREF = '/';   // change this if "home" lives elsewhere
const REDIRECT_SECONDS = 5;  // how long to wait before auto-jumping

const countEl = document.getElementById('count');
const homeLink = document.getElementById('homeLink');
let secondsLeft = REDIRECT_SECONDS;
let redirectTimer = null;

function tick(){
  secondsLeft -= 1;
  if (secondsLeft <= 0){
    clearInterval(redirectTimer);
    jumpTo(REDIRECT_HREF);
  } else {
    countEl.textContent = secondsLeft;
  }
}

function startCountdown(){
  clearInterval(redirectTimer);
  secondsLeft = REDIRECT_SECONDS;
  countEl.textContent = secondsLeft;
  redirectTimer = setInterval(tick, 1000);
}

homeLink.addEventListener('click', (e) => {
  e.preventDefault();
  clearInterval(redirectTimer);
  jumpTo(homeLink.getAttribute('href'));
});

// If the browser restores this page from back/forward cache, it can come
// back frozen mid-warp (faded out, screen black). Reset everything and
// start the countdown over, so the page behaves like a fresh load.
window.addEventListener('pageshow', (e) => {
  if (e.persisted){
    warping = false;
    mode = 'ambient';
    warpT = 0;
    body.classList.remove('warping');
    startCountdown();
  }
});

/* ───────── Boot ───────── */

window.addEventListener('resize', resize);
resize();
initStars();
if (reduceMotion){
  drawStatic();
} else {
  requestAnimationFrame(frame);
}
startCountdown();
</script>
</body>
</html>
